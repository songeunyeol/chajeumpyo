<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>찾음표 모바일 테스터</title>
<style>
  :root { --bg:#f3efe6; --panel:#fffdf8; --ink:#1c1915; --muted:#6f675c; --line:#e2dbcf; --ok:#1e5b3d; --bad:#b3261e; --warn:#9a6700; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16140f; --panel:#1f1c16; --ink:#efe9dd; --muted:#a39a8c; --line:#353026; --ok:#6fcf97; --bad:#ff8a80; --warn:#f2c94c; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system, "Pretendard", system-ui, sans-serif; }
  .wrap { display:flex; gap:24px; padding:20px; align-items:flex-start; flex-wrap:wrap; }
  .phone { flex:none; border:10px solid #111; border-radius:44px; overflow:hidden; background:#000; box-shadow:0 10px 40px rgba(0,0,0,.25); }
  .phone iframe { display:block; border:0; background:#fff; }
  .side { flex:1; min-width:320px; display:flex; flex-direction:column; gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
  h1 { font-size:18px; margin:0 0 4px; }
  h2 { font-size:14px; margin:0 0 8px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button, select { font:inherit; padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; }
  .muted { color:var(--muted); font-size:12px; }
  code { font-size:12px; }
  #log { max-height:52vh; overflow:auto; font:12px/1.45 ui-monospace, Menlo, monospace; }
  .entry { border-top:1px solid var(--line); padding:6px 0; }
  .entry summary { cursor:pointer; }
  .s2 { color:var(--ok); } .s4 { color:var(--warn); } .s5, .s0 { color:var(--bad); }
  pre { white-space:pre-wrap; word-break:break-all; margin:4px 0 0; }
  #qr { background:#fff; padding:8px; display:inline-block; border-radius:8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="phone"><iframe id="screen" src="index.html" title="앱 화면"></iframe></div>
  <div class="side">
    <div class="card">
      <h1>찾음표 모바일 테스터</h1>
      <div class="muted">왼쪽은 휴대폰 크기 화면이에요. 찾은 사람 흐름은 실제 백엔드(Gemini)에 연결돼 있어요. 잃어버린 사람 화면은 아직 시안이에요.</div>
    </div>
    <div class="card">
      <h2>조작</h2>
      <div class="row">
        <select id="device">
          <option value="393x852">iPhone 15 (393×852)</option>
          <option value="375x667">iPhone SE (375×667)</option>
          <option value="360x780">Galaxy S24 (360×780)</option>
          <option value="412x915">Galaxy 큰 화면 (412×915)</option>
        </select>
        <button id="home">처음 화면</button>
        <button id="found">찾은 사람부터</button>
        <button id="reset">기록 지우고 처음부터</button>
        <button id="reload">새로고침</button>
      </div>
      <p class="muted" id="where"></p>
    </div>
    <div class="card">
      <h2>실제 휴대폰으로 열기 (같은 와이파이)</h2>
      <div class="row" style="align-items:flex-start">
        <div id="qr"></div>
        <div class="muted" style="flex:1">
          <div><code id="phoneUrl"></code></div>
          <p>카메라로 찍기는 실제 휴대폰에서 확인해요. 주소가 https가 아니라서 휴대폰은 위치 권한을 막을 수 있어요. 그러면 등록 화면에서 건물을 직접 고르게 돼요.</p>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between"><h2>API 요청 기록</h2><button id="clearLog">지우기</button></div>
      <div id="log"><div class="muted">아직 요청이 없어요. 찾은 사람 흐름을 진행하면 여기 쌓여요.</div></div>
    </div>
  </div>
</div>
<script src="vendor/qrcode.min.js"></script>
<script>
  const frame = document.getElementById("screen");
  const device = document.getElementById("device");
  const logEl = document.getElementById("log");
  // 휴대폰 접속 주소: ?lan=192.168.0.10 으로 이 PC의 와이파이 IP를 주면 QR을 만든다 (브라우저는 내 IP를 알 수 없다)
  const params = new URLSearchParams(location.search);
  const LAN_HOST = params.get("lan") || (location.hostname !== "localhost" && location.hostname !== "127.0.0.1" ? location.hostname : "");

  function setSize() {
    const [w, h] = device.value.split("x").map(Number);
    frame.width = w;
    frame.height = h;
  }
  device.addEventListener("change", setSize);
  setSize();

  const go = (path) => (frame.src = path);
  document.getElementById("home").onclick = () => go("index.html");
  document.getElementById("found").onclick = () => go("found/consent.html");
  document.getElementById("reload").onclick = () => frame.contentWindow.location.reload();
  document.getElementById("reset").onclick = () => {
    try { frame.contentWindow.sessionStorage.clear(); } catch (_) {}
    logEl.innerHTML = "";
    go("index.html");
  };
  document.getElementById("clearLog").onclick = () => (logEl.innerHTML = "");

  frame.addEventListener("load", () => {
    try { document.getElementById("where").textContent = "지금 화면: " + frame.contentWindow.location.pathname; } catch (_) {}
  });

  // 확정 토큰은 화면에 그대로 찍지 않는다
  const mask = (body) => JSON.stringify(body, (k, v) => (k === "confirmToken" && typeof v === "string" ? v.slice(0, 6) + "…" : v), 2);

  window.addEventListener("message", (e) => {
    if (e.origin !== location.origin || e.data?.type !== "api-log") return;
    const { method, path, status, ms, body } = e.data;
    if (logEl.querySelector(".muted")) logEl.innerHTML = "";
    const item = document.createElement("details");
    item.className = "entry";
    const cls = "s" + String(status)[0];
    const time = new Date().toLocaleTimeString("ko-KR", { hour12: false });
    item.innerHTML = `<summary><span class="${cls}">${status || "ERR"}</span> ${method} <b></b> · ${ms}ms · ${time}</summary><pre></pre>`;
    item.querySelector("b").textContent = path;
    item.querySelector("pre").textContent = mask(body);
    logEl.prepend(item);
  });

  if (LAN_HOST) {
    const phoneUrl = `http://${LAN_HOST}:${location.port}/index.html`;
    document.getElementById("phoneUrl").textContent = phoneUrl;
    try { new QRCode(document.getElementById("qr"), { text: phoneUrl, width: 120, height: 120 }); } catch (_) {}
  } else {
    document.getElementById("qr").hidden = true;
    document.getElementById("phoneUrl").textContent =
      "주소 뒤에 ?lan=이 PC의 와이파이 IP 를 붙여 다시 열면 QR이 나와요. (macOS: ipconfig getifaddr en0)";
  }
</script>
</body>
</html>
