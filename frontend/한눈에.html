<style>
  :root {
    --paper: #f3efe6;
    --ink: #1c1915;
    --mute: #9a948c;
    --line: #e4ddd2;
    --green: #1e5b3d;
    --white: #fff;
    --font: "Pretendard Variable", Pretendard, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e7e1d4; color: var(--ink); font-family: var(--font); }
  .bar {
    position: sticky; top: 0; z-index: 5;
    display: flex; gap: 8px; align-items: center;
    padding: 12px 20px;
    background: rgba(243, 239, 230, .94);
    border-bottom: 1px solid var(--line);
  }
  .bar b { font-size: 15px; margin-right: 8px; }
  .bar button, .bar span { font: 500 13px/1 var(--font); }
  .bar button {
    height: 32px; padding: 0 12px; border: 0; border-radius: 8px;
    background: var(--white); color: var(--ink); cursor: pointer;
  }
  .bar button.on { background: var(--green); color: var(--paper); }
  .bar span { color: var(--mute); }
  .board { zoom: .46; padding: 28px 32px 80px; }
  .row { margin: 0 0 40px; }
  .row h2 { margin: 0 0 14px; font-size: 18px; }
  .phones { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
  .shot h3 { margin: 0 0 8px; font-size: 13px; font-weight: 650; }
  .shot h3 a { color: var(--ink); text-decoration: none; }
  .shot h3 a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .phone {
    width: 390px; height: 844px; overflow: hidden;
    background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: 0 2px 16px rgba(28, 25, 21, .08);
  }
  .phone iframe { width: 390px; height: 844px; border: 0; display: block; background: var(--paper); }
</style>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>

  <script>
    var board = document.getElementById("board");
    var fit = document.getElementById("fit");
    var full = document.getElementById("full");
    function setZoom(z, active) {
      board.style.zoom = z;
      fit.className = active === fit ? "on" : "";
      full.className = active === full ? "on" : "";
    }
    fit.onclick = function () { setZoom("0.46", fit); };
    full.onclick = function () { setZoom("1", full); };
