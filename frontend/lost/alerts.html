<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알림 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar">
    <a class="back" href="home.html" aria-label="홈으로 돌아가기">←</a>
    <h2>알림</h2>
  </header>
  <h1>알림</h1>
  <div id="alertList" style="display:flex;flex-direction:column;gap:10px"></div>
</main>
<script src="demo-store.js"></script>
<script>
  const alertList = document.getElementById("alertList");
  const alerts = window.ChajeumAlerts.list()
    .slice()
    .sort((a, b) => b.createdAt - a.createdAt);
  const esc = window.ChajeumAlerts.esc;

  if (alerts.length === 0) {
    const empty = document.createElement("div");
    empty.className = "card";
    empty.style.color = "var(--mute)";
    empty.style.fontSize = "14px";
    empty.textContent = "아직 알림이 없어요.";
    alertList.appendChild(empty);
  } else {
    alerts.forEach((item) => {
      const link = document.createElement("a");
      link.className = "card";
      link.href = item.href || "home.html";
      link.innerHTML = `
        <h3>${esc(item.title)}</h3>
        <p class="meta">${esc(item.meta)}${item.read ? "" : " · 새 알림"}</p>
      `;
      link.addEventListener("click", () => {
        try {
          const reports = JSON.parse(sessionStorage.getItem("lostReports") || "null");
          const rep = Array.isArray(reports) ? reports.find((row) => row.id === item.reportId) : null;
          if (rep) {
            sessionStorage.setItem("activeReportId", rep.id);
            sessionStorage.setItem("lostReport", JSON.stringify(rep));
          }
        } catch (_) {}
      });
      alertList.appendChild(link);
    });
  }

  window.ChajeumAlerts.markAllRead();
</script>
</body>
</html>
