<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알림 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar">
    <a class="back" href="home" aria-label="홈으로 돌아가기">←</a>
    <h2>알림</h2>
  </header>
  <!-- 제목은 위 막대 한 곳만. 시안 카드는 두지 않는다(QA 10/29) -->
  <div id="alertList" style="display:flex;flex-direction:column">
    <p class="note" id="alertLoading">알림을 불러오는 중이에요.</p>
  </div>
</main>
<script src="api.js"></script>
<script>/* api.js를 못 받았으면(오프라인·캐시 없음) 빈 화면 대신 연결 안내를 띄운다 (검증 10/31) */if(!window.LostApi){document.body.replaceChildren();const m=document.createElement("main");m.className="screen";m.setAttribute("role","alert");m.innerHTML='<h1>인터넷 연결을 확인해 주세요</h1><p class="lead">연결되면 다시 시도해 주세요.</p>';const b=document.createElement("button");b.type="button";b.className="btn";b.textContent="다시 시도";b.addEventListener("click",()=>location.reload());m.append(b);document.body.append(m);addEventListener("online",()=>location.reload());}</script>
<script>
  // GET /notifications. 누르면 읽음(PATCH /notifications/:id/read) 후 해당 신고의 후보로
  const authed = LostApi.requireLogin();
  const list = document.getElementById("alertList");
  const TITLES = { NEW_CANDIDATE: "새 후보가 들어왔어요", CLAIM_LOCKED: "확인이 잠겼어요", MULTI_REVEAL: "알림", SYSTEM: "알림" };

  function card(n) {
    const a = document.createElement("a");
    a.className = "card";
    a.href = n.lostReportId ? "candidates" : "#";
    const h3 = document.createElement("h3");
    h3.textContent = TITLES[n.type] || "알림";
    if (!n.readAt) {
      const chip = document.createElement("span");
      chip.className = "chip warn";
      chip.style.marginLeft = "6px";
      chip.textContent = "새 알림";
      h3.appendChild(chip);
    }
    const msg = document.createElement("p");
    msg.className = "meta";
    msg.textContent = `${n.message} · ${LostApi.formatKst(n.createdAt)}`;
    a.append(h3, msg);
    a.addEventListener("click", async (e) => {
      e.preventDefault();
      if (!n.readAt) await LostApi.readNotification(n.id).catch(() => {});
      if (n.lostReportId) {
        LostApi.store.set(LostApi.KEYS.reportId, n.lostReportId);
        location.href = "candidates";
      }
    });
    return a;
  }

  if (authed) {
    LostApi.notifications()
      .then((r) => {
        if (!r.notifications.length) {
          const empty = document.createElement("div");
          empty.className = "card";
          empty.style.color = "var(--mute)";
          empty.style.fontSize = "14px";
          empty.textContent = "아직 알림이 없어요. 신고한 물건과 비슷한 물건이 들어오면 알려 줄게요.";
          list.replaceChildren(empty);
        } else {
          list.replaceChildren(...r.notifications.map(card));
        }
      })
      .catch((err) => {
        if (err.code === "UNAUTHORIZED") return location.replace("login");
        const box = document.createElement("div");
        box.className = "card";
        box.textContent = LostApi.friendlyMessage(err);
        list.replaceChildren(box);
      });
  }
</script>
</body>
</html>
