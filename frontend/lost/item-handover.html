<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 물건 · 보관처 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen" style="overflow:hidden">
  <header class="bar"><a class="back" href="candidates.html">←</a><h2 id="barTitle">확인 결과</h2></header>
  <p class="note" id="pageStatus">확인하고 있어요.</p>

  <div class="pass-to-item-viewport" id="passToItemViewport" hidden>
    <!-- 확인을 통과한 뒤에만 연다. 주소로 바로 들어오면 통과라고 보여 주지 않는다 -->
    <section class="pass-intro" id="passIntro" hidden aria-live="polite">
      <div class="pass-intro-inner">
        <span class="pass-badge" id="passBadge"></span>
        <h1>내 물건이 맞아요</h1>
        <p class="lead" style="margin-bottom:0">이제 사진과 맡긴 곳을 볼 수 있어요.</p>
      </div>
    </section>

    <!-- 2단계: 통과 문구가 위로 올라가면서 아래에서 올라오는 내 물건 상세 화면 -->
    <section class="item-reveal" id="itemReveal">
      <div class="done-photo" role="img" aria-label="확인 뒤에 열린 물건 사진" style="margin-top:14px">
        <img id="itemPhotoImg" alt="습득물 사진" hidden>
        <svg id="itemFallbackSvg" viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#efe8dc"/>
              <stop offset="100%" stop-color="#d5cbbd"/>
            </linearGradient>
          </defs>
          <rect width="360" height="200" fill="url(#bgGrad)"/>
          <rect x="121" y="68" width="118" height="72" rx="26" fill="#ffffff" stroke="#d0c6b6" stroke-width="2"/>
          <line x1="123" y1="100" x2="237" y2="100" stroke="#e2d9ca" stroke-width="2"/>
          <rect x="166" y="76" width="14" height="10" rx="3" fill="#1e5b3d" opacity="0.85"/>
          <circle cx="152" cy="58" r="15" fill="#1c1915"/>
          <circle cx="208" cy="58" r="15" fill="#1c1915"/>
        </svg>
      </div>
      <!-- 주운 건물과 찾으러 갈 곳(교무처)을 같이 찍는 캠퍼스 지도 (QA 10/30) -->
      <div class="map-box" id="itemMapBox" aria-label="주운 곳과 수령 장소 지도" hidden></div>
      <h1 id="itemTitle"></h1>
      <table class="kv">
        <tr><th>주운 곳</th><td id="itemBuilding"></td></tr>
        <tr><th>보관</th><td>보관처에 맡김</td></tr>
        <tr><th>맡긴 곳</th><td id="itemPlace">교무처<br>혜인관 1층 교무처 · 평일 9~18시</td></tr>
      </table>
      <!-- 오류만 보여 준다. "사진 링크가 10분 뒤 닫혀요"는 뜻이 헷갈려 뺐다 (QA 10/29). 화면을 다시 열면 새 링크를 받는다 -->
      <p class="note" id="expireNote" hidden></p>
      <p class="note" id="beforePickupNote">교무처에서 QR을 보여 주면 수령이 완료되고 신고가 끝나요</p>
      <p class="note" id="pickupNotice" hidden></p>
      <!-- [연결 추가] 수령 QR (qr.html이 없어져 이 화면에서 보여 준다). 기존 .qr 클래스 -->
      <div id="qrWrap" hidden>
        <div class="qr" id="qrBox" role="img" aria-label="수령 QR"></div>
        <p class="note" id="qrNote" style="text-align:center;margin-top:0"></p>
        <!-- 체험 계정: 교무처가 없으니 스캔을 대신 눌러 수령까지 끝까지 본다 (QA 10/30) -->
        <div class="card" id="demoPickupBox" hidden style="text-align:center">
          <p class="note" style="margin-top:0">체험: 교무처가 이 QR을 스캔하면 수령이 끝나요</p>
          <button class="btn line" id="demoPickupBtn" type="button">교무처 스캔 대신하기</button>
        </div>
      </div>
      <!-- 수령이 끝나면 수령 전 안내를 숨기고 마무리와 다음 행동을 보여 준다 (QA 10/30 스토리텔링) -->
      <div class="card" id="pickedUpBox" hidden style="text-align:center">
        <p style="margin:0 0 4px;font-weight:700;font-size:18px">찾았어요 🎉</p>
        <p class="note" id="pickedUpNote" style="margin-top:0"></p>
        <a class="btn" href="home.html" style="display:block;margin-top:8px">홈으로</a>
        <a class="btn line" href="../admin/login.html" style="display:block;margin-top:8px">교무처 관리자 화면 시연 보기</a>
      </div>
      <div class="dock" id="qrDock">
        <a class="btn" id="qrBtn" href="home.html">수령 QR 받기</a>
      </div>
    </section>
  </div>
</main>
<script src="../vendor/qrcode.min.js"></script>
<script src="../naver-map.js"></script>
<script src="api.js"></script>
<script>
  // 내 물건 (보관처에 맡김): GET /found-items/:id/detail → "수령 QR 받기" POST /found-items/:id/pickup-qr
  const authed = LostApi.requireLogin();
  // 주소에 물건 id가 있으면 그 물건을 연다 (권한은 서버가 확인). 없으면 마지막으로 확인한 물건
  const queryId = new URLSearchParams(location.search).get("id");
  if (queryId && /^[0-9a-f-]{36}$/i.test(queryId)) LostApi.store.set(LostApi.KEYS.foundItemId, queryId);
  const viewport = document.getElementById("passToItemViewport");
  const barTitle = document.getElementById("barTitle");
  const itemPhotoImg = document.getElementById("itemPhotoImg");
  const itemFallbackSvg = document.getElementById("itemFallbackSvg");
  const expireNote = document.getElementById("expireNote");
  const qrBtn = document.getElementById("qrBtn");
  const qrWrap = document.getElementById("qrWrap");
  const qrBox = document.getElementById("qrBox");
  const qrNote = document.getElementById("qrNote");
  const pageStatus = document.getElementById("pageStatus");
  const passIntro = document.getElementById("passIntro");
  const viewportBox = document.getElementById("passToItemViewport");
  let opened = false;

  let mode = "qr"; // qr: QR 받기 · again: 다시 받기 · home: 홈으로
  let qrTimer = null;

  let placeName = "보관처";
  function fail(err) {
    const message = LostApi.friendlyMessage(err);
    if (!opened) {
      passIntro.hidden = true;
      viewportBox.hidden = true;
      const backLink = document.querySelector(".bar .back");
      if (backLink) backLink.href = "home.html";
      pageStatus.hidden = false;
      pageStatus.classList.add("danger");
      pageStatus.textContent = LostApi.itemBlockedMessage(err);
      return;
    }
    expireNote.hidden = false;
    expireNote.textContent = message;
    expireNote.classList.add("danger");
    if (err.code === "ALREADY_CLAIMED" || err.code === "FORBIDDEN" || err.code === "NOT_FOUND") {
      mode = "home";
      qrBtn.textContent = "홈으로";
    }
  }

  function showPassed() {
    opened = true;
    pageStatus.hidden = true;
    viewportBox.hidden = false;
    passIntro.hidden = false;
    document.getElementById("passBadge").textContent = "✓ 확인 통과";
    setTimeout(() => {
      viewport.classList.add("is-shifted");
      barTitle.textContent = "내 물건";
    }, 2200);
  }

  async function load() {
    let d;
    try {
      d = await LostApi.detail();
    } catch (err) {
      if (err.code === "UNAUTHORIZED") return location.replace("login.html");
      return fail(err);
    }
    if (d.storageType === "IN_PLACE") return location.replace("item.html");
    document.getElementById("itemTitle").textContent = LostApi.itemLabel(d.category, d.subCategory);
    const place = [LostApi.buildingName(d.building, "건물 모름"), LostApi.floorLabel(d.floor)].filter(Boolean).join(" ");
    document.getElementById("itemBuilding").textContent = d.locationDetail ? `${place} · ${d.locationDetail}` : place;
    const placeTd = document.getElementById("itemPlace");
    placeTd.replaceChildren();
    if (d.storagePlace) {
      placeName = d.storagePlace.name;
      placeTd.append(d.storagePlace.name);
      if (d.storagePlace.guideText) placeTd.append(document.createElement("br"), d.storagePlace.guideText);
    } else placeTd.textContent = "-";
    if (d.pickupNotice) {
      const n = document.getElementById("pickupNotice");
      n.textContent = d.pickupNotice;
      n.hidden = false;
    }
    if (await LostApi.setImage(itemPhotoImg, d.imageUrl)) {
      itemPhotoImg.hidden = false;
      itemFallbackSvg.setAttribute("hidden", "");
    }
    // 보관처는 교무처(혜인관) 한 곳이다. 주운 건물을 모르면 교무처만 찍는다
    if (window.NaverCampusMap) {
      const found = d.building && d.building.name;
      window.NaverCampusMap.mount(document.getElementById("itemMapBox"), {
        buildingName: found || "혜인관",
        caption: `찾으러 갈 곳 · ${d.storagePlace ? d.storagePlace.name : "교무처"}`,
        highlights: found ? [{ name: found, label: `${found} · 주운 곳`, kind: "here" }] : [],
        office: true,
      });
    }
    showPassed();
  }

  const demoPickupBox = document.getElementById("demoPickupBox");
  const demoPickupBtn = document.getElementById("demoPickupBtn");
  demoPickupBtn.addEventListener("click", async () => {
    demoPickupBtn.disabled = true;
    try {
      const done = await LostApi.demoPickup();
      clearInterval(qrTimer);
      qrWrap.hidden = true;
      expireNote.hidden = true;
      document.getElementById("beforePickupNote").hidden = true;
      document.getElementById("pickupNotice").hidden = true;
      document.getElementById("qrDock").hidden = true;
      document.getElementById("pickedUpNote").textContent =
        `수령이 끝났어요 (${LostApi.formatKst(done.completedAt)}). 신고도 끝난 신고로 옮겼어요.`;
      document.getElementById("pickedUpBox").hidden = false;
      mode = "home";
    } catch (err) {
      demoPickupBtn.disabled = false;
      fail(err);
    }
  });

  function showQr(r) {
    qrBox.replaceChildren();
    if (window.QRCode) {
      new QRCode(qrBox, { text: r.qrToken, width: 176, height: 176, correctLevel: QRCode.CorrectLevel.M });
    } else {
      qrBox.textContent = "QR을 그리지 못했어요. 인터넷 연결을 확인해 주세요.";
    }
    qrWrap.hidden = false;
    demoPickupBox.hidden = r.method !== "DEMO";
    demoPickupBtn.disabled = false;
    const tick = () => {
      qrNote.textContent = `${placeName} 직원에게 보여 주세요 · ${LostApi.remaining(r.expiresAt)}. 다시 받으면 지금 QR은 바로 쓸 수 없어요.`;
    };
    tick();
    clearInterval(qrTimer);
    qrTimer = setInterval(tick, 30_000);
    mode = "again";
    qrBtn.textContent = "QR 다시 받기";
  }

  qrBtn.addEventListener("click", async (e) => {
    e.preventDefault();
    if (mode === "home") return location.assign("home.html");
    qrBtn.style.opacity = "0.6";
    try {
      // 체험 계정도 실제와 같은 QR을 보여 주고, 아래 "교무처 스캔 대신하기"로 끝낸다
      showQr(await LostApi.pickupQr());
    } catch (err) {
      fail(err);
    } finally {
      qrBtn.style.opacity = "";
    }
  });

  if (authed) load();
</script>
</body>
</html>
