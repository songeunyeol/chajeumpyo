<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 분실 신고 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar">
    <a class="brand-mark" href="../index.html" aria-label="찾음표 메인">
      <svg viewBox="0 0 320 168" aria-hidden="true">
        <path fill="#1e5b3d" d="M40 12H280a16 16 0 0 1 16 16v30a28 28 0 0 0 0 52v30a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16v-30a28 28 0 0 0 0-52V28a16 16 0 0 1 16-16z"/>
        <g fill="#f3efe6">
          <circle cx="78" cy="18" r="3.2"/>
          <circle cx="78" cy="36" r="3.2"/>
          <circle cx="78" cy="54" r="3.2"/>
          <circle cx="78" cy="72" r="3.2"/>
          <circle cx="78" cy="90" r="3.2"/>
          <circle cx="78" cy="108" r="3.2"/>
          <circle cx="78" cy="126" r="3.2"/>
          <circle cx="78" cy="144" r="3.2"/>
        </g>
      </svg>
      <img src="../leaf-white.png" alt="">
    </a>
    <span style="flex:1"></span>
    <div class="bar-actions">
      <a class="icon-btn" href="alerts.html" aria-label="알림">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="bell-dot" aria-hidden="true"></span>
      </a>
      <button type="button" class="icon-btn" id="settingsBtn" aria-label="설정 및 로그인 정보" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true">
          <line x1="4" y1="6.5" x2="20" y2="6.5"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="17.5" x2="20" y2="17.5"/>
        </svg>
      </button>
    </div>

    <div class="settings-backdrop" id="settingsBackdrop"></div>
    <div class="settings-popover" id="settingsPopover" role="dialog" aria-label="로그인 정보 및 설정">
      <p class="settings-label">로그인 정보</p>
      <div class="settings-user">
        <strong>김서경</strong>
        <p id="settingsEmail">ab***@skuniv.ac.kr</p>
        <p>010-0000-0000</p>
      </div>
      <a class="btn danger" href="login.html">로그아웃</a>
    </div>
  </header>

  <div class="banner" id="demo" hidden>체험 모드 · 시연용 데이터로 움직여요</div>
  <h1>내 분실 신고</h1>

  <p class="section section-glow"><span class="glow-dot green" aria-hidden="true"></span><span id="activeHeading">진행 중 1</span></p>
  <div id="activeList" style="display:flex;flex-direction:column;gap:10px"></div>

  <p class="section section-glow" style="margin-top:18px"><span class="glow-dot red" aria-hidden="true"></span><span id="closedHeading">닫힘 1</span></p>
  <div id="closedList" style="display:flex;flex-direction:column;gap:10px"></div>

  <div class="dock">
    <a class="btn" href="report.html">분실 신고하기</a>
  </div>
</main>
<script>
  if (new URLSearchParams(location.search).get("demo") === "1") {
    document.getElementById("demo").hidden = false;
  }

  function maskEmail(email) {
    if (!email || !email.includes("@")) return "ab***@skuniv.ac.kr";
    const [local, domain] = email.split("@");
    if (local.length <= 2) return local[0] + "***@" + domain;
    return local.slice(0, 2) + "***@" + domain;
  }

  try {
    const saved = sessionStorage.getItem("signupEmail");
    if (saved) {
      document.getElementById("settingsEmail").textContent = maskEmail(saved);
    }
  } catch (_) {}

  const settingsBtn = document.getElementById("settingsBtn");
  const settingsPopover = document.getElementById("settingsPopover");
  const settingsBackdrop = document.getElementById("settingsBackdrop");

  function setSettingsOpen(open) {
    settingsPopover.classList.toggle("is-open", open);
    settingsBackdrop.classList.toggle("is-open", open);
    settingsBtn.classList.toggle("is-active", open);
    settingsBtn.setAttribute("aria-expanded", open ? "true" : "false");
  }

  settingsBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const isOpen = settingsPopover.classList.contains("is-open");
    setSettingsOpen(!isOpen);
  });

  settingsBackdrop.addEventListener("click", () => {
    setSettingsOpen(false);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") setSettingsOpen(false);
  });

  // 진행 중 & 닫힘 분실 신고 목록 관리 (찾은 물건은 닫힘에서 10분 동안 열람 가능)
  const TEN_MIN_MS = 10 * 60 * 1000;
  const activeHeading = document.getElementById("activeHeading");
  const closedHeading = document.getElementById("closedHeading");
  const activeListEl = document.getElementById("activeList");
  const closedListEl = document.getElementById("closedList");

  function getTodayLabel() {
    const days = ["일", "월", "화", "수", "목", "금", "토"];
    const d = new Date();
    return `${d.getMonth() + 1}월 ${d.getDate()}일(${days[d.getDay()]})`;
  }

  function loadReports() {
    let list = null;
    try {
      list = JSON.parse(sessionStorage.getItem("lostReports") || "null");
    } catch (_) {}

    if (!Array.isArray(list) || list.length === 0) {
      list = [
        {
          id: "rep-seed-active",
          item: "무선 이어폰",
          date: getTodayLabel(),
          timeRange: "13:00~15:00",
          building: "혜인관",
          memo: "",
          status: "active",
          createdAt: Date.now()
        },
        {
          id: "rep-seed-closed",
          item: "우산",
          date: "10월 20일(화)",
          timeRange: "",
          building: "유담관",
          memo: "",
          status: "closed",
          foundAt: Date.now() - 40 * 1000,
          expiresAt: Date.now() + TEN_MIN_MS - 40 * 1000
        }
      ];
      try {
        sessionStorage.setItem("lostReports", JSON.stringify(list));
      } catch (_) {}
    }
    return list;
  }

  function formatRemainTime(ms) {
    const totalSec = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(totalSec / 60);
    const s = String(totalSec % 60).padStart(2, "0");
    return `${m}분 ${s}초 남음`;
  }

  function renderHomeLists() {
    const now = Date.now();
    const all = loadReports();
    const activeItems = all.filter((r) => r.status === "active");
    // 닫힘 카드는 찾은 뒤 10분(expiresAt) 동안 볼 수 있도록 필터링
    const closedItems = all.filter((r) => r.status === "closed" && (!r.expiresAt || r.expiresAt > now));

    activeHeading.textContent = `진행 중 ${activeItems.length}`;
    closedHeading.textContent = `닫힘 ${closedItems.length}`;

    activeListEl.innerHTML = "";
    if (activeItems.length === 0) {
      const empty = document.createElement("div");
      empty.className = "card";
      empty.style.color = "var(--mute)";
      empty.style.fontSize = "14px";
      empty.textContent = "진행 중인 분실 신고가 없어요.";
      activeListEl.appendChild(empty);
    } else {
      activeItems.forEach((rep) => {
        const a = document.createElement("a");
        a.className = "card glow-green";
        a.href = "candidates.html";
        const metaParts = [rep.date, rep.timeRange].filter(Boolean).join(" ");
        a.innerHTML = `
          <h3>${rep.item}</h3>
          <p class="meta">${metaParts}${rep.building ? " · " + rep.building : ""}</p>
          <div class="chips"><span class="chip glow-green">진행 중</span><span class="chip">후보 3개</span></div>
        `;
        a.addEventListener("click", () => {
          try {
            sessionStorage.setItem("activeReportId", rep.id);
            sessionStorage.setItem("lostReport", JSON.stringify(rep));
          } catch (_) {}
        });
        activeListEl.appendChild(a);
      });
    }

    closedListEl.innerHTML = "";
    if (closedItems.length === 0) {
      const empty = document.createElement("div");
      empty.className = "card";
      empty.style.color = "var(--mute)";
      empty.style.fontSize = "14px";
      empty.textContent = "열람 가능한 닫힘 내역이 없어요.";
      closedListEl.appendChild(empty);
    } else {
      closedItems.forEach((rep) => {
        const remainMs = (rep.expiresAt || (now + TEN_MIN_MS)) - now;
        const a = document.createElement("a");
        a.className = "card glow-red";
        a.href = `item.html?from=closed&id=${encodeURIComponent(rep.id)}`;
        const metaParts = [rep.date, rep.timeRange].filter(Boolean).join(" ");
        a.innerHTML = `
          <h3>${rep.item}</h3>
          <p class="meta">${metaParts}${rep.building ? " · " + rep.building : ""}</p>
          <div class="chips">
            <span class="chip glow-red">닫힘 · 찾음</span>
            <span class="chip warn" data-expires="${rep.expiresAt || (now + TEN_MIN_MS)}">10분 열람 · ${formatRemainTime(remainMs)}</span>
          </div>
        `;
        a.addEventListener("click", () => {
          try {
            sessionStorage.setItem("activeReportId", rep.id);
            sessionStorage.setItem("lostReport", JSON.stringify(rep));
          } catch (_) {}
        });
        closedListEl.appendChild(a);
      });
    }
  }

  renderHomeLists();

  // 닫힘 카드의 10분 열람 남은 시간을 1초마다 실시간 갱신 (10분 지나면 자동 닫힘)
  setInterval(() => {
    const now = Date.now();
    const badges = closedListEl.querySelectorAll("[data-expires]");
    let expiredAny = false;
    badges.forEach((el) => {
      const exp = Number(el.getAttribute("data-expires"));
      const diff = exp - now;
      if (diff <= 0) {
        expiredAny = true;
      } else {
        el.textContent = `10분 열람 · ${formatRemainTime(diff)}`;
      }
    });
    if (expiredAny) renderHomeLists();
  }, 1000);
</script>
</body>
</html>
