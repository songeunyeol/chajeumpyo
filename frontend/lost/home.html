<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 분실 신고 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar">
    <a class="brand-mark" href="../index.html" aria-label="찾음표 메인">
      <svg viewBox="0 0 320 168" aria-hidden="true">
        <path fill="#1e5b3d" d="M40 12H280a16 16 0 0 1 16 16v30a28 28 0 0 0 0 52v30a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16v-30a28 28 0 0 0 0-52V28a16 16 0 0 1 16-16z"/>
        <g fill="#f3efe6">
          <circle cx="78" cy="18" r="3.2"/>
          <circle cx="78" cy="36" r="3.2"/>
          <circle cx="78" cy="54" r="3.2"/>
          <circle cx="78" cy="72" r="3.2"/>
          <circle cx="78" cy="90" r="3.2"/>
          <circle cx="78" cy="108" r="3.2"/>
          <circle cx="78" cy="126" r="3.2"/>
          <circle cx="78" cy="144" r="3.2"/>
        </g>
      </svg>
      <img src="../leaf-white.png" alt="">
    </a>
    <span style="flex:1"></span>
    <div class="bar-actions">
      <a class="icon-btn" href="alerts.html" aria-label="알림">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="bell-dot" aria-hidden="true"></span>
      </a>
      <button type="button" class="icon-btn" id="settingsBtn" aria-label="내 계정" aria-expanded="false">
        <!-- 계정 아이콘 (QA 10/29: 메뉴 아이콘처럼 보였음) -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8.5" r="3.8"/>
          <path d="M4.5 20c1.2-3.6 4.1-5.4 7.5-5.4s6.3 1.8 7.5 5.4"/>
        </svg>
      </button>
    </div>

    <div class="settings-backdrop" id="settingsBackdrop"></div>
    <div class="settings-popover" id="settingsPopover" role="dialog" aria-label="로그인 정보 및 설정">
      <p class="settings-label">로그인 정보</p>
      <div class="settings-user">
        <strong id="settingsName">학교 이메일 계정</strong>
        <p id="settingsEmail"></p>
        <p id="settingsPhone" hidden></p>
      </div>
      <a class="btn danger" id="logoutBtn" href="login.html">로그아웃</a>
    </div>
  </header>

  <div class="banner" id="demo" hidden>체험 모드 · 시연용 데이터로 움직여요</div>
  <h1>내 분실 신고</h1>
  <div class="map-box" id="homeMap" aria-label="캠퍼스 지도"></div>

  <p class="section section-glow"><span class="glow-dot green" aria-hidden="true"></span><span id="activeHeading">진행 중</span></p>
  <div id="activeList" style="display:flex;flex-direction:column;gap:10px"></div>

  <p class="section section-glow" style="margin-top:18px"><span class="glow-dot red" aria-hidden="true"></span><span id="closedHeading">끝난 신고</span></p>
  <div id="closedList" style="display:flex;flex-direction:column;gap:10px"></div>

  <div class="dock">
    <a class="btn" href="report.html">분실 신고하기</a>
  </div>

  <!-- 신고 지우기 확인 카드 -->
  <div class="modal-backdrop" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
    <div class="modal-card">
      <span class="chip warn" id="deleteModalChip"></span>
      <h3 id="deleteModalTitle">이 분실 신고를 지울까요?</h3>
      <p>지우면 목록과 후보, 알림에서 사라지고 되돌릴 수 없어요. 확인 기회는 지워도 돌아오지 않아요.</p>
      <p class="note danger" id="deleteErr" style="margin:-8px 0 12px" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn gray" id="cancelDeleteBtn">취소</button>
        <button type="button" class="btn danger" id="confirmDeleteBtn">지우기</button>
      </div>
    </div>
  </div>
</main>
<script src="../naver-map.js"></script>
<script src="api.js"></script>
<script>
  // 로그인하지 않았으면 로그인 화면으로 (아래 API 호출은 authed일 때만)
  const authed = LostApi.requireLogin();
  if (new URLSearchParams(location.search).get("demo") === "1" || LostApi.isDemo()) {
    document.getElementById("demo").hidden = false;
  }

  // 로그인 정보: 이름·전화번호는 받지 않는다. 이메일은 가려서
  (() => {
    const s = LostApi.session();
    document.getElementById("settingsName").textContent = LostApi.isDemo() ? "체험 계정" : "학교 이메일 계정";
    document.getElementById("settingsPhone").hidden = true;
    if (s?.user?.email) document.getElementById("settingsEmail").textContent = LostApi.maskEmail(s.user.email);
  })();
  document.getElementById("logoutBtn").addEventListener("click", () => LostApi.logout());

  // 알림 점: 안 읽은 알림이 있을 때만
  const bellDot = document.querySelector(".bell-dot");
  bellDot.style.display = "none";
  if (authed) LostApi.notifications()
    .then((r) => {
      if (r.unreadCount > 0) bellDot.style.display = "";
    })
    .catch(() => {});



  const settingsBtn = document.getElementById("settingsBtn");
  const settingsPopover = document.getElementById("settingsPopover");
  const settingsBackdrop = document.getElementById("settingsBackdrop");

  function setSettingsOpen(open) {
    settingsPopover.classList.toggle("is-open", open);
    settingsBackdrop.classList.toggle("is-open", open);
    settingsBtn.classList.toggle("is-active", open);
    settingsBtn.setAttribute("aria-expanded", open ? "true" : "false");
  }

  settingsBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const isOpen = settingsPopover.classList.contains("is-open");
    setSettingsOpen(!isOpen);
  });

  settingsBackdrop.addEventListener("click", () => {
    setSettingsOpen(false);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") setSettingsOpen(false);
  });

  // 진행 중(OPEN) & 끝난 신고(RESOLVED 찾음 · CLOSED 종료) 목록: GET /lost-reports
  const activeHeading = document.getElementById("activeHeading");
  const closedHeading = document.getElementById("closedHeading");
  const activeListEl = document.getElementById("activeList");
  const closedListEl = document.getElementById("closedList");

  function emptyCard(text) {
    const empty = document.createElement("div");
    empty.className = "card";
    empty.style.color = "var(--mute)";
    empty.style.fontSize = "14px";
    empty.textContent = text;
    return empty;
  }

  /** 카드 한 장. 서버 값은 textContent로만 넣는다 */
  function reportCard(rep, tag, glow, chips) {
    const el = document.createElement(tag);
    el.className = `card ${glow}`;
    const h3 = document.createElement("h3");
    h3.textContent = LostApi.itemLabel(rep.category);
    const meta = document.createElement("p");
    meta.className = "meta";
    meta.textContent = [LostApi.formatRange(rep.lostFrom, rep.lostTo), LostApi.buildingName(rep.building, "")]
      .filter(Boolean)
      .join(" · ");
    const chipBox = document.createElement("div");
    chipBox.className = "chips";
    for (const [text, cls] of chips) {
      const c = document.createElement("span");
      c.className = `chip ${cls}`.trim();
      c.textContent = text;
      chipBox.appendChild(c);
    }
    el.append(h3, meta, chipBox);
    return el;
  }

  const TRASH_SVG =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';

  /** 카드 오른쪽 위에 휴지통을 단다. 카드가 링크(<a>)일 수 있어 버튼은 링크 밖 형제로 둔다 */
  function withTrash(card, rep) {
    const wrap = document.createElement("div");
    wrap.className = "card-wrap";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "card-trash";
    btn.setAttribute("aria-label", "신고 지우기");
    btn.innerHTML = TRASH_SVG;
    btn.addEventListener("click", () => openDelete(rep));
    wrap.append(card, btn);
    return wrap;
  }

  // 신고 지우기 확인 카드: DELETE /lost-reports/:id
  const deleteModal = document.getElementById("deleteModal");
  const deleteModalChip = document.getElementById("deleteModalChip");
  const deleteErr = document.getElementById("deleteErr");
  const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");
  let reports = [];
  let deleting = null;

  function openDelete(rep) {
    deleting = rep;
    deleteModalChip.textContent = [LostApi.itemLabel(rep.category), LostApi.formatRange(rep.lostFrom, rep.lostTo)]
      .filter(Boolean)
      .join(" · ");
    deleteErr.hidden = true;
    confirmDeleteBtn.disabled = false;
    deleteModal.classList.add("is-open");
    document.getElementById("cancelDeleteBtn").focus();
  }
  const closeDelete = () => {
    deleteModal.classList.remove("is-open");
    deleting = null;
  };
  document.getElementById("cancelDeleteBtn").addEventListener("click", closeDelete);
  deleteModal.addEventListener("click", (e) => {
    if (e.target === deleteModal) closeDelete();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && deleting) closeDelete();
  });
  confirmDeleteBtn.addEventListener("click", async () => {
    if (!deleting) return;
    const id = deleting.id;
    confirmDeleteBtn.disabled = true;
    try {
      await LostApi.deleteReport(id);
      if (LostApi.store.get(LostApi.KEYS.reportId) === id) LostApi.store.set(LostApi.KEYS.reportId, null);
      reports = reports.filter((r) => r.id !== id);
      closeDelete();
      renderHomeLists(reports);
    } catch (err) {
      if (err.code === "UNAUTHORIZED") return location.replace("login.html");
      // 이미 지워진 신고면 목록에서만 뺀다
      if (err.code === "NOT_FOUND") {
        reports = reports.filter((r) => r.id !== id);
        closeDelete();
        renderHomeLists(reports);
        return;
      }
      deleteErr.textContent = LostApi.friendlyMessage(err);
      deleteErr.hidden = false;
      confirmDeleteBtn.disabled = false;
    }
  });

  function paintHomeMap(reports) {
    const box = document.getElementById("homeMap");
    if (!window.NaverCampusMap) return;
    const named = (reports || [])
      .map((rep) => rep.building && rep.building.name)
      .find((name) => name && window.NaverCampusMap.CAMPUS_BUILDINGS[name]);
    // 신고한 건물과 수령 장소(교무처)를 같이 보여 준다
    window.NaverCampusMap.mount(box, {
      buildingName: named || "혜인관",
      caption: named ? `서경대 ${named} · 잃어버린 곳` : "분실물 보관 · 혜인관 1층 교무처",
      highlights: named ? [{ name: named, label: `${named} · 잃어버린 곳`, kind: "here" }] : [],
      office: true,
    });
  }

  function renderHomeLists(all) {
    const activeItems = all.filter((r) => r.status === "OPEN");
    const closedItems = all.filter((r) => r.status !== "OPEN");

    activeHeading.textContent = `진행 중 ${activeItems.length}`;
    closedHeading.textContent = `끝난 신고 ${closedItems.length}`;

    activeListEl.replaceChildren();
    if (activeItems.length === 0)
      activeListEl.appendChild(emptyCard(all.length === 0 ? "아직 신고 내역이 없어요." : "진행 중인 분실 신고가 없어요."));
    for (const rep of activeItems) {
      const qr = qrHref(rep);
      const chips = [["진행 중", "glow-green"], qr ? ["수령 QR 받음", ""] : [`후보 ${rep.candidateCount}개`, ""]];
      const a = reportCard(rep, "a", "glow-green", chips);
      // 수령 QR을 받아 둔 신고는 후보를 거치지 않고 QR 화면을 바로 연다
      a.href = qr || "candidates.html";
      a.addEventListener("click", () => LostApi.store.set(LostApi.KEYS.reportId, rep.id));
      activeListEl.appendChild(withTrash(a, rep));
    }

    // 끝난 신고: 수령 완료는 누를 곳이 없다(물건 상세는 수령 뒤 닫힌다, 409 ALREADY_CLAIMED).
    // 아직 찾지 않은 보관처 물건이 있으면 QR 화면을 다시 연다. 그 밖의 종료 신고는 서버가 후보를 주지 않아 누를 곳이 없다
    closedListEl.replaceChildren();
    if (closedItems.length === 0) closedListEl.appendChild(emptyCard("아직 끝난 신고가 없어요."));
    for (const rep of closedItems) {
      const done = rep.status === "RESOLVED" || rep.pickup?.status === "COMPLETED";
      const qr = done ? null : qrHref(rep);
      let card;
      if (qr) {
        card = reportCard(rep, "a", "glow-red", [["종료", "glow-red"], ["수령 QR 보기", ""]]);
        card.href = qr;
        card.addEventListener("click", () => LostApi.store.set(LostApi.KEYS.reportId, rep.id));
      } else {
        card = reportCard(rep, "div", "glow-red", [[done ? "수령 완료" : "종료", "glow-red"]]);
        card.classList.add("is-inert");
        card.setAttribute("aria-disabled", "true");
      }
      closedListEl.appendChild(withTrash(card, rep));
    }
  }

  /** 확인을 통과했고 아직 찾지 않은 보관처 물건이면 QR 화면 주소. 그 자리에 둔 물건·통과 전·수령 완료면 null */
  function qrHref(rep) {
    const p = rep.pickup;
    if (!p || p.status === "COMPLETED" || p.storageType !== "HANDED_OVER") return null;
    if (rep.status === "OPEN" && p.status !== "QR_ISSUED") return null; // 진행 중이면 QR을 받은 뒤에만 바로 간다
    return `item-handover.html?id=${encodeURIComponent(p.foundItemId)}&qr=1`;
  }

  paintHomeMap([]);
  if (authed) LostApi.reports()
    .then((all) => {
      reports = all;
      paintHomeMap(all);
      renderHomeLists(all);
    })
    .catch((err) => {
      if (err.code === "UNAUTHORIZED") return location.replace("login.html");
      activeHeading.textContent = "진행 중";
      closedHeading.textContent = "끝난 신고";
      activeListEl.replaceChildren(emptyCard(LostApi.friendlyMessage(err)));
    });
</script>
</body>
</html>
