<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 분실 신고 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar">
    <a class="brand-mark" href="../index.html" aria-label="찾음표 메인">
      <svg viewBox="0 0 320 168" aria-hidden="true">
        <path fill="#1e5b3d" d="M40 12H280a16 16 0 0 1 16 16v30a28 28 0 0 0 0 52v30a16 16 0 0 1-16 16H40a16 16 0 0 1-16-16v-30a28 28 0 0 0 0-52V28a16 16 0 0 1 16-16z"/>
        <g fill="#f3efe6">
          <circle cx="78" cy="18" r="3.2"/>
          <circle cx="78" cy="36" r="3.2"/>
          <circle cx="78" cy="54" r="3.2"/>
          <circle cx="78" cy="72" r="3.2"/>
          <circle cx="78" cy="90" r="3.2"/>
          <circle cx="78" cy="108" r="3.2"/>
          <circle cx="78" cy="126" r="3.2"/>
          <circle cx="78" cy="144" r="3.2"/>
        </g>
      </svg>
      <img src="../leaf-white.png" alt="">
    </a>
    <span style="flex:1"></span>
    <div class="bar-actions">
      <a class="icon-btn" href="alerts.html" aria-label="알림">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="bell-dot" aria-hidden="true"></span>
      </a>
      <button type="button" class="icon-btn" id="settingsBtn" aria-label="설정 및 로그인 정보" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true">
          <line x1="4" y1="6.5" x2="20" y2="6.5"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="17.5" x2="20" y2="17.5"/>
        </svg>
      </button>
    </div>

    <div class="settings-backdrop" id="settingsBackdrop"></div>
    <div class="settings-popover" id="settingsPopover" role="dialog" aria-label="로그인 정보 및 설정">
      <p class="settings-label">로그인 정보</p>
      <div class="settings-user">
        <strong id="settingsName">김서경</strong>
        <p id="settingsEmail">ab***@skuniv.ac.kr</p>
        <p id="settingsPhone">010-0000-0000</p>
      </div>
      <a class="btn danger" id="logoutBtn" href="login.html">로그아웃</a>
    </div>
  </header>

  <div class="banner" id="demo" hidden>체험 모드 · 시연용 데이터로 움직여요</div>
  <h1>내 분실 신고</h1>

  <p class="section section-glow"><span class="glow-dot green" aria-hidden="true"></span><span id="activeHeading">진행 중 1</span></p>
  <div id="activeList" style="display:flex;flex-direction:column;gap:10px"></div>

  <p class="section section-glow" style="margin-top:18px"><span class="glow-dot red" aria-hidden="true"></span><span id="closedHeading">닫힘 1</span></p>
  <div id="closedList" style="display:flex;flex-direction:column;gap:10px"></div>

  <div class="dock">
    <a class="btn" href="report.html">분실 신고하기</a>
  </div>
</main>
<script src="api.js"></script>
<script>
  // 로그인하지 않았으면 로그인 화면으로 (아래 API 호출은 authed일 때만)
  const authed = LostApi.requireLogin();
  if (new URLSearchParams(location.search).get("demo") === "1" || LostApi.isDemo()) {
    document.getElementById("demo").hidden = false;
  }

  // 로그인 정보: 이름·전화번호는 받지 않는다. 이메일은 가려서
  (() => {
    const s = LostApi.session();
    document.getElementById("settingsName").textContent = LostApi.isDemo() ? "체험 계정" : "학교 이메일 계정";
    document.getElementById("settingsPhone").hidden = true;
    if (s?.user?.email) document.getElementById("settingsEmail").textContent = LostApi.maskEmail(s.user.email);
  })();
  document.getElementById("logoutBtn").addEventListener("click", () => LostApi.logout());

  // 알림 점: 안 읽은 알림이 있을 때만
  const bellDot = document.querySelector(".bell-dot");
  bellDot.style.display = "none";
  if (authed) LostApi.notifications()
    .then((r) => {
      if (r.unreadCount > 0) bellDot.style.display = "";
    })
    .catch(() => {});



  const settingsBtn = document.getElementById("settingsBtn");
  const settingsPopover = document.getElementById("settingsPopover");
  const settingsBackdrop = document.getElementById("settingsBackdrop");

  function setSettingsOpen(open) {
    settingsPopover.classList.toggle("is-open", open);
    settingsBackdrop.classList.toggle("is-open", open);
    settingsBtn.classList.toggle("is-active", open);
    settingsBtn.setAttribute("aria-expanded", open ? "true" : "false");
  }

  settingsBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const isOpen = settingsPopover.classList.contains("is-open");
    setSettingsOpen(!isOpen);
  });

  settingsBackdrop.addEventListener("click", () => {
    setSettingsOpen(false);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") setSettingsOpen(false);
  });

  // 진행 중(OPEN) & 닫힘(RESOLVED 찾음 · CLOSED 닫음) 분실 신고 목록: GET /lost-reports
  const activeHeading = document.getElementById("activeHeading");
  const closedHeading = document.getElementById("closedHeading");
  const activeListEl = document.getElementById("activeList");
  const closedListEl = document.getElementById("closedList");

  function emptyCard(text) {
    const empty = document.createElement("div");
    empty.className = "card";
    empty.style.color = "var(--mute)";
    empty.style.fontSize = "14px";
    empty.textContent = text;
    return empty;
  }

  /** 카드 한 장. 서버 값은 textContent로만 넣는다 */
  function reportCard(rep, tag, glow, chips) {
    const el = document.createElement(tag);
    el.className = `card ${glow}`;
    const h3 = document.createElement("h3");
    h3.textContent = LostApi.itemLabel(rep.category);
    const meta = document.createElement("p");
    meta.className = "meta";
    meta.textContent = [LostApi.formatRange(rep.lostFrom, rep.lostTo), LostApi.buildingName(rep.building, "")]
      .filter(Boolean)
      .join(" · ");
    const chipBox = document.createElement("div");
    chipBox.className = "chips";
    for (const [text, cls] of chips) {
      const c = document.createElement("span");
      c.className = `chip ${cls}`.trim();
      c.textContent = text;
      chipBox.appendChild(c);
    }
    el.append(h3, meta, chipBox);
    return el;
  }

  function renderHomeLists(all) {
    const activeItems = all.filter((r) => r.status === "OPEN");
    const closedItems = all.filter((r) => r.status !== "OPEN");

    activeHeading.textContent = `진행 중 ${activeItems.length}`;
    closedHeading.textContent = `닫힘 ${closedItems.length}`;

    activeListEl.replaceChildren();
    if (activeItems.length === 0) activeListEl.appendChild(emptyCard("진행 중인 분실 신고가 없어요."));
    for (const rep of activeItems) {
      const a = reportCard(rep, "a", "glow-green", [
        ["진행 중", "glow-green"],
        [`후보 ${rep.candidateCount}개`, ""],
      ]);
      a.href = "candidates.html";
      a.addEventListener("click", () => LostApi.store.set(LostApi.KEYS.reportId, rep.id));
      activeListEl.appendChild(a);
    }

    // 닫힌 신고는 서버가 후보를 주지 않고, 찾은 물건 상세는 수령 뒤 닫힌다(409 ALREADY_CLAIMED). 그래서 누를 곳이 없다
    closedListEl.replaceChildren();
    if (closedItems.length === 0) closedListEl.appendChild(emptyCard("닫힌 신고가 없어요."));
    for (const rep of closedItems) {
      closedListEl.appendChild(
        reportCard(rep, "div", "glow-red", [[rep.status === "RESOLVED" ? "닫힘 · 찾음" : "닫힘", "glow-red"]]),
      );
    }
  }

  if (authed) LostApi.reports()
    .then(renderHomeLists)
    .catch((err) => {
      if (err.code === "UNAUTHORIZED") return location.replace("login.html");
      activeHeading.textContent = "진행 중";
      closedHeading.textContent = "닫힘";
      activeListEl.replaceChildren(emptyCard(LostApi.friendlyMessage(err)));
    });
</script>
</body>
</html>
