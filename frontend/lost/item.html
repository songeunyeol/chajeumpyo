<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 물건 · 그 자리 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen" style="overflow:hidden">
  <header class="bar"><a class="back" href="candidates.html">←</a><h2 id="barTitle">확인 결과</h2></header>
  <p class="note" id="pageStatus">확인하고 있어요.</p>

  <div class="pass-to-item-viewport" id="passToItemViewport" hidden>
    <!-- 확인을 통과한 뒤에만 연다. 주소로 바로 들어오면 통과라고 보여 주지 않는다 -->
    <section class="pass-intro" id="passIntro" hidden aria-live="polite">
      <div class="pass-intro-inner">
        <span class="pass-badge" id="passBadge"></span>
        <h1>내 물건이 맞아요</h1>
        <p class="lead" style="margin-bottom:0">이제 사진과 놓인 곳을 볼 수 있어요.</p>
        <p class="ai-read-line" id="passAiLine" hidden style="margin-top:10px">🤖 <span id="passAiText"></span></p>
      </div>
    </section>

    <!-- 2단계: 통과 문구가 위로 올라가면서 아래에서 올라오는 내 물건 상세 화면 -->
    <section class="item-reveal" id="itemReveal">
      <div class="done-photo" role="img" aria-label="확인 뒤에 열린 물건 사진" style="margin-top:8px">
        <img id="itemPhotoImg" alt="습득물 사진" hidden>
        <svg id="itemFallbackSvg" viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#efe8dc"/>
              <stop offset="100%" stop-color="#d5cbbd"/>
            </linearGradient>
          </defs>
          <rect width="360" height="200" fill="url(#bgGrad)"/>
          <rect x="121" y="68" width="118" height="72" rx="26" fill="#ffffff" stroke="#d0c6b6" stroke-width="2"/>
          <line x1="123" y1="100" x2="237" y2="100" stroke="#e2d9ca" stroke-width="2"/>
          <rect x="166" y="76" width="14" height="10" rx="3" fill="#1e5b3d" opacity="0.85"/>
          <circle cx="152" cy="58" r="15" fill="#1c1915"/>
          <circle cx="208" cy="58" r="15" fill="#1c1915"/>
        </svg>
      </div>

      <!-- 물건 위치를 등록한 곳에 뜨는 네이버 지도 -->
      <div class="map-box" id="itemMapBox" aria-label="물건이 놓인 위치 지도"></div>

      <h1 id="itemTitle" style="margin:6px 0 8px;font-size:26px"></h1>
      <table class="kv">
        <tr><th>주운 곳</th><td id="itemBuilding"></td></tr>
        <tr><th>보관</th><td id="itemStorage"></td></tr>
        <tr><th>습득</th><td id="itemTime"></td></tr>
      </table>
      <!-- 오류만 보여 준다. "10분 뒤 닫혀요" 안내는 뜻이 헷갈려 뺐다 (QA 10/29). 화면을 다시 열면 새 사진 링크를 받는다 -->
      <p class="note" id="expireNote" style="margin-top:8px" hidden></p>
      <div class="dock" style="padding-top:14px">
        <a class="btn" id="selfPickupBtn" href="home.html">확인했어요</a>
      </div>
    </section>
  </div>
</main>
<script src="../naver-map.js"></script>
<script src="api.js"></script>
<script>
  // 내 물건 (그 자리에 둠): GET /found-items/:id/detail. 통과한 계정만 볼 수 있고 열람 기록이 남는다
  const authed = LostApi.requireLogin();
  // 주소에 물건 id가 있으면 그 물건을 연다 (권한은 서버가 확인). 없으면 마지막으로 확인한 물건
  const queryId = new URLSearchParams(location.search).get("id");
  if (queryId && /^[0-9a-f-]{36}$/i.test(queryId)) LostApi.store.set(LostApi.KEYS.foundItemId, queryId);
  const viewport = document.getElementById("passToItemViewport");
  const barTitle = document.getElementById("barTitle");
  const backLink = document.querySelector(".bar .back");
  const itemPhotoImg = document.getElementById("itemPhotoImg");
  const itemFallbackSvg = document.getElementById("itemFallbackSvg");
  const itemBuildingEl = document.getElementById("itemBuilding");
  const expireNoteEl = document.getElementById("expireNote");
  const selfPickupBtn = document.getElementById("selfPickupBtn");
  const params = new URLSearchParams(location.search);
  const isFromClosed = params.get("from") === "closed";
  const pageStatus = document.getElementById("pageStatus");
  const passIntro = document.getElementById("passIntro");
  const viewportBox = document.getElementById("passToItemViewport");
  let opened = false;

  if (isFromClosed && backLink) backLink.href = "home.html";

  function showError(err) {
    if (opened) {
      expireNoteEl.hidden = false;
      expireNoteEl.textContent = LostApi.friendlyMessage(err);
      expireNoteEl.classList.add("danger");
      selfPickupBtn.textContent = "홈으로";
      selfPickupBtn.dataset.done = "1";
      return;
    }
    passIntro.hidden = true;
    viewportBox.hidden = true;
    if (backLink) backLink.href = "home.html";
    pageStatus.hidden = false;
    pageStatus.classList.add("danger");
    pageStatus.textContent = LostApi.itemBlockedMessage(err);
  }

  function showPassed() {
    opened = true;
    pageStatus.hidden = true;
    viewportBox.hidden = false;
    passIntro.hidden = false;
    document.getElementById("passBadge").textContent = "✓ 확인 통과";
    // AI가 한 일 한 줄 (신고자 본인 표현 기준, 통과 후에만)
    const aiText = LostApi.passExplanation(
      LostApi.store.get(LostApi.KEYS.claim),
      LostApi.store.get(LostApi.KEYS.aiRead),
      new URLSearchParams(location.search).get("id") || LostApi.store.get(LostApi.KEYS.foundItemId),
    );
    document.getElementById("passAiText").textContent = aiText;
    document.getElementById("passAiLine").hidden = !aiText;
    const wait = isFromClosed ? 0 : 2200;
    setTimeout(() => {
      viewport.classList.add("is-shifted");
      barTitle.textContent = "내 물건";
    }, wait);
  }

  async function load() {
    let d;
    try {
      d = await LostApi.detail();
    } catch (err) {
      if (err.code === "UNAUTHORIZED") return location.replace("login.html");
      return showError(err);
    }
    // 보관처에 맡긴 물건이면 그 화면으로
    if (d.storageType === "HANDED_OVER") return location.replace("item-handover.html");

    document.getElementById("itemTitle").textContent = LostApi.itemLabel(d.category, d.subCategory);
    const place = [LostApi.buildingName(d.building, "건물 모름"), LostApi.floorLabel(d.floor)].filter(Boolean).join(" ");
    itemBuildingEl.textContent = d.locationDetail ? `${place} · ${d.locationDetail}` : place;
    document.getElementById("itemStorage").textContent = LostApi.STORAGE_TYPE_LABELS[d.storageType];
    document.getElementById("itemTime").textContent = LostApi.formatKst(d.foundAt);
    if (await LostApi.setImage(itemPhotoImg, d.imageUrl)) {
      itemPhotoImg.hidden = false;
      itemFallbackSvg.setAttribute("hidden", "");
    }
    // 지도 핀은 건물 좌표에만 (물건 좌표는 서버가 주지 않는다). 건물을 모르면 지도를 그리지 않는다
    const mapBox = document.getElementById("itemMapBox");
    if (d.building && window.NaverCampusMap) {
      window.NaverCampusMap.mount(mapBox, {
        buildingName: d.building.name,
        caption: `서경대 ${d.building.name} · 그 자리 보관`,
      });
    }
    else mapBox.hidden = true;
    showPassed();
  }

  // "확인했어요": POST /found-items/:id/self-pickup (가져갔다고 기록) → 홈
  selfPickupBtn.addEventListener("click", async (e) => {
    e.preventDefault();
    if (selfPickupBtn.dataset.done) return location.assign("home.html");
    selfPickupBtn.style.opacity = "0.6";
    try {
      await LostApi.selfPickup();
      location.assign("home.html");
    } catch (err) {
      selfPickupBtn.style.opacity = "";
      showError(err);
    }
  });

  if (authed) load();
</script>
</body>
</html>
