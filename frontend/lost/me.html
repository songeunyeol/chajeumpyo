<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 정보 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar">
    <a class="back" href="home" aria-label="홈으로 돌아가기">←</a>
    <h2>내 정보</h2>
  </header>
  <h1>내 정보</h1>
  <p class="who" id="meWho">김서경</p>
  <div class="card">
    <h3 id="meEmail">ab***@skuniv.ac.kr</h3>
    <p class="meta" id="meMeta">010-0000-0000</p>
  </div>
  <div class="dock">
    <a class="btn danger" id="logoutBtn" href="login">로그아웃</a>
  </div>
</main>
<script src="api.js"></script>
<script>
  // GET /me. 이름·전화번호는 받지 않으므로 계정 종류와 가린 이메일만 보여 준다
  const authed = LostApi.requireLogin();
  document.getElementById("logoutBtn").addEventListener("click", () => LostApi.logout());
  if (authed) {
    LostApi.me()
      .then((me) => {
        const demo = me.role === "DEMO";
        document.getElementById("meWho").textContent = demo ? "체험 계정" : "학교 이메일 계정";
        document.getElementById("meEmail").textContent = demo ? "체험 계정" : LostApi.maskEmail(me.email);
        document.getElementById("meMeta").textContent = demo
          ? "24시간 뒤 지워져요. 시연용 물건만 후보로 보여요."
          : `로그인은 ${LostApi.formatKst(LostApi.session()?.expiresAt)}까지 유지돼요.`;
      })
      .catch((err) => {
        if (err.code === "UNAUTHORIZED") return location.replace("login");
        document.getElementById("meMeta").textContent = LostApi.friendlyMessage(err);
      });
  }
</script>
</body>
</html>
