<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>분실 신고 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar"><a class="back" href="home.html">←</a><h2>분실 신고</h2></header>
  <h1>무엇을 잃어버렸나요</h1>
  <p class="lead">확인에 쓰는 특징은 나중에 질문으로만 나와요.</p>

  <label class="field">
    <span>물건 <small class="opt">(선택)</small></span>
    <input id="lostItemInput" placeholder="무선 이어폰">
  </label>

  <!-- [연결 추가] 서버는 종류(category)가 꼭 필요하다. 물건 이름으로 미리 고르고 사람이 고칠 수 있게 -->
  <label class="field">
    <span>종류 <b class="req" aria-hidden="true">*</b></span>
    <select id="lostCategorySelect" aria-label="물건 종류 선택"></select>
  </label>

  <div class="field">
    <span>언제 <b class="req" aria-hidden="true">*</b></span>
    <div class="when-stack">
      <select id="lostDateSelect" aria-label="잃어버린 날짜 선택"></select>
      <div class="time-range-grid" id="timeRangeGrid">
        <select id="lostStartHour" aria-label="시작 시간 선택"></select>
        <span class="time-range-sep">~</span>
        <select id="lostEndHour" aria-label="종료 시간 선택"></select>
      </div>
      <!-- 아직 오지 않은 시간을 고르면 어제로 맞춘다는 걸 알려 준다 (QA 10/30: 말없이 어제로 바뀌던 문제) -->
      <p class="note" id="timeNote" hidden aria-live="polite" style="margin:0"></p>
    </div>
  </div>

  <label class="field">
    <span>어디 (건물) <b class="req" aria-hidden="true">*</b></span>
    <select id="lostBuildingSelect" aria-label="잃어버린 건물 선택">
      <!-- 서버 목록이 오기 전 기본값. prisma/seed-data/buildings.json과 같은 13곳 (QA 10/31) -->
      <option value="본관">본관</option>
      <option value="유담관">유담관</option>
      <option value="한림관">한림관</option>
      <option value="북악관">북악관</option>
      <option value="문예관">문예관</option>
      <option value="대일관">대일관</option>
      <option value="상승관">상승관</option>
      <option value="청운관">청운관</option>
      <option value="혜인관">혜인관</option>
      <option value="은주관">은주관</option>
      <option value="수인관">수인관</option>
      <option value="생활관">생활관</option>
      <option value="공연실습소">공연실습소</option>
      <option value="" selected>잘 모르겠음 (캠퍼스 전체)</option>
    </select>
  </label>

  <div class="field">
    <div class="field-head">
      <label for="memoInput"><span>기억나는 점 <small class="opt">(선택) 특징을 적으면 확인이 빨라요</small></span></label>
      <span class="loc-chip" id="memoCount" style="cursor:default">0 / 200자</span>
    </div>
    <textarea id="memoInput" class="auto-grow" maxlength="200" placeholder="공개 목록에는 이 문장만 보여요."></textarea>
  </div>

  <p class="note danger" id="reportErr" hidden></p>

  <div class="dock">
    <button type="button" class="btn" id="reportSubmitBtn" style="width:100%;cursor:pointer">신고하기</button>
  </div>
</main>
<script src="api.js"></script>
<script src="../leave-guard.js"></script>
<script>
  const leaveGuard = LeaveGuard.install({
    title: "분실 신고를 그만할까요?",
    message: "지금까지 적은 내용은 지워져요. 그래도 나갈까요?",
    leaveTo: "home.html",
    onLeave: () => LostApi.store.set(LostApi.KEYS.reportDraft, null),
  });
</script>
<script>
  const authed = LostApi.requireLogin();
  const dateSelect = document.getElementById("lostDateSelect");
  const startSelect = document.getElementById("lostStartHour");
  const endSelect = document.getElementById("lostEndHour");
  const itemInput = document.getElementById("lostItemInput");
  const buildingSelect = document.getElementById("lostBuildingSelect");
  buildingSelect.addEventListener("change", () => (buildingSelect.dataset.touched = "1"));
  const memoInput = document.getElementById("memoInput");
  const memoCount = document.getElementById("memoCount");
  const submitBtn = document.getElementById("reportSubmitBtn");

  // 1. 당일 기준 날짜 셀렉트 생성
  // 표시는 "10월 28일(수)", 값은 한국 날짜 "2026-10-28" (서버로 보낼 때 LostApi.lostRange로 ISO로 바꾼다)
  const DAY_MS = 24 * 3600 * 1000;
  for (let offset = 0; offset < 7; offset++) {
    const p = LostApi.kstParts(new Date(Date.now() - offset * DAY_MS));
    const baseText = `${p.month}월 ${p.day}일(${p.weekday})`;
    const label = offset === 0 ? `오늘 · ${baseText}` : offset === 1 ? `어제 · ${baseText}` : baseText;
    const opt = new Option(label, p.date, offset === 0, offset === 0);
    opt.dataset.label = baseText;
    dateSelect.add(opt);
  }
  dateSelect.add(new Option("일주일 이전", "older"));
  // 언제인지 모를 때 (QA 10/29): 최근 7일 전체로 찾는다
  dateSelect.add(new Option("잘 모르겠음 (최근 7일)", "unknown"));

  // 종류: 물건 이름을 적으면 미리 고른다. 사람이 직접 고르면 그 뒤로는 바꾸지 않는다
  const categorySelect = document.getElementById("lostCategorySelect");
  // 세부 종류가 있는 큰 종류는 묶음으로 보여 준다 (예: 기타 전자기기 → 마우스, 키보드). 값은 "큰종류:세부종류"
  for (const c of LostApi.CATEGORIES) {
    const subs = LostApi.SUB_CATEGORIES[c];
    if (!subs) {
      categorySelect.add(new Option(LostApi.CATEGORY_LABELS[c], c));
      continue;
    }
    const group = document.createElement("optgroup");
    group.label = LostApi.CATEGORY_LABELS[c];
    group.append(new Option(`${LostApi.CATEGORY_LABELS[c]} (잘 모르겠음)`, c));
    for (const sub of subs) group.append(new Option(LostApi.SUB_CATEGORY_LABELS[sub], `${c}:${sub}`));
    categorySelect.append(group);
  }
  categorySelect.value = "EARPHONE";
  /** 물건 이름으로 고를 값: 세부 종류까지 알면 "큰종류:세부종류", 아니면 큰 종류 */
  const guessOption = (text) => {
    const c = LostApi.guessCategory(text);
    if (!c) return null;
    const sub = LostApi.guessSubCategory(c, text);
    return sub ? `${c}:${sub}` : c;
  };
  let categoryTouched = false;
  categorySelect.addEventListener("change", () => {
    categoryTouched = true;
  });
  document.getElementById("lostItemInput").addEventListener("input", (e) => {
    const guess = guessOption(e.target.value);
    if (guess && !categoryTouched) categorySelect.value = guess;
  });

  // 건물: 서버 건물 목록으로 바꾼다 (모르면 "잘 모르겠음" = buildingId 없음)
  if (authed) {
    LostApi.buildings()
      .then((list) => {
        const sel = document.getElementById("lostBuildingSelect");
        // 목록이 늦게 오면 그사이 고른 건물을 이름으로 이어 준다. 전에는 무조건 "잘 모르겠음"으로 돌아가
        // 청운관을 골라도 건물 없이 신고돼 "같은 건물" 근거가 빠졌다 (교수 평가 10/30)
        const picked = sel.dataset.touched ? sel.selectedOptions[0]?.textContent : "";
        sel.replaceChildren(...list.map((b) => new Option(b.name, String(b.id))));
        sel.add(new Option("잘 모르겠음 (캠퍼스 전체)", ""));
        const again = [...sel.options].find((o) => o.value && o.textContent === picked);
        sel.value = again ? again.value : "";
        sel.dataset.loaded = "1";
      })
      .catch(() => {});
  }

  // 2. 몇 시부터 ~ 몇 시까지 시간 셀렉트 생성. 시간을 모르면 그날 하루 전체
  // 기본값은 "지금까지 2시간": 10:30이면 08:00~11:00 (끝은 서버로 보낼 때 지금으로 줄인다).
  // 자정 직후면 22:00~01:00처럼 어제 밤부터로 본다 (lostRange가 전날로 넘긴다)
  const nowHour = Number(LostApi.kstParts().time.slice(0, 2));
  const defaultStart = (nowHour + 22) % 24;
  const defaultEnd = nowHour + 1;
  startSelect.add(new Option("시간 모름 (하루 전체)", "any"));
  for (let h = 0; h <= 23; h++) {
    const hh = String(h).padStart(2, "0") + ":00";
    startSelect.add(new Option(`${hh} 부터`, String(h), h === defaultStart, h === defaultStart));
  }
  for (let h = 1; h <= 24; h++) {
    const hh = String(h).padStart(2, "0") + ":00";
    endSelect.add(new Option(`${hh} 까지`, String(h), h === defaultEnd, h === defaultEnd));
  }

  const timeGrid = document.getElementById("timeRangeGrid");
  /** 날짜를 모르거나 "일주일 이전"이면 시간을 고를 필요가 없다. 시간 모름이면 끝 시간도 숨긴다 */
  function syncWhen() {
    const wideDate = dateSelect.value === "older" || dateSelect.value === "unknown";
    timeGrid.hidden = wideDate;
    const anyTime = startSelect.value === "any";
    endSelect.hidden = anyTime;
    timeGrid.querySelector(".time-range-sep").hidden = anyTime;
  }
  dateSelect.addEventListener("change", syncWhen);
  startSelect.addEventListener("change", syncWhen);

  const timeNote = document.getElementById("timeNote");
  const hourText = (v) => (v === "24" ? "23:59" : String(v).padStart(2, "0") + ":00");
  /** 고른 구간이 통째로 아직 오지 않았으면 어제 같은 시각으로 보낸다는 걸 알려 준다 */
  function syncTimeNote() {
    const dayPicked = /^\d{4}-\d{2}-\d{2}$/.test(dateSelect.value);
    if (!dayPicked || startSelect.value === "any") {
      timeNote.hidden = true;
      return;
    }
    let from = Date.parse(LostApi.kstIso(dateSelect.value, hourText(startSelect.value)));
    const to = Date.parse(LostApi.kstIso(dateSelect.value, hourText(endSelect.value)));
    if (to < from) from -= DAY_MS;
    if (from <= Date.now()) {
      timeNote.hidden = true;
      return;
    }
    const r = LostApi.lostRange(dateSelect.value, hourText(startSelect.value), hourText(endSelect.value));
    timeNote.textContent = `아직 오지 않은 시간이에요. ${LostApi.formatRange(r.lostFrom, r.lostTo)}로 맞춰서 찾을게요.`;
    timeNote.hidden = false;
  }
  // 시작·끝 자동 맞춤(아래) 뒤에 확인하도록 한 박자 늦춘다
  for (const el of [dateSelect, startSelect, endSelect]) el.addEventListener("change", () => setTimeout(syncTimeNote));

  startSelect.addEventListener("change", () => {
    if (startSelect.value === "any") return;
    const sh = Number(startSelect.value);
    const eh = Number(endSelect.value);
    if (eh <= sh) {
      endSelect.value = String(Math.min(24, sh + 2));
    }
  });

  endSelect.addEventListener("change", () => {
    const sh = Number(startSelect.value);
    const eh = Number(endSelect.value);
    if (startSelect.value !== "any" && eh <= sh) {
      startSelect.value = String(Math.max(0, eh - 1));
    }
  });

  syncTimeNote();

  // 3. 기억나는 점 글자수 비례 자동 크기 조절 (하한 72px ~ 상한 200px)
  const MIN_H = 72;
  const MAX_H = 200;

  function syncMemoSize() {
    const len = memoInput.value.length;
    memoCount.textContent = `${len} / 200자`;

    const prevH = memoInput.offsetHeight || MIN_H;
    memoInput.style.transition = "none";
    memoInput.style.height = "0px";
    const scrollH = memoInput.scrollHeight;
    const charStepHeight = MIN_H + Math.floor(len / 16) * 22;
    const rawHeight = len === 0 ? MIN_H : Math.max(scrollH, charStepHeight);
    const clampedHeight = Math.min(MAX_H, Math.max(MIN_H, rawHeight));

    memoInput.style.height = prevH + "px";
    void memoInput.offsetHeight;
    memoInput.style.transition = "height 140ms var(--ease)";
    memoInput.style.height = clampedHeight + "px";
  }

  memoInput.addEventListener("input", syncMemoSize);
  syncMemoSize();

  // 4. 신고하기 → 입력을 저장하고 올리는 중 화면(uploading.html)에서 POST /lost-reports
  const reportErr = document.getElementById("reportErr");
  submitBtn.addEventListener("click", () => {
    reportErr.hidden = true;
    // 서버는 큰 종류만 받는다. 세부 종류는 설명(물건 이름)에서 AI가 다시 읽으므로, 이름을 비우면 세부 종류 이름을 넣는다
    const [category, sub] = categorySelect.value.split(":");
    const itemName = itemInput.value.trim() || (sub ? LostApi.SUB_CATEGORY_LABELS[sub] : LostApi.CATEGORY_LABELS[category]);
    // 서버는 설명 한 줄(5~500자)을 받는다. 물건 이름과 기억나는 점을 이어 보낸다
    const subLabel = sub ? LostApi.SUB_CATEGORY_LABELS[sub] : "";
    const description = [subLabel && !itemName.includes(subLabel) ? subLabel : "", itemName, memoInput.value.trim()]
      .filter(Boolean)
      .join(". ");
    if (description.length < LostApi.DESCRIPTION_MIN) {
      memoInput.classList.add("is-invalid");
      reportErr.textContent = "기억나는 점을 조금 더 적어 주세요. 색, 스티커, 케이스 같은 특징이 확인에 쓰여요.";
      reportErr.hidden = false;
      return;
    }
    const anyTime = startSelect.value === "any";
    const sh = anyTime ? "00:00" : String(startSelect.value).padStart(2, "0") + ":00";
    const eh = anyTime || endSelect.value === "24" ? "23:59" : String(endSelect.value).padStart(2, "0") + ":00";
    let range;
    if (dateSelect.value === "unknown") {
      // 잘 모르겠음: 7일 전 00:00 ~ 지금
      const from = LostApi.kstParts(new Date(Date.now() - 7 * DAY_MS)).date;
      range = { lostFrom: LostApi.kstIso(from, "00:00"), lostTo: new Date().toISOString() };
    } else if (dateSelect.value === "older") {
      // 일주일 이전: 30일 전 ~ 7일 전 (서버 보관 기한 30일)
      const from = LostApi.kstParts(new Date(Date.now() - 30 * DAY_MS)).date;
      const to = LostApi.kstParts(new Date(Date.now() - 7 * DAY_MS)).date;
      range = { lostFrom: LostApi.kstIso(from, "00:00"), lostTo: LostApi.kstIso(to, "23:59") };
    } else {
      range = LostApi.lostRange(dateSelect.value, sh, eh);
    }
    // 서버 목록이 오기 전의 임시 선택지는 값이 건물 이름이라 숫자가 아니다(NaN을 보내지 않는다). 목록이 오면 위에서 이름으로 이어 준다
    const rawBuilding = buildingSelect.value;
    const buildingId = /^\d+$/.test(rawBuilding) ? Number(rawBuilding) : null;
    LostApi.store.set(LostApi.KEYS.reportDraft, { category, ...range, buildingId, description });
    try {
      sessionStorage.setItem("refreshLeft", "5"); // 새 신고는 후보 새로고침 5번부터
      // 올리는 중 화면에는 서버에 저장되는 시각을 보여 준다 (고른 구간이 미래면 어제 같은 시각)
      const fromParts = LostApi.kstParts(new Date(range.lostFrom));
      const toParts = LostApi.kstParts(new Date(range.lostTo));
      sessionStorage.setItem(
        "lostReport",
        JSON.stringify({
          item: itemName,
          date: `${fromParts.month}월 ${fromParts.day}일(${fromParts.weekday})`,
          timeRange: `${fromParts.time}~${toParts.time}`,
          building: buildingSelect.selectedOptions[0]?.textContent || "",
        }),
      );
    } catch (_) {}
    // 신고 폼은 history에 남기지 않는다. 후보 화면에서 뒤로 가면 빈 폼이 아니라 신고를 시작한 화면으로 (QA 10/31)
    leaveGuard.proceed("uploading.html");
  });
  memoInput.addEventListener("input", () => memoInput.classList.remove("is-invalid"));
</script>
</body>
</html>
