<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>확인 질문 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar"><a class="back" href="candidates.html">←</a><h2>확인</h2></header>

  <div class="q-head">
    <span class="chip" id="qStepChip">질문 1 / 3</span>
    <span class="chip" id="qChanceChip">3번 중 3번 남음</span>
  </div>

  <section class="q-stage" id="qStage" aria-live="polite">
    <h1 class="q-title" id="qTitle">케이스에 스티커가 있나요?</h1>
    <p class="lead" id="qLead" style="margin-bottom:8px">어느 질문이 맞고 틀렸는지는 알려주지 않아요. 세 문제를 모두 답한 뒤 결과를 확인해요.</p>
    <div class="q-options" id="qOptions"></div>
  </section>
</main>
<script src="api.js"></script>
<script>
  // 확인 질문 (판정 결과 BORDERLINE). 서버가 객관식 질문(보통 2개)을 주면 카드로 고르고, 모두 고른 뒤 한 번에 보낸다.
  // 정답 위치는 화면에 없다(서버가 판정). 예전 시도처럼 객관식이 없으면 자유 입력(1~50자)으로 받는다.
  const authed = LostApi.requireLogin();
  const qStage = document.getElementById("qStage");
  const qStepChip = document.getElementById("qStepChip");
  const qChanceChip = document.getElementById("qChanceChip");
  const qTitle = document.getElementById("qTitle");
  const qLead = document.getElementById("qLead");
  const qOptions = document.getElementById("qOptions");

  const claim = LostApi.store.get(LostApi.KEYS.claim);
  const cand = LostApi.store.get(LostApi.KEYS.candidate);
  if (authed && claim?.result !== "BORDERLINE") location.replace("candidates.html");

  const questions = Array.isArray(claim?.questions) ? claim.questions : [];
  qChanceChip.textContent = `3번 중 ${cand?.attemptsLeft ?? 3}번 남음`;

  const err = document.createElement("p");
  err.className = "note danger";
  err.hidden = true;

  async function send(answer) {
    err.hidden = true;
    qStage.classList.add("is-switching");
    try {
      // POST /claims/:attemptId/answer → PASS | FAIL
      const r = await LostApi.answer(claim.attemptId, answer);
      const next = LostApi.claimScreen(r);
      if (next === "pass") {
        const d = await LostApi.detail();
        location.href = d.storageType === "HANDED_OVER" ? "item-handover.html" : "item.html";
      } else {
        location.href = `${next}.html`; // fail · lock · counter
      }
      return true;
    } catch (e) {
      const next = LostApi.claimScreen(e);
      if (next) {
        location.href = `${next}.html`;
        return true;
      }
      qStage.classList.remove("is-switching");
      err.textContent = LostApi.friendlyMessage(e);
      err.hidden = false;
      if (e.code === "ALREADY_ANSWERED") setTimeout(() => location.replace("candidates.html"), 1500);
      return false;
    }
  }

  if (questions.length > 0) {
    // ── 객관식: 한 문제씩 카드로 고른다. 고르면 다음 문제, 마지막 문제를 고르면 보낸다 ──
    const picks = [];
    let busy = false;
    qLead.textContent =
      questions.length > 1
        ? `${questions.length}문제를 모두 맞혀야 확인돼요. 어느 문제가 틀렸는지는 알려 주지 않아요.`
        : "맞혀야 확인돼요. 틀리면 기회가 1번 줄어요.";

    function render(i) {
      const q = questions[i];
      qStepChip.textContent = `질문 ${i + 1} / ${questions.length}`;
      qTitle.textContent = q.text;
      const cards = q.options.map((text, n) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "q-opt-btn";
        b.textContent = text;
        b.addEventListener("click", () => pick(i, n, b));
        return b;
      });
      const nodes = [...cards];
      if (i > 0) {
        const back = document.createElement("button");
        back.type = "button";
        back.className = "note";
        back.style.cssText = "background:none;border:0;padding:8px 0;text-decoration:underline;cursor:pointer;align-self:center";
        back.textContent = "← 이전 문제 다시 고르기";
        back.addEventListener("click", () => {
          if (busy) return;
          picks.length = i - 1;
          switchTo(i - 1);
        });
        nodes.push(back);
      }
      qOptions.replaceChildren(...nodes, err);
    }

    function switchTo(i) {
      qStage.classList.add("is-switching");
      setTimeout(() => {
        render(i);
        qStage.classList.remove("is-switching");
      }, 200);
    }

    async function pick(i, n, card) {
      if (busy) return;
      busy = true;
      card.classList.add("is-picked");
      picks[i] = n;
      if (i + 1 < questions.length) {
        setTimeout(() => {
          busy = false;
          switchTo(i + 1);
        }, 220);
        return;
      }
      if (!(await send(picks.slice(0, questions.length)))) {
        busy = false;
        card.classList.remove("is-picked");
      }
    }

    render(0);
  } else {
    // ── 자유 입력 (예전 시도) ──
    qStepChip.textContent = "질문 1 / 1";
    qTitle.textContent = claim?.question || "";
    qLead.textContent = "맞는 항목은 알려 주지 않아요. 기억나는 대로 짧게 적어 주세요.";

    const field = document.createElement("label");
    field.className = "field";
    const input = document.createElement("input");
    input.id = "answerInput";
    input.maxLength = LostApi.ANSWER_MAX;
    input.placeholder = "예: 오른쪽 아래";
    input.autocomplete = "off";
    field.append(input);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "btn";
    btn.id = "answerBtn";
    btn.style.width = "100%";
    btn.textContent = "답하기";
    qOptions.replaceChildren(field, btn, err);

    async function submit() {
      const answer = input.value.trim();
      if (!answer) {
        input.classList.add("is-invalid");
        return;
      }
      btn.disabled = true;
      if (!(await send(answer))) btn.disabled = false;
    }
    btn.addEventListener("click", submit);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submit();
    });
    input.addEventListener("input", () => input.classList.remove("is-invalid"));
  }
</script>
</body>
</html>
