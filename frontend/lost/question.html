<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>확인 질문 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar"><a class="back" href="candidates.html">←</a><h2>확인</h2></header>

  <div class="q-head">
    <span class="chip" id="qStepChip">질문 1 / 3</span>
    <span class="chip" id="qChanceChip">3번 중 3번 남음</span>
  </div>

  <section class="q-stage" id="qStage" aria-live="polite">
    <h1 class="q-title" id="qTitle">케이스에 스티커가 있나요?</h1>
    <p class="lead" id="qLead" style="margin-bottom:8px">어느 질문이 맞고 틀렸는지는 알려주지 않아요. 세 문제를 모두 답한 뒤 결과를 확인해요.</p>
    <div class="q-options" id="qOptions"></div>
  </section>
</main>
<script src="demo-store.js"></script>
<script>
  const qStage = document.getElementById("qStage");
  const qStepChip = document.getElementById("qStepChip");
  const qChanceChip = document.getElementById("qChanceChip");
  const qTitle = document.getElementById("qTitle");
  const qOptions = document.getElementById("qOptions");

  const defaultAiQuestions = [
    {
      question: "AI가 읽은 본체 또는 케이스의 색상과 표면 느낌은 어떤가요?",
      options: [
        { label: "하얀색(아이보리) · 무광 표면이에요", correct: true },
        { label: "검은색 · 유광 표면이에요", correct: false },
        { label: "투명 하드 케이스가 씌워져 있어요", correct: false }
      ]
    },
    {
      question: "물건 겉면이나 안쪽에 눈에 띄는 스티커·장식이 있나요?",
      options: [
        { label: "뚜껑 안쪽에 초록색 작은 스티커가 붙어 있어요", correct: true },
        { label: "금속 키링 고리가 달려 있어요", correct: false },
        { label: "아무 장식도 없는 기본 상태예요", correct: false }
      ]
    },
    {
      question: "충전 단자 주변이나 모서리에 어떤 흔적이 남아 있나요?",
      options: [
        { label: "아랫면 충전 단자 옆에 살짝 긁힌 자국이 있어요", correct: true },
        { label: "뚜껑 경첩 부분이 깨져 있어요", correct: false },
        { label: "영문 이니셜 각인이 새겨져 있어요", correct: false }
      ]
    }
  ];

  const params = new URLSearchParams(location.search);
  const candIdx = Math.max(0, Math.min(2, Number(params.get("cand") ?? sessionStorage.getItem("activeCandIdx") ?? 0)));
  let candChances = [3, 3, 3];
  let questions = defaultAiQuestions;
  let currentStep = 0;
  let quizChance = 3;
  // 3문제를 모두 답할 때까지 정답 여부를 모아두는 배열
  let pickedResults = [];
  let lockedInput = false;

  try {
    sessionStorage.setItem("activeCandIdx", String(candIdx));
    const savedQ = JSON.parse(sessionStorage.getItem("aiQuestions") || "null");
    if (Array.isArray(savedQ) && savedQ.length >= 3) {
      questions = savedQ.slice(0, 3);
    }
    const savedChances = JSON.parse(sessionStorage.getItem("candChances") || "null");
    if (Array.isArray(savedChances) && savedChances.length === 3) {
      candChances = savedChances.map((n) => Math.max(0, Math.min(3, Number(n))));
    }
    quizChance = candChances[candIdx] ?? 3;
  } catch (_) {}

  if (quizChance <= 0) {
    window.location.replace("lock.html");
  }

  function renderQuestion(stepIdx) {
    const total = questions.length;
    const item = questions[stepIdx] || questions[0];

    qStepChip.textContent = `질문 ${stepIdx + 1} / ${total}`;
    qChanceChip.textContent = `3번 중 ${quizChance}번 남음`;
    qTitle.textContent = item.question;
    qOptions.innerHTML = "";

    item.options.forEach((opt) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "q-opt-btn";
      btn.innerHTML = `<span>${opt.label}</span><span aria-hidden="true" style="color:var(--mute);font-weight:500">→</span>`;
      btn.addEventListener("click", () => handleSelectOption(btn, Boolean(opt.correct)));
      qOptions.appendChild(btn);
    });
  }

  function handleSelectOption(btn, isCorrect) {
    if (lockedInput) return;
    lockedInput = true;
    btn.classList.add("is-picked");
    pickedResults[currentStep] = isCorrect;

    // 1번, 2번 질문에서는 맞든 틀리든 결과를 노출하지 않고 다음 질문으로 넘어감
    if (currentStep + 1 < questions.length) {
      currentStep += 1;
      qStage.classList.add("is-switching");
      setTimeout(() => {
        renderQuestion(currentStep);
        qStage.classList.remove("is-switching");
        lockedInput = false;
      }, 210);
      return;
    }

    // 3문제를 모두 답한 뒤에 전체 정답 여부 판정
    const allCorrect = pickedResults.length === questions.length && pickedResults.every(Boolean);

    if (allCorrect) {
      try {
        const TEN_MIN = 10 * 60 * 1000;
        const now = Date.now();
        let list = JSON.parse(sessionStorage.getItem("lostReports") || "null");
        const activeId = sessionStorage.getItem("activeReportId");
        const currentRep = JSON.parse(sessionStorage.getItem("lostReport") || "null");

        if (Array.isArray(list) && list.length > 0) {
          let matched = false;
          list = list.map((r) => {
            if (!matched && ((activeId && r.id === activeId) || (!activeId && r.status === "active"))) {
              matched = true;
              const updated = { ...r, status: "closed", foundAt: now, expiresAt: now + TEN_MIN };
              sessionStorage.setItem("lostReport", JSON.stringify(updated));
              return updated;
            }
            return r;
          });
          if (!matched && currentRep) {
            const added = { ...currentRep, id: currentRep.id || ("rep-" + now), status: "closed", foundAt: now, expiresAt: now + TEN_MIN };
            list.unshift(added);
            sessionStorage.setItem("lostReport", JSON.stringify(added));
          }
          sessionStorage.setItem("lostReports", JSON.stringify(list));
        } else {
          const fallbackClosed = {
            id: currentRep?.id || ("rep-" + now),
            item: currentRep?.item || "무선 이어폰",
            date: currentRep?.date || "오늘",
            timeRange: currentRep?.timeRange || "13:00~15:00",
            building: currentRep?.building || "혜인관",
            status: "closed",
            foundAt: now,
            expiresAt: now + TEN_MIN
          };
          sessionStorage.setItem("lostReports", JSON.stringify([fallbackClosed]));
          sessionStorage.setItem("lostReport", JSON.stringify(fallbackClosed));
        }
        const closed = JSON.parse(sessionStorage.getItem("lostReport") || "null");
        if (closed && window.ChajeumAlerts) {
          window.ChajeumAlerts.push({
            id: "al-pass-" + (closed.id || now),
            type: "passed",
            title: "확인을 통과했어요",
            meta: [closed.item, closed.date].filter(Boolean).join(" · "),
            href: `item.html?from=closed&id=${encodeURIComponent(closed.id || "")}`,
            reportId: closed.id,
            createdAt: now,
            read: false
          });
        }
      } catch (_) {}
      window.location.href = "item.html?passed=1";
    } else {
      // 하나라도 틀렸으면 어떤 질문이 틀렸는지 알려주지 않고 기회 1회 차감 후 실패/잠금 화면으로 이동
      quizChance = Math.max(0, quizChance - 1);
      candChances[candIdx] = quizChance;
      try {
        sessionStorage.setItem("candChances", JSON.stringify(candChances));
        sessionStorage.setItem("quizChance", String(quizChance));
      } catch (_) {}
      if (quizChance <= 0) {
        window.location.href = "lock.html";
      } else {
        window.location.href = `fail.html?cand=${candIdx}`;
      }
    }
  }

  window.setAiQuestions = function (newQuestions) {
    if (!Array.isArray(newQuestions) || !newQuestions.length) return;
    questions = newQuestions.slice(0, 3);
    currentStep = 0;
    pickedResults = [];
    lockedInput = false;
    renderQuestion(0);
  };

  renderQuestion(0);
</script>
</body>
</html>
