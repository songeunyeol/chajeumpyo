<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동의 · 학교 이메일 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar"><a class="back" href="code.html">←</a></header>
  <h1>세 가지를 확인합니다</h1>
  <p class="lead">학교 이메일로 가입할 때 물어봐요.</p>
  <div class="check"><span class="mark">✓</span><div><b>학교 이메일</b><p>가입과, 누가 가져갔는지만 적어요. 이름은 받지 않아요.</p></div></div>
  <div class="check is-toggle is-off" id="locConsent" role="checkbox" aria-checked="false" tabindex="0"><span class="mark">✓</span><div><b>위치 <span class="check-tag">(선택)</span></b><p>가장 가까운 건물만 남기고, 좌표는 저장하지 않아요. 누르면 동의해요.</p></div></div>
  <div class="check"><span class="mark">✓</span><div><b>사진 외부 AI</b><p>종류와 색을 읽어요. 얼굴과 카드 번호는 보내기 전에 가려요.</p></div></div>
  <p class="note danger" id="consentErr" hidden></p>
  <div class="dock">
    <a class="btn" id="agreeBtn" href="home.html">동의하고 계속</a>
  </div>
</main>
<script src="api.js"></script>
<script>
  // POST /auth/signup: 인증 코드 화면이 저장한 verificationToken + 회원가입 화면이 잠깐 둔 비밀번호 + 동의
  // 이메일·외부 AI는 필수, 위치는 선택(처음엔 꺼 둠, 눌러야 동의). 위치 동의 여부를 그대로 보낸다 (QA B14·B15)
  const agreeBtn = document.getElementById("agreeBtn");
  const consentErr = document.getElementById("consentErr");
  if (!LostApi.store.get(LostApi.KEYS.verification)) location.replace("signup.html");
  const locConsent = document.getElementById("locConsent");
  const toggleLoc = () => {
    const off = locConsent.classList.toggle("is-off");
    locConsent.setAttribute("aria-checked", String(!off));
  };
  locConsent.addEventListener("click", toggleLoc);
  locConsent.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      toggleLoc();
    }
  });
  let busy = false;
  agreeBtn.addEventListener("click", async (e) => {
    e.preventDefault();
    if (busy) return;
    busy = true;
    consentErr.hidden = true;
    try {
      const password = LostApi.heldSignupPassword();
      if (!password) {
        consentErr.textContent = "가입 시간이 지났어요. 처음부터 다시 해 주세요.";
        consentErr.hidden = false;
        setTimeout(() => location.replace("signup.html"), 1800);
        return;
      }
      await LostApi.signup({ password, location: !locConsent.classList.contains("is-off") });
      location.replace("home.html");
    } catch (err) {
      // INVALID_CODE: 인증이 10분 지났거나 이미 씀 → 가입을 처음부터
      consentErr.textContent =
        err.code === "INVALID_CODE" ? "인증 시간이 지났어요. 코드를 다시 받아 주세요." : LostApi.friendlyMessage(err);
      consentErr.hidden = false;
      if (err.code === "INVALID_CODE") {
        LostApi.dropSignupPassword();
        setTimeout(() => location.replace("signup.html"), 1800);
      }
    } finally {
      busy = false;
    }
  });
</script>
</body>
</html>
