<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>확인 실패 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar"><a class="back" href="candidates.html">←</a><h2>확인</h2></header>
  <h1>아니에요</h1>
  <p class="lead" id="failLead">2번 남았어요.</p>
  <div class="dock near">
    <a class="btn" id="retryBtn" href="question.html">다시 확인</a>
  </div>
</main>
<script src="api.js"></script>
<script>
  // 판정·답이 FAIL이고 이 계정에 기회가 남았을 때. 같은 설명으로 다시 판정하면 이전 결과를 그대로 돌려주므로
  // "다시 확인"은 후보로 돌아간다 (설명을 고쳐 다시 판정하는 화면은 아직 없다: PATCH /lost-reports/:id)
  const claim = LostApi.store.get(LostApi.KEYS.claim);
  if (claim && typeof claim.attemptsLeft === "number") {
    document.getElementById("failLead").textContent = `${claim.attemptsLeft}번 남았어요.`;
  }
  document.getElementById("retryBtn").href = "candidates.html";
</script>
</body>
</html>
