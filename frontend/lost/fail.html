<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>확인 실패 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar"><a class="back" href="candidates.html">←</a><h2>확인</h2></header>
  <h1>아니에요</h1>
  <p class="lead" id="failLead">2번 남았어요.</p>
  <div class="dock near">
    <a class="btn" id="retryBtn" href="question.html">다시 확인</a>
  </div>
</main>
<script>
  try {
    const params = new URLSearchParams(location.search);
    const cand = params.get("cand") ?? sessionStorage.getItem("activeCandIdx") ?? "0";
    document.getElementById("retryBtn").href = `question.html?cand=${cand}`;
    const c = sessionStorage.getItem("quizChance");
    if (c !== null) {
      document.getElementById("failLead").textContent = `${c}번 남았어요.`;
    }
  } catch (_) {}
</script>
</body>
</html>
