<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>후보 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar"><a class="back" href="home.html">←</a><h2>후보</h2></header>
  <h1>비슷한 물건 3개</h1>
  <p class="lead">확인 전에는 사진이 흐려요.<br>이유만 공개돼요.</p>
  <article class="card">
    <div class="item">
      <div class="thumb" aria-hidden="true"></div>
      <div>
        <h3>무선 이어폰</h3>
        <p class="meta">10월 23일 습득 · 혜인관</p>
      </div>
    </div>
    <div class="chips">
      <span class="chip">같은 건물</span>
      <span class="chip">같은 종류</span>
      <span class="chip">잃어버린 뒤 2시간 안</span>
    </div>
    <p class="meta" style="margin-top:10px">확인 기회 3번 중 3번 남음</p>
    <a class="btn" style="margin-top:12px" href="question.html">내 물건인지 확인</a>
  </article>
  <article class="card">
    <div class="item">
      <div class="thumb dim" aria-hidden="true"></div>
      <div>
        <h3>무선 이어폰</h3>
        <p class="meta">10월 22일 습득 · 청운관</p>
      </div>
    </div>
    <div class="chips"><span class="chip danger">잠김</span></div>
    <p class="meta" style="margin-top:10px">확인 기회를 모두 썼어요. 학생증을 가지고 종합서비스센터에 문의해요.</p>
  </article>
  <article class="card">
    <div class="item">
      <div class="thumb" aria-hidden="true"></div>
      <div>
        <h3>충전기</h3>
        <p class="meta">10월 21일 습득 · 혜인관</p>
      </div>
    </div>
    <div class="chips"><span class="chip warn">대면 확인만</span></div>
    <a class="btn line" style="margin-top:12px" href="counter.html">찾는 방법 보기</a>
  </article>
</main>
</body>
</html>
