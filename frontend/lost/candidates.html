<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>후보 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar"><a class="back" href="home.html">←</a><h2>후보</h2></header>
  <h1 id="candHeading">비슷한 물건 3개</h1>
  <p class="lead">확인 전에는 사진이 모자이크로 가려져요.<br>일치하는 이유만 먼저 공개돼요.</p>

  <div class="candidate-list is-animating" id="candidateList"></div>
  <p class="note danger" id="candErr" hidden></p>

  <div class="dock">
    <button type="button" class="btn white" id="refreshBtn" style="width:100%;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)">
      후보 새로고침 (5/5 남음)
    </button>
  </div>

  <!-- 새로고침 재확인 모달 카드 -->
  <div class="modal-backdrop" id="refreshModal" role="dialog" aria-modal="true" aria-labelledby="refreshModalTitle">
    <div class="modal-card">
      <span class="chip warn" id="modalRemainChip">새로고침 5번 중 5번 남음</span>
      <h3 id="refreshModalTitle">후보를 새로고침할까요?</h3>
      <p>잘못 새로고침하면 지금 보이는 물건을 다시 찾지 못할 수도 있어요. 신중히 확인해 주세요.</p>
      <div class="modal-actions">
        <button type="button" class="btn gray" id="cancelRefreshBtn">취소</button>
        <button type="button" class="btn" id="confirmRefreshBtn">새로고침</button>
      </div>
    </div>
  </div>
  <!-- 확인 전 안내: 설명의 특징으로 대조하고, 안 맞으면 기회가 준다. 설명을 여기서 보완할 수 있다 -->
  <div class="modal-backdrop" id="claimModal" role="dialog" aria-modal="true" aria-labelledby="claimModalTitle">
    <div class="modal-card">
      <span class="chip warn" id="claimRemainChip">확인 기회 3번 중 3번 남음</span>
      <h3 id="claimModalTitle">내 물건인지 확인할까요?</h3>
      <p>아래 설명에 적은 <b>물건만의 특징</b>(스티커, 흠집, 장식, 키링 등)과 이 물건의 숨은 특징을 대조해요. 특징을 못 적었으면 숨은 특징을 묻는 질문이 하나 나와요. 특징이 다르거나 질문에 틀리면 <b>기회가 1번 줄어요.</b></p>
      <label class="field" style="margin-bottom:6px">
        <span>내 신고 설명</span>
        <textarea id="claimDesc" rows="3" maxlength="500" style="box-shadow:inset 0 0 0 1px var(--line)"></textarea>
      </label>
      <p class="note danger" id="claimDescNote" style="margin:0 0 12px" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn gray" id="cancelClaimBtn">취소</button>
        <button type="button" class="btn" id="confirmClaimBtn">확인하기</button>
      </div>
    </div>
  </div>
</main>
<script src="api.js"></script>
<script>
  const authed = LostApi.requireLogin();
  const candidateList = document.getElementById("candidateList");
  const refreshBtn = document.getElementById("refreshBtn");
  const refreshModal = document.getElementById("refreshModal");
  const modalRemainChip = document.getElementById("modalRemainChip");
  const cancelRefreshBtn = document.getElementById("cancelRefreshBtn");
  const confirmRefreshBtn = document.getElementById("confirmRefreshBtn");

  const candHeading = document.getElementById("candHeading");
  const candErr = document.getElementById("candErr");
  const reportId = LostApi.store.get(LostApi.KEYS.reportId);
  if (authed && !reportId) location.replace("home.html");

  // 새로고침 횟수는 화면 쪽 약속이다 (서버는 횟수를 세지 않고, 부를 때마다 후보를 다시 고른다)
  let refreshLeft = 5;
  try {
    const savedRefresh = sessionStorage.getItem("refreshLeft");
    if (savedRefresh !== null) refreshLeft = Math.max(0, Math.min(5, Number(savedRefresh)));
  } catch (_) {}
  let candidates = [];

  function drawMosaicFromSource(canvas, drawHighResFn) {
    const SRC_SIZE = 144;
    const MOSAIC_BLOCKS = 13;

    const srcCanvas = document.createElement("canvas");
    srcCanvas.width = SRC_SIZE;
    srcCanvas.height = SRC_SIZE;
    const sctx = srcCanvas.getContext("2d");
    drawHighResFn(sctx, SRC_SIZE, SRC_SIZE);

    const tiny = document.createElement("canvas");
    tiny.width = MOSAIC_BLOCKS;
    tiny.height = MOSAIC_BLOCKS;
    const tctx = tiny.getContext("2d");
    tctx.imageSmoothingEnabled = true;
    tctx.drawImage(srcCanvas, 0, 0, SRC_SIZE, SRC_SIZE, 0, 0, MOSAIC_BLOCKS, MOSAIC_BLOCKS);

    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(tiny, 0, 0, MOSAIC_BLOCKS, MOSAIC_BLOCKS, 0, 0, canvas.width, canvas.height);
  }

  function renderSampleScene(sctx, w, h, seed, round = 0) {
    const scenes = [
      () => {
        const bg = sctx.createLinearGradient(0, 0, w, h);
        bg.addColorStop(0, "#d9ccb8");
        bg.addColorStop(0.5, "#c5b49b");
        bg.addColorStop(1, "#a69276");
        sctx.fillStyle = bg;
        sctx.fillRect(0, 0, w, h);

        sctx.fillStyle = "rgba(28, 22, 16, 0.28)";
        sctx.beginPath();
        sctx.ellipse(76, 92, 42, 26, 0.15, 0, Math.PI * 2);
        sctx.fill();

        sctx.fillStyle = "#fbf9f5";
        sctx.beginPath();
        sctx.roundRect(34, 46, 76, 56, 22);
        sctx.fill();

        sctx.strokeStyle = "#d5cec2";
        sctx.lineWidth = 3;
        sctx.beginPath();
        sctx.moveTo(36, 70);
        sctx.lineTo(108, 70);
        sctx.stroke();

        sctx.fillStyle = "#1e5b3d";
        sctx.beginPath();
        sctx.arc(72, 58, 8, 0, Math.PI * 2);
        sctx.fill();

        sctx.fillStyle = "#221f1b";
        sctx.beginPath();
        sctx.arc(54, 36, 12, 0, Math.PI * 2);
        sctx.arc(90, 36, 12, 0, Math.PI * 2);
        sctx.fill();
      },
      () => {
        const bg = sctx.createRadialGradient(w * 0.4, h * 0.4, 10, w * 0.5, h * 0.5, w * 0.8);
        bg.addColorStop(0, "#cfc5b4");
        bg.addColorStop(1, "#8f8372");
        sctx.fillStyle = bg;
        sctx.fillRect(0, 0, w, h);

        sctx.fillStyle = "rgba(0,0,0,0.25)";
        sctx.beginPath();
        sctx.ellipse(74, 88, 38, 24, -0.08, 0, Math.PI * 2);
        sctx.fill();

        sctx.fillStyle = "#f4f1ea";
        sctx.beginPath();
        sctx.roundRect(38, 44, 68, 56, 22);
        sctx.fill();

        sctx.fillStyle = "#2b2824";
        sctx.beginPath();
        sctx.arc(56, 36, 11, 0, Math.PI * 2);
        sctx.arc(88, 36, 11, 0, Math.PI * 2);
        sctx.fill();
      },
      () => {
        const bg = sctx.createLinearGradient(0, 0, 0, h);
        bg.addColorStop(0, "#e5ddd0");
        bg.addColorStop(1, "#bfb29e");
        sctx.fillStyle = bg;
        sctx.fillRect(0, 0, w, h);

        sctx.fillStyle = "rgba(28,25,21,0.22)";
        sctx.beginPath();
        sctx.ellipse(72, 90, 40, 22, 0, 0, Math.PI * 2);
        sctx.fill();

        sctx.fillStyle = "#ffffff";
        sctx.beginPath();
        sctx.roundRect(36, 46, 72, 54, 20);
        sctx.fill();

        sctx.fillStyle = "#3a5a78";
        sctx.beginPath();
        sctx.arc(72, 68, 9, 0, Math.PI * 2);
        sctx.fill();

        sctx.fillStyle = "#1c1915";
        sctx.beginPath();
        sctx.arc(54, 38, 11, 0, Math.PI * 2);
        sctx.arc(90, 38, 11, 0, Math.PI * 2);
        sctx.fill();
      }
    ];
    scenes[(seed + round) % scenes.length]();
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  /** 서버가 준 흐린 사진(thumbnailUrl)을 기존 모자이크 캔버스에 그린다. 사진이 없으면 그림 예시 */
  function paintThumb(canvas, url, seed, round) {
    const sample = () => drawMosaicFromSource(canvas, (sctx, w, h) => renderSampleScene(sctx, w, h, seed, round));
    if (!url) return sample();
    const img = new Image();
    img.onload = () => drawMosaicFromSource(canvas, (sctx, w, h) => sctx.drawImage(img, 0, 0, w, h));
    img.onerror = sample;
    LostApi.setImage(img, url).then((ok) => ok || sample());
  }

  function renderCards(round = 0) {
    candidateList.innerHTML = "";
    candHeading.textContent = candidates.length ? `비슷한 물건 ${candidates.length}개` : "아직 비슷한 물건이 없어요";
    if (!candidates.length) {
      const empty = el("div", "card", "새 물건이 들어오면 알림으로 알려 줘요.");
      empty.style.color = "var(--mute)";
      empty.style.fontSize = "14px";
      candidateList.appendChild(empty);
    }

    candidates.forEach((c, idx) => {
      const state = LostApi.candidateState(c); // open · locked · inPerson
      const article = el("article", "card");
      article.style.setProperty("--idx", String(idx));
      article.dataset.id = c.foundItemId;

      const item = el("div", "item");
      const canvas = el("canvas", `thumb-mosaic${state === "open" ? "" : " dim"}`);
      canvas.width = 72;
      canvas.height = 72;
      canvas.setAttribute("aria-label", "모자이크 처리된 습득물 사진");
      const textBox = el("div");
      const where = LostApi.buildingName(c.building, "");
      textBox.append(
        el("h3", "cand-title", LostApi.itemLabel(c.category, c.subCategory)),
        el("p", "meta cand-meta", `${LostApi.formatKst(c.foundAt, { time: false })} 습득${where ? ` · ${where}` : ""}`),
      );
      item.append(canvas, textBox);
      article.appendChild(item);

      const chips = el("div", "chips");
      if (state === "open") {
        for (const r of c.reasons) chips.appendChild(el("span", "chip", LostApi.REASON_LABELS[r] || r));
        if (c.isSeed) chips.appendChild(el("span", "chip warn", "시연용"));
        article.append(chips, el("p", "meta", `확인 기회 3번 중 ${c.attemptsLeft}번 남음`));
        const btn = el("a", "btn", "내 물건인지 확인");
        btn.href = "#";
        btn.style.marginTop = "12px";
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          openClaimModal(c, btn);
        });
        article.appendChild(btn);
      } else if (state === "locked") {
        chips.appendChild(el("span", "chip danger", "잠김"));
        const note = el("p", "meta", "확인 기회를 모두 썼어요. 학생증을 가지고 교무처(혜인관 1층)에 문의해요.");
        note.style.marginTop = "10px";
        article.append(chips, note);
      } else {
        chips.appendChild(el("span", "chip danger", "대면 확인만"));
        const link = el("a", "btn white", "찾는 방법 보기");
        link.href = "counter.html";
        link.style.marginTop = "12px";
        article.append(chips, link);
      }

      candidateList.appendChild(article);
      paintThumb(canvas, c.thumbnailUrl, idx, round);
    });
  }

  // 확인 전 안내 모달. 설명을 고치면 먼저 신고를 고친다(다시 분석하고 후보를 다시 고른다)
  const claimModal = document.getElementById("claimModal");
  const claimDesc = document.getElementById("claimDesc");
  const claimDescNote = document.getElementById("claimDescNote");
  const confirmClaimBtn = document.getElementById("confirmClaimBtn");
  let claimTarget = null;
  let savedDesc = null;
  async function openClaimModal(c, btn) {
    claimTarget = { c, btn };
    document.getElementById("claimRemainChip").textContent = `확인 기회 3번 중 ${c.attemptsLeft}번 남음`;
    claimDescNote.hidden = true;
    claimModal.classList.add("is-open");
    if (savedDesc === null) {
      try {
        savedDesc = (await LostApi.reports()).find((r) => r.id === reportId)?.description ?? "";
      } catch (_) {
        savedDesc = "";
      }
    }
    claimDesc.value = savedDesc;
  }
  const closeClaimModal = () => claimModal.classList.remove("is-open");
  document.getElementById("cancelClaimBtn").addEventListener("click", closeClaimModal);
  claimModal.addEventListener("click", (e) => {
    if (e.target === claimModal) closeClaimModal();
  });
  confirmClaimBtn.addEventListener("click", async () => {
    if (!claimTarget || confirmClaimBtn.disabled) return;
    const text = claimDesc.value.trim();
    if (text.length < LostApi.DESCRIPTION_MIN) {
      claimDescNote.textContent = `설명을 ${LostApi.DESCRIPTION_MIN}자 이상 적어 주세요.`;
      claimDescNote.hidden = false;
      return;
    }
    if (text !== savedDesc) {
      confirmClaimBtn.disabled = true;
      confirmClaimBtn.textContent = "설명 저장 중…";
      try {
        await LostApi.editReport(reportId, text);
        savedDesc = text;
      } catch (err) {
        claimDescNote.textContent = LostApi.friendlyMessage(err);
        claimDescNote.hidden = false;
        return;
      } finally {
        confirmClaimBtn.disabled = false;
        confirmClaimBtn.textContent = "확인하기";
      }
    }
    closeClaimModal();
    doClaim(claimTarget.c, claimTarget.btn);
  });

  /** POST /lost-reports/:id/claims → 결과에 따라 다음 화면 */
  let claiming = false;
  async function doClaim(c, btn) {
    if (claiming) return;
    claiming = true;
    candErr.hidden = true;
    btn.style.opacity = "0.6";
    LostApi.store.set(LostApi.KEYS.candidate, c);
    try {
      const r = await LostApi.claim(reportId, c.foundItemId);
      // 같은 설명으로 이미 확인한 물건이면 서버가 이전 결과를 그대로 준다(기회는 안 씀). 실패 화면 대신 설명을 보완하게 한다
      if (r.result === "FAIL" && r.reused && r.attemptsLeft > 0) {
        await openClaimModal(c, btn);
        claimDescNote.textContent =
          "이 설명으로는 이미 확인했는데 맞지 않았어요. 물건만의 특징(스티커, 흠집, 장식 등)을 더 적어 주세요. 기회는 줄지 않았어요.";
        claimDescNote.hidden = false;
        return;
      }
      await goNext(LostApi.claimScreen(r));
    } catch (err) {
      const screen = LostApi.claimScreen(err);
      if (screen) return goNext(screen);
      // 설명에 특징이 없으면 기회를 쓰지 않고 돌아온다 → 모달을 다시 열어 바로 보완하게 한다
      if (err.code === "VALIDATION_ERROR" && err.details?.[0]?.path === "description") {
        await openClaimModal(c, btn);
        claimDescNote.textContent = LostApi.friendlyMessage(err);
        claimDescNote.hidden = false;
        return;
      }
      candErr.textContent = LostApi.friendlyMessage(err);
      candErr.hidden = false;
      // 후보가 바뀌었거나(403) 이미 누가 가져갔으면(409) 목록을 다시 받는다
      if (err.code === "FORBIDDEN" || err.code === "ALREADY_CLAIMED") loadCandidates();
    } finally {
      claiming = false;
      btn.style.opacity = "";
    }
  }

  /** 다음 화면. 통과면 상세의 보관 방식에 따라 그 자리(item) / 보관처(item-handover) */
  async function goNext(screen) {
    if (screen === "pass") {
      const d = await LostApi.detail();
      location.href = d.storageType === "HANDED_OVER" ? "item-handover.html" : "item.html";
    } else if (screen === "question") location.href = "question.html";
    else if (screen === "fail") location.href = "fail.html";
    else if (screen === "lock") location.href = "lock.html";
    else if (screen === "counter") location.href = "counter.html";
  }

  async function loadCandidates(round = 0) {
    try {
      candidates = await LostApi.candidates(reportId);
    } catch (err) {
      if (err.code === "UNAUTHORIZED") return location.replace("login.html");
      candErr.textContent = LostApi.friendlyMessage(err);
      candErr.hidden = false;
      candidates = [];
    }
    renderCards(round);
  }

  function syncRefreshUI() {
    modalRemainChip.textContent = `새로고침 5번 중 ${refreshLeft}번 남음`;
    if (refreshLeft <= 0) {
      refreshBtn.textContent = "새로고침 기회를 모두 썼어요 (0/5)";
      refreshBtn.disabled = true;
      refreshBtn.style.opacity = "0.55";
      refreshBtn.style.cursor = "not-allowed";
    } else {
      refreshBtn.textContent = `후보 새로고침 (${refreshLeft}/5 남음)`;
      refreshBtn.disabled = false;
      refreshBtn.style.opacity = "1";
      refreshBtn.style.cursor = "pointer";
    }
  }

  refreshBtn.addEventListener("click", () => {
    if (refreshLeft <= 0) return;
    syncRefreshUI();
    refreshModal.classList.add("is-open");
  });

  cancelRefreshBtn.addEventListener("click", () => {
    refreshModal.classList.remove("is-open");
  });

  refreshModal.addEventListener("click", (e) => {
    if (e.target === refreshModal) refreshModal.classList.remove("is-open");
  });

  confirmRefreshBtn.addEventListener("click", () => {
    if (refreshLeft <= 0) return;
    refreshLeft -= 1;
    try {
      sessionStorage.setItem("refreshLeft", String(refreshLeft));
    } catch (_) {}
    refreshModal.classList.remove("is-open");
    syncRefreshUI();

    // GET /lost-reports/:id/candidates 다시
    loadCandidates(5 - refreshLeft);

    candidateList.classList.remove("is-animating");
    void candidateList.offsetWidth;
    candidateList.classList.add("is-animating");
  });

  if (authed && reportId) loadCandidates(5 - refreshLeft);
  syncRefreshUI();
</script>
</body>
</html>
