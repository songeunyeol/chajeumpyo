<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar"><a class="back" href="login.html">←</a></header>
  <h1>학교 이메일로 가입</h1>
  <p class="lead">서경대 이메일만 받아요. 이름은 받지 않아요.</p>

  <label class="field">
    <span>학교 이메일</span>
    <input id="signupEmail" type="email" placeholder="아이디@skuniv.ac.kr" autocomplete="email">
  </label>
  <label class="field">
    <span>비밀번호</span>
    <input id="signupPw" type="password" placeholder="8자 이상" autocomplete="new-password">
  </label>
  <label class="field">
    <span>비밀번호 확인</span>
    <input id="signupPwConfirm" type="password" placeholder="비밀번호를 한 번 더 입력" autocomplete="new-password">
  </label>
  <p class="note danger" id="signupErr" hidden style="margin-top:-6px;margin-bottom:4px"></p>

  <div class="dock">
    <div id="captchaBox"></div>
    <button type="button" class="btn" id="signupBtn" style="width:100%;cursor:pointer">코드 받기</button>
  </div>
</main>
<script src="api.js"></script>
<script src="../found/captcha.js"></script>
<script>
  const emailInput = document.getElementById("signupEmail");
  const pwInput = document.getElementById("signupPw");
  const pwConfirmInput = document.getElementById("signupPwConfirm");
  const signupErr = document.getElementById("signupErr");
  const signupBtn = document.getElementById("signupBtn");

  // 사람 확인(Turnstile): 서버가 turnstile이면 위젯을 그리고 이 요청(action "email-code")에 토큰을 붙인다. off면 개발용 토큰
  let captcha = null;
  const mountCaptcha = () =>
    LostApi.useCaptcha(document.getElementById("captchaBox"), "email-code", {
      onError: () => {
        signupErr.textContent = "사람인지 확인하지 못했어요. 잠시 후 다시 눌러 주세요.";
        signupErr.hidden = false;
      },
    }).then((c) => (captcha = c));
  let captchaReady = mountCaptcha();
  /** 위젯이 없으면 한 번 다시 그려 본다. 그래도 없으면 CAPTCHA_FAILED로 실패 */
  async function captchaOk() {
    await captchaReady;
    if (!captcha) {
      captchaReady = mountCaptcha();
      await captchaReady;
    }
    if (!captcha) throw new LostApi.ApiError(400, { error: { code: "CAPTCHA_FAILED", message: "사람인지 확인하지 못했어요. 잠시 후 다시 눌러 주세요." } });
  }

  function clearErrors() {
    emailInput.classList.remove("is-invalid");
    pwInput.classList.remove("is-invalid");
    pwConfirmInput.classList.remove("is-invalid");
    signupErr.hidden = true;
  }

  emailInput.addEventListener("input", clearErrors);
  pwInput.addEventListener("input", clearErrors);
  pwConfirmInput.addEventListener("input", clearErrors);

  signupBtn.addEventListener("click", () => {
    clearErrors();
    const email = emailInput.value.trim();
    const pw = pwInput.value;
    const pwConfirm = pwConfirmInput.value;

    if (!/^[^\s@]+@skuniv\.ac\.kr$/i.test(email)) {
      emailInput.classList.add("is-invalid");
      signupErr.textContent = "서경대 이메일(@skuniv.ac.kr)을 정확히 입력해 주세요.";
      signupErr.hidden = false;
      return;
    }
    if (pw.length < 8) {
      pwInput.classList.add("is-invalid");
      signupErr.textContent = "비밀번호는 8자 이상이어야 해요.";
      signupErr.hidden = false;
      return;
    }
    if (pw !== pwConfirm) {
      pwConfirmInput.classList.add("is-invalid");
      signupErr.textContent = "비밀번호와 비밀번호 확인이 일치하지 않아요.";
      signupErr.hidden = false;
      return;
    }

    // POST /auth/email/code. 캡차: 지금은 LostApi 기본 dev-pass.
    // PR #47 머지 후 이 화면에 found/captcha.js 위젯(action "email-code")을 붙이고 LostApi.setCaptchaProvider로 넘긴다
    signupBtn.disabled = true;
    captchaOk()
      .then(() => LostApi.requestCode(email))
      .then(() => {
        try {
          sessionStorage.setItem("signupEmail", email);
        } catch (_) {}
        // 비밀번호는 동의 화면에서 가입할 때 보낸다. 이 탭에만 잠깐 두고 가입 직후 지운다
        LostApi.holdSignupPassword(pw);
        window.location.href = "code.html";
      })
      .catch((err) => {
        if (err.code === "INVALID_EMAIL_DOMAIN") emailInput.classList.add("is-invalid");
        signupErr.textContent = LostApi.friendlyMessage(err);
        signupErr.hidden = false;
      })
      .finally(() => {
        signupBtn.disabled = false;
      });
  });
</script>
</body>
</html>
