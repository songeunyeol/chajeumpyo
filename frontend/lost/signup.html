<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar"><a class="back" href="login">←</a></header>
  <h1>학교 이메일로 가입</h1>
  <p class="lead">서경대 학생·교직원만 쓸 수 있어요. 학교 메일 아이디만 적어 주세요.</p>

  <!-- 오류는 칸마다 바로 밑에 보여 준다 (QA 10/29). 칸을 벗어나면 바로 검사한다 -->
  <label class="field">
    <span id="emailLabel">서경대 메일 아이디 <b class="req" aria-hidden="true">*</b></span>
    <span class="email-fixed">
      <input id="signupEmailId" type="text" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="아이디" autocomplete="username" required aria-labelledby="emailLabel emailSuffix" aria-describedby="emailErr" aria-invalid="false">
      <span class="email-suffix" id="emailSuffix">@skuniv.ac.kr</span>
    </span>
    <!-- 서버로 보내는 전체 주소. 아이디 칸에서 만든다 -->
    <input id="signupEmail" type="hidden">
    <p class="note danger field-err" id="emailErr" hidden></p>
  </label>
  <label class="field">
    <span>비밀번호 <b class="req" aria-hidden="true">*</b></span>
    <input id="signupPw" type="password" placeholder="8자 이상" autocomplete="new-password" required aria-describedby="pwErr" aria-invalid="false">
    <p class="note danger field-err" id="pwErr" hidden></p>
  </label>
  <label class="field">
    <span>비밀번호 확인 <b class="req" aria-hidden="true">*</b></span>
    <input id="signupPwConfirm" type="password" placeholder="비밀번호 다시 입력" autocomplete="new-password" required aria-describedby="pwConfirmErr" aria-invalid="false">
    <p class="note danger field-err" id="pwConfirmErr" hidden></p>
  </label>
  <p class="note danger" id="signupErr" hidden style="margin-top:-6px;margin-bottom:4px"></p>

  <div class="dock">
    <div id="captchaBox"></div>
    <button type="button" class="btn" id="signupBtn" style="width:100%;cursor:pointer">코드 받기</button>
  </div>
</main>
<script src="api.js"></script>
<script>/* api.js를 못 받았으면(오프라인·캐시 없음) 빈 화면 대신 연결 안내를 띄운다 (검증 10/31) */if(!window.LostApi){document.body.replaceChildren();const m=document.createElement("main");m.className="screen";m.setAttribute("role","alert");m.innerHTML='<h1>인터넷 연결을 확인해 주세요</h1><p class="lead">연결되면 다시 시도해 주세요.</p>';const b=document.createElement("button");b.type="button";b.className="btn";b.textContent="다시 시도";b.addEventListener("click",()=>location.reload());m.append(b);document.body.append(m);addEventListener("online",()=>location.reload());}</script>
<script src="school-email.js"></script>
<script src="../found/captcha.js"></script>
<script>
  const emailInput = document.getElementById("signupEmailId");
  const schoolEmail = SchoolEmail.bindSchoolEmail(emailInput, document.getElementById("signupEmail"), () => {
    if (emailInput.value) checkField(RULES[0]);
  });
  const pwInput = document.getElementById("signupPw");
  const pwConfirmInput = document.getElementById("signupPwConfirm");
  const signupErr = document.getElementById("signupErr");
  const signupBtn = document.getElementById("signupBtn");

  // 사람 확인(Turnstile): 서버가 turnstile이면 위젯을 그리고 이 요청(action "email-code")에 토큰을 붙인다. off면 개발용 토큰
  let captcha = null;
  const mountCaptcha = () =>
    LostApi.useCaptcha(document.getElementById("captchaBox"), "email-code", {
      onError: () => showCaptchaHelp({ captchaKind: "failed" }),
    }).then((c) => (captcha = c));
  let captchaReady = mountCaptcha();
  /** 보안 확인(캡차) 문제면 위젯 아래에 이유와 "다시 확인"을 띄우고 true. 다시 확인은 위젯을 새로 받는다 */
  function showCaptchaHelp(err) {
    const message = window.FoundCaptcha?.helpMessage(err);
    if (!message) return false;
    FoundCaptcha.showHelp(document.getElementById("captchaBox"), {
      message,
      onRetry: () => {
        if (captcha) captcha.reset();
        else captchaReady = mountCaptcha();
      },
    });
    return true;
  }
  /** 위젯이 없으면 한 번 다시 그려 본다. 그래도 없으면 CAPTCHA_FAILED로 실패 */
  async function captchaOk() {
    await captchaReady;
    if (!captcha) {
      captchaReady = mountCaptcha();
      await captchaReady;
    }
    if (!captcha) throw LostApi.captchaUnavailableError();
  }

  /** 칸별 검사. 통과하면 빈 문자열 */
  const RULES = [
    [emailInput, document.getElementById("emailErr"), () =>
      schoolEmail.error() || (schoolEmail.valid() ? "" : "서경대 메일 아이디를 입력해 주세요.")],
    [pwInput, document.getElementById("pwErr"), () => (pwInput.value.length >= 8 ? "" : "비밀번호는 8자 이상이어야 해요.")],
    [pwConfirmInput, document.getElementById("pwConfirmErr"), () =>
      pwConfirmInput.value === pwInput.value ? "" : "비밀번호가 서로 달라요."],
  ];

  function showField(input, errEl, message) {
    input.classList.toggle("is-invalid", Boolean(message));
    input.setAttribute("aria-invalid", message ? "true" : "false");
    errEl.textContent = message;
    errEl.hidden = !message;
  }
  /** 칸 하나 검사 후 표시. 통과하면 true */
  function checkField(rule) {
    const [input, errEl, test] = rule;
    const message = test();
    showField(input, errEl, message);
    return !message;
  }

  for (const rule of RULES) {
    const [input, errEl] = rule;
    // 칸을 벗어나면 바로 검사한다. 아무것도 안 적고 지나가면 아직 오류를 띄우지 않는다
    input.addEventListener("blur", () => {
      if (input.value) checkField(rule);
    });
    input.addEventListener("input", () => {
      signupErr.hidden = true;
      if (!errEl.hidden) checkField(rule);
    });
  }
  // 비밀번호를 고치면 확인 칸도 다시 맞춰 본다
  pwInput.addEventListener("input", () => {
    if (pwConfirmInput.value) checkField(RULES[2]);
  });

  signupBtn.addEventListener("click", () => {
    signupErr.hidden = true;
    const results = RULES.map(checkField);
    const firstBad = results.indexOf(false);
    if (firstBad !== -1) {
      RULES[firstBad][0].focus();
      return;
    }
    const email = schoolEmail.email();
    const pw = pwInput.value;

    // POST /auth/email/code. 캡차: 지금은 LostApi 기본 dev-pass.
    // PR #47 머지 후 이 화면에 found/captcha.js 위젯(action "email-code")을 붙이고 LostApi.setCaptchaProvider로 넘긴다
    const goToCode = () => {
      try {
        sessionStorage.setItem("signupEmail", email);
      } catch (_) {}
      // 비밀번호는 동의 화면에서 가입할 때 보낸다. 이 탭에만 잠깐 두고 가입 직후 지운다
      LostApi.holdSignupPassword(pw);
      window.location.href = "code";
    };
    // 같은 이메일로 방금 보낸 코드가 아직 쓸 수 있으면 다시 보내지 않는다.
    // 다시 보내면 서버의 1분 대기에 걸려 메일이 안 오던 문제 (QA 10/29). 새 코드는 다음 화면의 "다시 보내기"로 받는다
    if (LostApi.recentCode(email)) {
      LostApi.store.set(LostApi.KEYS.signupEmail, email.toLowerCase());
      goToCode();
      return;
    }
    signupBtn.disabled = true;
    captchaOk()
      .then(() => LostApi.requestCode(email))
      .then(goToCode)
      .catch((err) => {
        if (err.code === "INVALID_EMAIL_DOMAIN") {
          showField(emailInput, RULES[0][1], LostApi.friendlyMessage(err));
          return;
        }
        if (showCaptchaHelp(err)) {
          signupErr.hidden = true;
          return;
        }
        signupErr.textContent = LostApi.friendlyMessage(err);
        signupErr.hidden = false;
      })
      .finally(() => {
        signupBtn.disabled = false;
      });
  });
</script>
<script src="../leave-guard.js"></script>
<script>
  LeaveGuard.install({
    title: "가입을 그만할까요?",
    message: "지금까지 적은 내용은 지워져요. 그래도 나갈까요?",
    leaveTo: "login",
    onLeave: () => {
      LostApi.store.set(LostApi.KEYS.signupPassword, null);
      LostApi.store.set(LostApi.KEYS.codeSent, null);
    },
  });
</script>
</body>
</html>
