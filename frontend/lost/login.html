<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
<style>
  /* 들어올 때 제목 → 입력칸 → 로그인 버튼 순서로 아래에서 올라온다 (10/31 은열) */
  @media (prefers-reduced-motion: no-preference) {
    #loginScreen > h1, #loginScreen > .lead, #loginScreen > .field, #loginScreen > .dock {
      animation: rise-in 640ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    #loginScreen > .lead { animation-delay: 70ms; }
    #loginScreen > .field:nth-of-type(1) { animation-delay: 160ms; }
    #loginScreen > .field:nth-of-type(2) { animation-delay: 240ms; }
    #loginScreen > .dock { animation-delay: 340ms; }
  }
  @keyframes rise-in {
    from { opacity: 0; transform: translateY(28px); }
    to { opacity: 1; transform: none; }
  }
</style>
</head>
<body style="overscroll-behavior-y:none">
<main class="screen" id="loginScreen" style="touch-action:none;user-select:none">
  <header class="bar"><a class="back" href="../">←</a></header>
  <h1>잃어버렸어요</h1>
  <p class="lead">서경대 학교 메일로 로그인해요.</p>

  <label class="field">
    <span id="loginEmailLabel">서경대 메일 아이디</span>
    <span class="email-fixed">
      <input id="loginEmailId" type="text" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="아이디" autocomplete="username" aria-labelledby="loginEmailLabel loginEmailSuffix" aria-describedby="loginErr">
      <span class="email-suffix" id="loginEmailSuffix">@skuniv.ac.kr</span>
    </span>
    <!-- 서버로 보내는 전체 주소. 아이디 칸에서 만든다 -->
    <input id="loginEmail" type="hidden">
  </label>
  <label class="field">
    <span>비밀번호</span>
    <input id="loginPw" type="password" placeholder="8자 이상" autocomplete="current-password">
  </label>
  <p class="note danger" id="loginErr" hidden style="margin-top:-6px;margin-bottom:4px">서경대 메일 아이디와 8자 이상 비밀번호를 확인해 주세요.</p>

  <div class="dock">
    <button type="button" class="btn" id="loginBtn" style="position:relative;z-index:2;width:100%;cursor:pointer">로그인</button>
    <div class="signup-reveal" id="signupReveal">
      <a class="btn gray" href="signup">회원가입</a>
    </div>
  </div>
</main>
<script src="api.js"></script>
<script>/* api.js를 못 받았으면(오프라인·캐시 없음) 빈 화면 대신 연결 안내를 띄운다 (검증 10/31) */if(!window.LostApi){document.body.replaceChildren();const m=document.createElement("main");m.className="screen";m.setAttribute("role","alert");m.innerHTML='<h1>인터넷 연결을 확인해 주세요</h1><p class="lead">연결되면 다시 시도해 주세요.</p>';const b=document.createElement("button");b.type="button";b.className="btn";b.textContent="다시 시도";b.addEventListener("click",()=>location.reload());m.append(b);document.body.append(m);addEventListener("online",()=>location.reload());}</script>
<script src="school-email.js"></script>
<script>
  // 이미 로그인했으면 홈으로
  if (LostApi.isLoggedIn()) location.replace("home");

  const loginScreen = document.getElementById("loginScreen");
  const emailInput = document.getElementById("loginEmailId");
  const loginErrEl = document.getElementById("loginErr");
  const schoolEmail = SchoolEmail.bindSchoolEmail(emailInput, document.getElementById("loginEmail"), (message) => {
    loginErrEl.textContent = message;
    loginErrEl.hidden = false;
    emailInput.classList.add("is-invalid");
  });
  const pwInput = document.getElementById("loginPw");
  const loginErr = document.getElementById("loginErr");
  const loginBtn = document.getElementById("loginBtn");
  const signupReveal = document.getElementById("signupReveal");

  const DRAG_RANGE = 84;
  let currentProgress = 0;

  function setProgress(p, dragging = false) {
    currentProgress = Math.max(0, Math.min(1, p));
    signupReveal.classList.toggle("is-dragging", dragging);
    signupReveal.style.setProperty("--reveal-p", currentProgress.toFixed(3));
    signupReveal.classList.toggle("is-open", currentProgress >= 0.99 && !dragging);
  }

  function openSignup() {
    setProgress(1, false);
  }

  function closeSignup() {
    setProgress(0, false);
  }


  // 1. 잘못된 양식으로 로그인 버튼을 눌렀을 때: 로그인 버튼이 올라가며 뒤에 있던 회원가입 버튼 노출
  loginBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const validEmail = schoolEmail.valid();
    const validPw = pwInput.value.length >= 8;

    if (!validEmail || !validPw) {
      loginErr.textContent = schoolEmail.error() || "서경대 메일 아이디와 8자 이상 비밀번호를 확인해 주세요.";
      loginErr.hidden = false;
      openSignup();
      if (!validEmail) {
        emailInput.classList.add("is-invalid");
      } else {
        pwInput.classList.add("is-invalid");
      }
      return;
    }
    // POST /auth/login. 틀리면 401 (이메일·비밀번호 어느 쪽인지 알려 주지 않는다)
    loginBtn.disabled = true;
    LostApi.login(schoolEmail.email(), pwInput.value)
      .then(() => {
        try {
          sessionStorage.setItem("signupEmail", schoolEmail.email());
        } catch (_) {}
        window.location.href = "home";
      })
      .catch((err) => {
        loginErr.textContent =
          err.code === "UNAUTHORIZED" ? "이메일 또는 비밀번호가 맞지 않아요." : LostApi.friendlyMessage(err);
        loginErr.hidden = false;
        if (err.code === "UNAUTHORIZED") openSignup();
      })
      .finally(() => {
        loginBtn.disabled = false;
      });
  });

  emailInput.addEventListener("input", () => {
    emailInput.classList.remove("is-invalid");
    loginErr.hidden = true;
  });
  pwInput.addEventListener("input", () => {
    pwInput.classList.remove("is-invalid");
    loginErr.hidden = true;
  });

  // 2. 마우스/터치 드래그에 실시간 반응 + 빈 화면 클릭 시 노출
  let dragStartY = null;
  let dragStartProgress = 0;
  let movedDistance = 0;

  loginScreen.addEventListener("pointerdown", (e) => {
    if (e.target.closest("input, .sublinks a, .back, #loginBtn, #signupReveal")) return;
    dragStartY = e.clientY;
    dragStartProgress = currentProgress;
    movedDistance = 0;
    try { loginScreen.setPointerCapture(e.pointerId); } catch (_) {}
  });

  loginScreen.addEventListener("pointermove", (e) => {
    if (dragStartY === null) return;
    const dy = dragStartY - e.clientY;
    movedDistance = Math.max(movedDistance, Math.abs(dy));
    if (movedDistance > 4) {
      setProgress(dragStartProgress + dy / DRAG_RANGE, true);
    }
  });

  function finishDrag(e) {
    if (dragStartY === null) return;
    const dy = dragStartY - e.clientY;
    dragStartY = null;

    if (movedDistance <= 5) {
      openSignup();
      return;
    }

    if (dy > 14) {
      openSignup();
    } else if (dy < -14) {
      closeSignup();
    } else if (currentProgress >= 0.5) {
      openSignup();
    } else {
      closeSignup();
    }
  }

  loginScreen.addEventListener("pointerup", finishDrag);
  loginScreen.addEventListener("pointercancel", () => {
    if (dragStartY === null) return;
    dragStartY = null;
    if (currentProgress >= 0.5) openSignup();
    else closeSignup();
  });

  // 3. 마우스 휠 스크롤 다운 시 노출 / 스크롤 업 시 다시 숨김
  window.addEventListener("wheel", (e) => {
    if (e.deltaY > 6) {
      openSignup();
    } else if (e.deltaY < -6) {
      closeSignup();
    }
  }, { passive: true });
</script>
</body>
</html>
