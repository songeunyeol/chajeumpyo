<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen" id="loginScreen">
  <header class="bar"><a class="back" href="../index.html">←</a></header>
  <h1>잃어버렸어요</h1>
  <p class="lead">서경대 학교 메일로 로그인해요.</p>

  <label class="field">
    <span id="loginEmailLabel">서경대 메일 아이디</span>
    <span class="email-fixed">
      <input id="loginEmailId" type="text" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="아이디" autocomplete="username" aria-labelledby="loginEmailLabel loginEmailSuffix" aria-describedby="loginErr">
      <span class="email-suffix" id="loginEmailSuffix">@skuniv.ac.kr</span>
    </span>
    <!-- 서버로 보내는 전체 주소. 아이디 칸에서 만든다 -->
    <input id="loginEmail" type="hidden">
  </label>
  <label class="field">
    <span>비밀번호</span>
    <input id="loginPw" type="password" placeholder="8자 이상" autocomplete="current-password">
  </label>
  <p class="note danger" id="loginErr" hidden style="margin-top:-6px;margin-bottom:4px">서경대 메일 아이디와 8자 이상 비밀번호를 확인해 주세요.</p>

  <p class="or">또는</p>
  <div class="social" aria-label="간편 로그인">
    <a class="google" href="consent-social.html" aria-label="Google로 계속" title="Google로 계속">
      <svg width="22" height="22" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.2-3.5 5.7-6.6 7.1l6.3 5.3C37.4 38.4 44 34 44 24c0-1.3-.1-2.7-.4-3.5z"/>
      </svg>
    </a>
    <a class="kakao" href="consent-social.html" aria-label="카카오로 계속" title="카카오로 계속">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#191919" d="M12 4C6.92 4 2.8 7.23 2.8 11.22c0 2.55 1.69 4.8 4.24 6.08-.14.51-.9 3.28-.93 3.5 0 0-.02.16.08.22.1.06.22.02.22.02.29-.04 3.37-2.21 3.9-2.58.55.08 1.11.12 1.69.12 5.08 0 9.2-3.23 9.2-7.36S17.08 4 12 4z"/>
      </svg>
    </a>
    <a class="naver" href="consent-social.html" aria-label="네이버로 계속" title="네이버로 계속">
      <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#ffffff" d="M16.27 12.85 7.37 0H0v24h7.73V11.15L16.63 24H24V0h-7.73v12.85z"/>
      </svg>
    </a>
  </div>


  <div class="dock">
    <button type="button" class="btn" id="loginBtn" style="width:100%;cursor:pointer">로그인</button>
    <!-- 처음 온 사람이 바로 찾게 로그인 버튼 바로 아래 늘 보인다 (10/31 기획 피드백: 끌어 올려야 보여서 못 찾음) -->
    <a class="btn gray" id="signupLink" href="signup.html">처음이에요 · 회원가입</a>
  </div>
</main>
<script src="api.js"></script>
<script src="school-email.js"></script>
<script>
  // 이미 로그인했으면 홈으로
  if (LostApi.isLoggedIn()) location.replace("home.html");

  const emailInput = document.getElementById("loginEmailId");
  const loginErrEl = document.getElementById("loginErr");
  const schoolEmail = SchoolEmail.bindSchoolEmail(emailInput, document.getElementById("loginEmail"), (message) => {
    loginErrEl.textContent = message;
    loginErrEl.hidden = false;
    emailInput.classList.add("is-invalid");
  });
  const pwInput = document.getElementById("loginPw");
  const loginErr = document.getElementById("loginErr");
  const loginBtn = document.getElementById("loginBtn");
  // 잘못된 양식이면 안내만 띄운다. 회원가입 버튼은 늘 아래에 보인다
  loginBtn.addEventListener("click", () => {
    const validEmail = schoolEmail.valid();
    const validPw = pwInput.value.length >= 8;

    if (!validEmail || !validPw) {
      loginErr.textContent = schoolEmail.error() || "서경대 메일 아이디와 8자 이상 비밀번호를 확인해 주세요.";
      loginErr.hidden = false;
      if (!validEmail) {
        emailInput.classList.add("is-invalid");
      } else {
        pwInput.classList.add("is-invalid");
      }
      return;
    }
    // POST /auth/login. 틀리면 401 (이메일·비밀번호 어느 쪽인지 알려 주지 않는다)
    loginBtn.disabled = true;
    LostApi.login(schoolEmail.email(), pwInput.value)
      .then(() => {
        try {
          sessionStorage.setItem("signupEmail", schoolEmail.email());
        } catch (_) {}
        window.location.href = "home.html";
      })
      .catch((err) => {
        loginErr.textContent =
          err.code === "UNAUTHORIZED" ? "이메일 또는 비밀번호가 맞지 않아요." : LostApi.friendlyMessage(err);
        loginErr.hidden = false;
      })
      .finally(() => {
        loginBtn.disabled = false;
      });
  });

  emailInput.addEventListener("input", () => {
    emailInput.classList.remove("is-invalid");
    loginErr.hidden = true;
  });
  pwInput.addEventListener("input", () => {
    pwInput.classList.remove("is-invalid");
    loginErr.hidden = true;
  });
</script>
</body>
</html>
