<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동의 · 간편가입 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar"><a class="back" href="login">←</a></header>
  <h1>세 가지를 확인해요</h1>
  <p class="lead">구글, 카카오, 네이버로 가입할 때 물어봐요.</p>
  <div class="check" id="phoneCheck"><span class="mark">✓</span><div><b>전화번호</b><p>가입 뒤 한 번만 확인해요. 화면에는 가운데를 가려 보여요.</p></div></div>
  <div class="check is-toggle is-off" id="locConsent" role="checkbox" aria-checked="false" tabindex="0"><span class="mark">✓</span><div><b>위치 <span class="check-tag">(선택)</span></b><p>가장 가까운 건물만 남기고, 좌표는 저장하지 않아요. 누르면 동의해요.</p></div></div>
  <!-- 분실 신고는 사진 없이 설명만 보낸다. 설명을 외부 AI가 읽는다는 필수 동의. 다른 동의처럼 처음엔 꺼 둔다 (QA 10/30) -->
  <div class="check is-toggle is-off" id="aiConsent" role="checkbox" aria-checked="false" tabindex="0"><span class="mark">✓</span><div><b>설명 AI 분석 <span class="check-tag">(필수)</span></b><p>적은 설명을 AI가 읽어 종류와 특징을 정리해요. 이름·연락처는 적지 말아 주세요.</p></div></div>
  <p class="note danger" id="consentErr" hidden></p>
  <div class="dock">
    <div id="captchaBox"></div>
    <a class="btn" id="agreeBtn" href="home" aria-disabled="true">동의하고 계속</a>
  </div>
</main>
<style>.btn[aria-disabled="true"] { opacity: .45; }</style>
<script src="api.js"></script>
<script src="../found/captcha.js"></script>
<script>
  // 간편 로그인(구글·카카오·네이버)은 백엔드에 없다. 이 화면은 지금 체험 로그인(?demo=1) 동의로 쓴다.
  // 체험 계정은 이메일을 받지 않으므로 전화번호 항목을 숨기고, 위치 동의로 POST /auth/demo (설명 AI 분석은 필수로 눌러야 진행)
  // 캡차: found/captcha.js 위젯(action "demo-login"). 체험(?demo=1)일 때만 그린다
  const isDemo = new URLSearchParams(location.search).get("demo") === "1";
  const agreeBtn = document.getElementById("agreeBtn");
  const consentErr = document.getElementById("consentErr");
  if (isDemo) {
    document.querySelector(".lead").textContent = "체험 계정을 만들 때 물어봐요. 체험 계정은 24시간 뒤 지워져요.";
    document.getElementById("phoneCheck").style.display = "none";
    document.querySelector("h1").textContent = "두 가지를 확인해요";
  }
  const locConsent = document.getElementById("locConsent");
  const aiConsent = document.getElementById("aiConsent");
  const isOn = (el) => !el.classList.contains("is-off");
  const sync = () => agreeBtn.setAttribute("aria-disabled", String(!isOn(aiConsent)));
  for (const el of [locConsent, aiConsent]) {
    const toggle = () => {
      const off = el.classList.toggle("is-off");
      el.setAttribute("aria-checked", String(!off));
      sync();
      if (isOn(aiConsent)) consentErr.hidden = true;
    };
    el.addEventListener("click", toggle);
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        toggle();
      }
    });
  }
  sync();
  let captcha = null;
  let captchaReady = Promise.resolve();
  const mountCaptcha = () =>
    LostApi.useCaptcha(document.getElementById("captchaBox"), "demo-login", {
      onError: () => showCaptchaHelp({ captchaKind: "failed" }),
    }).then((c) => (captcha = c));
  if (isDemo) captchaReady = mountCaptcha();
  /** 보안 확인(캡차) 문제면 위젯 아래에 이유와 "다시 확인"을 띄우고 true. 다시 확인은 위젯을 새로 받는다 */
  function showCaptchaHelp(err) {
    const message = window.FoundCaptcha?.helpMessage(err);
    if (!message) return false;
    FoundCaptcha.showHelp(document.getElementById("captchaBox"), {
      message,
      onRetry: () => {
        if (captcha) captcha.reset();
        else captchaReady = mountCaptcha();
      },
    });
    return true;
  }
  let busy = false;
  agreeBtn.addEventListener("click", async (e) => {
    e.preventDefault();
    if (busy) return;
    if (!isDemo) {
      consentErr.textContent = "간편 로그인은 준비 중이에요. 학교 이메일로 가입하거나 체험해 보기를 눌러 주세요.";
      consentErr.hidden = false;
      return;
    }
    if (!isOn(aiConsent)) {
      consentErr.textContent = "필수 항목에 동의해야 체험할 수 있어요.";
      consentErr.hidden = false;
      return;
    }
    busy = true;
    consentErr.hidden = true;
    try {
      await captchaReady;
      if (!captcha) {
        captchaReady = mountCaptcha();
        await captchaReady;
      }
      if (!captcha) throw LostApi.captchaUnavailableError();
      await LostApi.demoLogin({ location: !locConsent.classList.contains("is-off") });
      location.replace("home");
    } catch (err) {
      if (showCaptchaHelp(err)) {
        consentErr.hidden = true;
        return;
      }
      consentErr.textContent = LostApi.friendlyMessage(err);
      consentErr.hidden = false;
    } finally {
      busy = false;
    }
  });
</script>
</body>
</html>
