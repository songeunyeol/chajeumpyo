<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동의 · 간편가입 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar"><a class="back" href="login.html">←</a></header>
  <h1>세 가지를 확인합니다</h1>
  <p class="lead">구글, 카카오, 네이버로 가입할 때 물어봐요.</p>
  <div class="check"><span class="mark">✓</span><div><b>전화번호 <span class="meta" style="font-weight:400">(필수)</span></b><p>가입 뒤 한 번만 확인해요. 화면에는 가운데를 가려 보여요.</p></div></div>
  <div class="check" data-optional role="checkbox" aria-checked="true" tabindex="0"><span class="mark">✓</span><div><b>위치 <span class="meta" style="font-weight:400">(선택)</span></b><p>가장 가까운 건물만 남기고, 좌표는 저장하지 않아요.</p></div></div>
  <div class="check"><span class="mark">✓</span><div><b>사진 외부 AI <span class="meta" style="font-weight:400">(필수)</span></b><p>종류와 색을 읽어요. 얼굴과 카드 번호는 보내기 전에 가려요.</p></div></div>
  <div class="dock">
    <button type="button" class="btn" id="agreeBtn" style="width:100%;cursor:pointer">동의하고 계속</button>
  </div>

  <div class="modal-backdrop" id="phoneModal" role="dialog" aria-modal="true" aria-labelledby="phoneModalTitle">
    <div class="modal-card">
      <h3 id="phoneModalTitle">전화번호를 한 번만 확인해요</h3>
      <p>화면에는 가운데를 가려 보여요. 이 브라우저에서는 다시 묻지 않아요.</p>
      <label class="field" style="margin-bottom:14px">
        <span>휴대폰 번호</span>
        <input id="phoneInput" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000">
      </label>
      <p class="note danger" id="phoneErr" hidden style="margin-top:-6px">010으로 시작하는 번호를 확인해 주세요.</p>
      <div class="modal-actions">
        <button type="button" class="btn gray" id="phoneCloseBtn">닫기</button>
        <button type="button" class="btn" id="phoneOkBtn">확인</button>
      </div>
    </div>
  </div>
</main>
<script>
  const opt = document.querySelector("[data-optional]");
  function toggle() {
    const on = opt.getAttribute("aria-checked") !== "true";
    opt.setAttribute("aria-checked", String(on));
    opt.querySelector(".mark").style.opacity = on ? "1" : ".25";
    try { sessionStorage.setItem("locationConsent", on ? "granted" : "denied"); } catch (_) {}
  }
  opt.addEventListener("click", toggle);
  opt.addEventListener("keydown", (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(); } });

  const phoneModal = document.getElementById("phoneModal");
  const phoneInput = document.getElementById("phoneInput");
  const phoneErr = document.getElementById("phoneErr");

  function formatPhone(digits) {
    if (digits.length < 10) return null;
    if (!/^01[016789]\d{7,8}$/.test(digits)) return null;
    if (digits.length === 10) return `${digits.slice(0, 3)}-${digits.slice(3, 6)}-${digits.slice(6)}`;
    return `${digits.slice(0, 3)}-${digits.slice(3, 7)}-${digits.slice(7, 11)}`;
  }

  function goHome() {
    window.location.href = "home.html";
  }

  document.getElementById("agreeBtn").addEventListener("click", () => {
    let saved = "";
    try { saved = sessionStorage.getItem("signupPhone") || ""; } catch (_) {}
    if (saved) {
      goHome();
      return;
    }
    phoneErr.hidden = true;
    phoneModal.classList.add("is-open");
    phoneInput.focus();
  });

  document.getElementById("phoneCloseBtn").addEventListener("click", () => {
    phoneModal.classList.remove("is-open");
  });
  phoneModal.addEventListener("click", (e) => {
    if (e.target === phoneModal) phoneModal.classList.remove("is-open");
  });
  phoneInput.addEventListener("input", () => {
    phoneErr.hidden = true;
  });
  document.getElementById("phoneOkBtn").addEventListener("click", () => {
    const digits = phoneInput.value.replace(/\D/g, "");
    const formatted = formatPhone(digits);
    if (!formatted) {
      phoneErr.hidden = false;
      phoneInput.focus();
      return;
    }
    try { sessionStorage.setItem("signupPhone", formatted); } catch (_) {}
    goHome();
  });
</script>
</body>
</html>
