<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동의 · 간편가입 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar"><a class="back" href="login.html">←</a></header>
  <h1>세 가지를 확인합니다</h1>
  <p class="lead">구글, 카카오, 네이버로 가입할 때 물어봐요.</p>
  <div class="check" id="phoneCheck"><span class="mark">✓</span><div><b>전화번호</b><p>가입 뒤 한 번만 확인해요. 화면에는 가운데를 가려 보여요.</p></div></div>
  <div class="check"><span class="mark">✓</span><div><b>위치</b><p>가장 가까운 건물만 남기고, 좌표는 저장하지 않아요.</p></div></div>
  <div class="check"><span class="mark">✓</span><div><b>사진 외부 AI</b><p>종류와 색을 읽어요. 얼굴과 카드 번호는 보내기 전에 가려요.</p></div></div>
  <p class="note danger" id="consentErr" hidden></p>
  <div class="dock">
    <a class="btn" id="agreeBtn" href="home.html">동의하고 계속</a>
  </div>
</main>
<script src="api.js"></script>
<script>
  // 간편 로그인(구글·카카오·네이버)은 백엔드에 없다. 이 화면은 지금 체험 로그인(?demo=1) 동의로 쓴다.
  // 체험 계정은 이메일을 받지 않으므로 전화번호 항목을 숨기고, 위치·외부 AI 동의로 POST /auth/demo
  // 캡차: 지금은 LostApi 기본 dev-pass. PR #47 머지 후 이 화면에 found/captcha.js 위젯(action "demo-login")을 붙이고
  // LostApi.setCaptchaProvider로 넘긴다
  const isDemo = new URLSearchParams(location.search).get("demo") === "1";
  const agreeBtn = document.getElementById("agreeBtn");
  const consentErr = document.getElementById("consentErr");
  if (isDemo) {
    document.querySelector(".lead").textContent = "체험 계정을 만들 때 물어봐요. 체험 계정은 24시간 뒤 지워져요.";
    document.getElementById("phoneCheck").style.display = "none";
    document.querySelector("h1").textContent = "두 가지를 확인합니다";
  }
  let busy = false;
  agreeBtn.addEventListener("click", async (e) => {
    e.preventDefault();
    if (busy) return;
    if (!isDemo) {
      consentErr.textContent = "간편 로그인은 준비 중이에요. 학교 이메일로 가입하거나 체험해 보기를 눌러 주세요.";
      consentErr.hidden = false;
      return;
    }
    busy = true;
    consentErr.hidden = true;
    try {
      await LostApi.demoLogin({ location: true });
      location.replace("home.html");
    } catch (err) {
      consentErr.textContent = LostApi.friendlyMessage(err);
      consentErr.hidden = false;
    } finally {
      busy = false;
    }
  });
</script>
</body>
</html>
