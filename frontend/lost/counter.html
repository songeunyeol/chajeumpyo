<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교무처 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar"><a class="back" href="candidates.html">←</a><h2>찾는 방법</h2></header>
  <h1>교무처에서 확인해요</h1>
  <p class="lead">온라인 확인이 닫힌 물건이에요. 학생증을 가지고 가면 직원이 한 번 더 보고 돌려줘요.</p>
  <div class="map-box" id="centerMap" aria-label="교무처 위치 지도"></div>
  <div class="card">
    <h3>교무처</h3>
    <p class="meta">혜인관 1층 · 평일 9~18시</p>
  </div>
  <div class="dock">
    <a class="btn" href="candidates.html">후보로</a>
  </div>
</main>
<script src="../naver-map.js"></script>
<script>
  if (window.NaverCampusMap) {
    window.NaverCampusMap.mount(document.getElementById("centerMap"), {
      buildingName: "혜인관",
      caption: "서경대 혜인관 1층 · 교무처"
    });
  }
</script>
</body>
</html>
