<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사진 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
<style>
  /* 사람 확인: 사진 바로 아래, 늘 보이게 */
  .captcha-area { margin-top: 18px; }
  .captcha-area[hidden] { display: none; }
  .captcha-area .captcha-label { margin: 0 0 8px; font-size: 14px; font-weight: 700; color: var(--ink); }
  .captcha-area #captchaBox { display: flex; justify-content: center; min-height: 65px; }
  .btn[aria-disabled="true"] { opacity: .45; }
  /* 사진 찍기 · 앨범에서 선택을 바로 고르는 두 버튼 (QA 10/29) */
  .upload-box.is-picker { cursor: default; }
  .upload-box.is-picker:hover { border-color: #c8bfb0; }
  .pick-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 320px; }
  .pick-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    height: 112px; border: 0; border-radius: 16px; background: var(--soft); color: var(--green);
    font-size: 15px; font-weight: 650; cursor: pointer;
  }
  .pick-btn svg { width: 28px; height: 28px; }
  .pick-btn b { color: var(--ink); font-size: 15px; }
  .pick-btn:active { transform: scale(0.98); }
  .reselect-row { display: flex; justify-content: center; margin: -6px 0 4px; }
  .reselect-row[hidden] { display: none; }
</style>
</head>
<body>
<main class="screen">
  <header class="bar"><a class="back" href="consent.html">←</a></header>
  <h1>물건 사진을 올려 주세요</h1>
  <p class="lead">물건이 잘 보이게 찍어 주세요.</p>

  <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
  <input type="file" id="albumInput" accept="image/*" hidden>

  <div class="upload-box is-picker" id="uploadBox" aria-label="분실물 사진">
    <div class="upload-empty">
      <div class="pick-row">
        <button type="button" class="pick-btn" id="cameraBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
            <circle cx="12" cy="13" r="3.5"/>
          </svg>
          <b>사진 찍기</b>
        </button>
        <button type="button" class="pick-btn" id="albumBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="9" cy="9" r="2"/>
            <path d="m21 15-5-5L5 21"/>
          </svg>
          <b>앨범에서 선택</b>
        </button>
      </div>
    </div>

    <img class="upload-preview" id="uploadPreview" alt="업로드된 분실물 사진">
    <div class="upload-sample" aria-label="업로드된 분실물 사진 미리보기">
      <svg viewBox="0 0 320 224" preserveAspectRatio="xMidYMid slice" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block">
        <rect width="320" height="224" fill="#e6dfd2"/>
        <ellipse cx="160" cy="172" rx="64" ry="12" fill="rgba(28,25,21,0.10)"/>
        <rect x="104" y="64" width="112" height="104" rx="36" fill="#ffffff" stroke="#d5cbbd" stroke-width="2"/>
        <line x1="106" y1="108" x2="214" y2="108" stroke="#e4ddd2" stroke-width="2"/>
        <rect x="146" y="103" width="28" height="10" rx="5" fill="#d5cbbd"/>
        <circle cx="160" cy="136" r="4" fill="#1e5b3d"/>
      </svg>
    </div>

  </div>

  <div class="reselect-row" id="reselectRow" hidden>
    <button type="button" class="reselect-btn" id="reselectBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
      다시 선택
    </button>
  </div>

  <!-- 사람 확인(Turnstile). 캡차가 켜진 배포에서만 보인다 -->
  <section class="captcha-area" id="captchaArea" hidden>
    <p class="captcha-label">사람 확인</p>
    <div id="captchaBox"></div>
  </section>

  <div class="dock">
    <p class="note danger" id="captchaNote" style="margin:0" role="alert" hidden></p>
    <a class="btn" id="nextBtn" href="uploading.html" aria-disabled="true">이 사진으로</a>
  </div>
</main>
<script src="api.js"></script>
<script src="captcha.js"></script>
<script>
  // 동의 화면을 거치지 않았으면 동의부터 (주소로 바로 들어오거나 앞으로 가기로 온 경우)
  function guardPhoto() {
    try {
      if (sessionStorage.getItem("foundConsent") !== "granted") return "consent.html";
      if (sessionStorage.getItem("foundDraft")) return "register.html";
    } catch (_) {}
    return null;
  }
  const photoRedirect = guardPhoto();
  if (photoRedirect) location.replace(photoRedirect);
  window.addEventListener("pageshow", () => {
    const next = guardPhoto();
    if (next) location.replace(next);
  });

  const box = document.getElementById("uploadBox");
  const cameraInput = document.getElementById("cameraInput");
  const albumInput = document.getElementById("albumInput");
  const preview = document.getElementById("uploadPreview");
  const reselectBtn = document.getElementById("reselectBtn");
  const reselectRow = document.getElementById("reselectRow");
  let currentUrl = null;
  /** 줄인 사진을 sessionStorage에 넣었으면 true. 그 전에는 다음으로 넘어가지 않는다 */
  let photoReady = false;

  function setUploadedFile(file) {
    if (!file.type.startsWith("image/")) {
      resetToUploadBox();
      showCaptchaNote("사진 파일만 올릴 수 있어요.");
      return;
    }
    photoReady = false;
    updateNext();
    // 새 사진이면 이전 분석 결과는 쓰지 않는다(올리는 중 화면이 다시 분석한다)
    try {
      sessionStorage.removeItem("foundDraft");
      sessionStorage.removeItem("foundConfirmedId");
    } catch (_) {}
    suggestBuildingFromPhoto(file);
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl = URL.createObjectURL(file);
    preview.src = currentUrl;
    box.classList.remove("is-sample", "show-reselect", "is-picker");
    box.classList.add("has-photo", "is-file");
    reselectRow.hidden = false;

    // 휴대폰 사진은 수 MB라 sessionStorage(약 5MB)에 안 들어간다. 긴 변 1600px JPEG로 줄여서 둔다 (F-01)
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      try {
        sessionStorage.setItem("foundPhoto", canvas.toDataURL("image/jpeg", 0.85));
        photoReady = true;
        showCaptchaNote("");
      } catch (_) {
        showCaptchaNote("사진을 저장하지 못했어요. 다른 사진으로 다시 골라 주세요.");
      }
      updateNext();
    };
    img.onerror = () => {
      resetToUploadBox();
      showCaptchaNote("사진을 읽지 못했어요. 다른 사진으로 다시 골라 주세요.");
    };
    img.src = currentUrl;
  }

  // 사진에 찍힌 위치(EXIF GPS)로 주운 건물을 추천한다. 위치 동의를 끈 경우엔 읽지 않는다.
  // 좌표는 브라우저 안에서 건물로 바꾼 뒤 버리고 건물만 둔다. 등록 화면이 현재 위치로 건물을 못 찾았을 때만 쓴다.
  async function suggestBuildingFromPhoto(file) {
    try {
      sessionStorage.removeItem("photoBuilding");
      if (sessionStorage.getItem("locationConsent") === "denied") return;
    } catch (_) {
      return;
    }
    const here = await FoundApi.exifGps(file);
    if (!here) return;
    try {
      const b = FoundApi.nearestTo(here, await FoundApi.buildings());
      if (b) sessionStorage.setItem("photoBuilding", JSON.stringify({ id: b.id, name: b.name }));
    } catch (_) {}
  }

  function resetToUploadBox() {
    if (currentUrl) {
      URL.revokeObjectURL(currentUrl);
      currentUrl = null;
    }
    preview.removeAttribute("src");
    cameraInput.value = "";
    albumInput.value = "";
    box.classList.remove("has-photo", "is-file", "is-sample", "show-reselect");
    box.classList.add("is-picker");
    reselectRow.hidden = true;
    try {
      sessionStorage.removeItem("foundPhoto");
      sessionStorage.removeItem("photoBuilding");
    } catch (_) {}
    photoReady = false;
    updateNext();
  }

  document.getElementById("cameraBtn").addEventListener("click", () => cameraInput.click());
  document.getElementById("albumBtn").addEventListener("click", () => albumInput.click());
  for (const input of [cameraInput, albumInput]) {
    input.addEventListener("change", () => {
      if (input.files && input.files[0]) setUploadedFile(input.files[0]);
    });
  }

  // 다시 선택: 사진을 지우고 두 버튼으로 돌아간다
  reselectBtn.addEventListener("click", () => {
    resetToUploadBox();
    showCaptchaNote("");
  });

  // 사람 확인: 토큰을 받기 전에는 다음 화면으로 넘어가지 않는다. 토큰은 다음 화면의 등록 요청이 쓴다
  // 위젯 오류(도메인 미등록 등)·30초 시간 초과·불러오기 실패면 버튼을 되돌리고 안내한다. 다시 누르면 다시 시도한다.
  const nextBtn = document.getElementById("nextBtn");
  const NEXT_LABEL = nextBtn.textContent;
  const captchaBox = document.getElementById("captchaBox");
  const captchaNote = document.getElementById("captchaNote");
  const showCaptchaNote = (text) => {
    captchaNote.textContent = text;
    captchaNote.hidden = !text;
  };
  const setBusy = (busy) => {
    if (busy) {
      nextBtn.setAttribute("aria-busy", "true");
      nextBtn.textContent = "확인 중…";
    } else {
      nextBtn.removeAttribute("aria-busy");
      nextBtn.textContent = NEXT_LABEL;
      updateNext();
    }
  };
  const MOUNT_FAILED = "사람 확인을 불러오지 못했어요. 인터넷 연결을 확인하고 '이 사진으로'를 다시 눌러 주세요.";
  const VERIFY_FAILED = "사람인지 확인하지 못했어요. '이 사진으로'를 다시 눌러 주세요.";

  // 사진과 사람 확인이 둘 다 끝나야 버튼이 켜진다. 꺼진 버튼을 누르면 무엇이 남았는지 알려 준다
  const captchaArea = document.getElementById("captchaArea");
  let captchaMode = null; // "turnstile" | "off" | null(불러오는 중·실패)
  let hasToken = false;
  function missingStep() {
    if (!photoReady) return box.classList.contains("has-photo") ? "사진을 준비하고 있어요. 잠시만요." : "사진을 먼저 올려 주세요.";
    if (captchaMode === "turnstile" && !hasToken) return "아래 '사람 확인'을 먼저 마쳐 주세요.";
    return null;
  }
  function updateNext() {
    if (nextBtn.getAttribute("aria-busy") === "true") return;
    nextBtn.setAttribute("aria-disabled", missingStep() ? "true" : "false");
  }

  function mountCaptcha() {
    return FoundCaptcha.mount(captchaBox, {
      appearance: "always",
      onError: () => showCaptchaNote(VERIFY_FAILED),
      onToken: (t) => {
        hasToken = !!t;
        if (t && captchaNote.textContent === VERIFY_FAILED) showCaptchaNote("");
        updateNext();
      },
    }).then((c) => {
      captchaMode = c.mode;
      captchaArea.hidden = c.mode !== "turnstile";
      updateNext();
      return c;
    }).catch(() => {
      showCaptchaNote(MOUNT_FAILED);
      return null;
    });
  }
  let captchaReady = mountCaptcha();

  nextBtn.addEventListener("click", async (e) => {
    e.preventDefault();
    if (nextBtn.getAttribute("aria-busy") === "true") return;
    const missing = missingStep();
    if (missing) {
      showCaptchaNote(missing);
      if (!photoReady && !box.classList.contains("has-photo")) document.getElementById("cameraBtn").focus();
      return;
    }
    setBusy(true);
    let captcha = await captchaReady;
    if (!captcha) {
      // 위젯을 못 그렸다 → 다시 그려 본다
      showCaptchaNote("");
      captchaReady = mountCaptcha();
      captcha = await captchaReady;
      if (!captcha) {
        setBusy(false);
        return;
      }
    }
    try {
      await captcha.ready();
    } catch (_) {
      // 오류·시간 초과: 버튼을 되돌리고, 위젯을 새로 돌려 다음 시도를 준비한다
      setBusy(false);
      showCaptchaNote(VERIFY_FAILED);
      captcha.reset();
      return;
    }
    showCaptchaNote("");
    location.href = nextBtn.href;
  });

  // 뒤로 가기로 돌아오면(bfcache) 이미 쓴 토큰이 남아 있을 수 있어 새로 받는다
  window.addEventListener("pageshow", async (e) => {
    if (!e.persisted) return;
    setBusy(false);
    showCaptchaNote("");
    (await captchaReady)?.reset();
  });
</script>
</body>
</html>
