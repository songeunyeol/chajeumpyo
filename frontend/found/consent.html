<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동의 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
<style>.btn[aria-disabled="true"] { opacity: .45; }</style>
</head>
<body>
<main class="screen">
  <header class="bar"><a class="back" href="../index.html">←</a></header>
  <h1>두 가지를 확인해요</h1>
  <p class="lead">눌러서 동의해 주세요.</p>
  <div class="check is-toggle is-off" id="aiConsent" role="checkbox" aria-checked="false" tabindex="0">
    <span class="mark">✓</span>
    <div>
      <b>사진 분석 <span class="check-tag">(필수)</span></b>
      <p>올린 사진을 AI가 보고 물건 종류와 색을 알아봐요.<br>얼굴과 카드 번호는 AI로 보내기 전에 가려요.</p>
    </div>
  </div>
  <div class="check is-toggle is-off" id="locConsent" role="checkbox" aria-checked="false" tabindex="0">
    <span class="mark">✓</span>
    <div>
      <b>위치 <span class="check-tag">(선택)</span></b>
      <p>가장 가까운 건물만 남기고, 좌표는 저장하지 않아요.<br>허용하지 않아도 건물을 직접 고를 수 있어요.</p>
    </div>
  </div>
  <div class="dock">
    <p class="note" id="consentNote" style="margin:0" hidden>사진 분석에 동의해야 등록할 수 있어요.</p>
    <a class="btn" id="consentNextBtn" href="photo.html" aria-disabled="true">동의하고 계속</a>
  </div>
</main>
<script>
  // 시작 화면이다. 이 탭에 끝난 등록이 남아 있으면 지우고 새로 시작한다 (QA 10/30).
  // 끝나지 않은 초안(foundDraft만 있고 foundConfirmedId가 다름)은 사진·등록 화면에서 이어 쓸 수 있게 둔다.
  try {
    const draft = JSON.parse(sessionStorage.getItem("foundDraft") || "null");
    const confirmedId = sessionStorage.getItem("foundConfirmedId");
    if (confirmedId && (!draft || draft.id === confirmedId)) {
      for (const k of [
        "foundDraft", "foundConfirmedId", "foundDonePage", "foundResult", "foundPhoto", "photoBuilding",
        "registeredAt", "foundBuilding", "foundFloor", "locationDetail", "handoverBuilding",
      ]) sessionStorage.removeItem(k);
    }
  } catch (_) {}

  // 동의는 사용자가 직접 누른다(처음엔 모두 꺼 둠, QA 10/29). 사진 분석(필수)을 켜야 다음으로 간다
  const aiConsent = document.getElementById("aiConsent");
  const locConsent = document.getElementById("locConsent");
  const consentNextBtn = document.getElementById("consentNextBtn");
  const consentNote = document.getElementById("consentNote");
  const isOn = (el) => !el.classList.contains("is-off");

  function sync() {
    consentNextBtn.setAttribute("aria-disabled", String(!isOn(aiConsent)));
    if (isOn(aiConsent)) consentNote.hidden = true;
  }

  function bindToggle(el) {
    const toggle = () => {
      const off = el.classList.toggle("is-off");
      el.setAttribute("aria-checked", String(!off));
      sync();
    };
    el.addEventListener("click", toggle);
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        toggle();
      }
    });
  }
  bindToggle(aiConsent);
  bindToggle(locConsent);
  sync();

  consentNextBtn.addEventListener("click", (e) => {
    if (!isOn(aiConsent)) {
      e.preventDefault();
      consentNote.hidden = false;
      return;
    }
    try {
      sessionStorage.setItem("foundConsent", "granted");
      sessionStorage.setItem("locationConsent", isOn(locConsent) ? "granted" : "denied");
    } catch (_) {}
  });
</script>
</body>
</html>
