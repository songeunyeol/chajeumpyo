<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동의 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
</head>
<body>
<main class="screen">
  <header class="bar"><a class="back" href="../index.html">←</a></header>
  <h1>두 가지를 확인합니다</h1>
  <div class="check">
    <span class="mark">✓</span>
    <div>
      <b>사진 외부 AI <span class="check-tag">(필수)</span></b>
      <p>종류와 색을 읽어요. 얼굴과 카드 번호는 보내기 전에 가려요.</p>
    </div>
  </div>
  <div class="check is-toggle" id="locConsent" role="checkbox" aria-checked="true" tabindex="0">
    <span class="mark">✓</span>
    <div>
      <b>위치 <span class="check-tag">(선택)</span></b>
      <p>가장 가까운 건물만 남기고, 좌표는 저장하지 않아요. 허용하지 않으면 건물을 직접 고를 수 있어요.</p>
    </div>
  </div>
  <div class="dock">
    <a class="btn" id="consentNextBtn" href="photo.html">동의하고 계속</a>
  </div>
</main>
<script>
  const locConsent = document.getElementById("locConsent");
  const consentNextBtn = document.getElementById("consentNextBtn");

  try {
    if (sessionStorage.getItem("locationConsent") === "denied") {
      locConsent.classList.add("is-off");
      locConsent.setAttribute("aria-checked", "false");
    }
  } catch (_) {}

  function toggleLocConsent() {
    const isOff = locConsent.classList.toggle("is-off");
    locConsent.setAttribute("aria-checked", String(!isOff));
    try {
      sessionStorage.setItem("locationConsent", isOff ? "denied" : "granted");
    } catch (_) {}
  }

  locConsent.addEventListener("click", toggleLocConsent);
  locConsent.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      toggleLocConsent();
    }
  });

  consentNextBtn.addEventListener("click", () => {
    try {
      const isOff = locConsent.classList.contains("is-off");
      sessionStorage.setItem("locationConsent", isOff ? "denied" : "granted");
    } catch (_) {}
  });
</script>
</body>
</html>
