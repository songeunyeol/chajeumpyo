<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>등록 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
<style>
  /* 보조 설명은 회색 작은 글씨, 필수는 * (QA 10/29) */
  .field .hint { font-size: 12.5px; font-weight: 500; color: var(--mute); margin-left: 4px; }
  .field .req { color: var(--danger); margin-left: 2px; }
  .field .req[hidden] { display: none; }
  .floor-row { display: grid; grid-template-columns: 1fr 112px; gap: 8px; }
  .place-text { border-radius: 14px; background: var(--white); padding: 14px 16px; font-size: 15px; font-weight: 650; }
  .place-text small { display: block; margin-top: 2px; font-size: 12.5px; font-weight: 500; color: var(--mute); }
  .manual-loc-panel.is-open { max-height: 420px; }
</style>
</head>
<body>
<main class="screen">
  <header class="bar" style="justify-content:space-between">
    <a class="back" href="photo.html">←</a>
    <button type="button" class="loc-chip" id="locPermToggle">위치 확인 중</button>
  </header>
  <h1>어디에 두었나요</h1>

  <label class="field">
    <span>물건<span class="req">*</span><span class="hint">다르면 눌러서 고쳐 주세요</span></span>
    <select id="itemSelect" aria-label="물건 종류"></select>
  </label>

  <div class="manual-loc-panel" id="manualLocPanel">
    <div class="field">
      <div class="field-head">
        <label for="foundBuildingSelect"><span>주운 위치/건물<span class="req" id="buildingReq">*</span></span></label>
        <span class="loc-chip is-manual" id="manualChip" style="cursor:default">직접 골라 주세요</span>
      </div>
      <div class="floor-row">
        <select id="foundBuildingSelect" aria-label="주운 건물 선택">
          <option value="" selected>건물 선택</option>
        </select>
        <select id="floorSelect" aria-label="층 선택">
          <option value="" selected>층 모름</option>
        </select>
      </div>
      <div class="map-box" id="registerMap" aria-label="고른 건물 지도" hidden></div>
    </div>

    <label class="field" style="margin-bottom:8px">
      <span>위치 세부 설명<span class="hint">(선택)</span></span>
      <textarea id="locationDetail" class="compact" rows="2" placeholder="예: 3층 엘리베이터 앞 벤치 위, 204호 강의실 뒤쪽 책상"></textarea>
    </label>
    <p class="note" id="locNote" style="margin-top:0;margin-bottom:4px">보관처에 맡겨도 교무처 직원이 볼 수 있게 같이 전달돼요.</p>
    <p class="note danger" id="locStatus" hidden></p>
  </div>

  <p class="section">보관<span style="color:var(--danger);margin-left:2px">*</span></p>
  <p class="note" id="valuableNote" style="margin-top:0;margin-bottom:8px" hidden>이 물건은 귀중품이라 보관처에 맡겨 주세요. 잃어버린 사람이 직원 확인을 거쳐 찾아가요.</p>
  <p class="note" id="valuableInfo" style="margin-top:0;margin-bottom:8px"></p>
  <button type="button" class="choice on" id="choiceInplace" style="width:100%;border:0;cursor:pointer;text-align:left">
    <span>그 자리에 둠</span>
  </button>
  <button type="button" class="choice" id="choiceHandover" style="width:100%;border:0;cursor:pointer;text-align:left">
    <span>보관처에 맡김</span>
  </button>

  <div class="handover-panel" id="handoverPanel">
    <div class="field" style="margin-bottom:0">
      <span>맡길 곳</span>
      <!-- 보관처가 한 곳이면 글자로 보여 주고, 여러 곳이 되면 고르게 한다 -->
      <div class="place-text" id="placeText" hidden></div>
      <select id="handoverSelect" aria-label="보관처 선택" hidden></select>
    </div>
  </div>

  <div class="dock">
    <button type="button" class="btn" id="submitBtn" style="width:100%;cursor:pointer">등록 완료</button>
  </div>
</main>
<script src="../naver-map.js"></script>
<script src="api.js"></script>
<script src="../leave-guard.js"></script>
<script>
  const manualLocPanel = document.getElementById("manualLocPanel");
  const foundBuildingSelect = document.getElementById("foundBuildingSelect");
  const locationDetail = document.getElementById("locationDetail");
  const locPermToggle = document.getElementById("locPermToggle");
  const choiceInplace = document.getElementById("choiceInplace");
  const choiceHandover = document.getElementById("choiceHandover");
  const handoverPanel = document.getElementById("handoverPanel");
  const handoverSelect = document.getElementById("handoverSelect");
  const submitBtn = document.getElementById("submitBtn");

  const floorSelect = document.getElementById("floorSelect");
  const placeText = document.getElementById("placeText");
  const manualChip = document.getElementById("manualChip");
  let mode = "inplace";
  // 브라우저 위치 권한. 선택 동의(locationConsent)와 섞지 않는다. 동의는 기본 해제.
  let hasLocationPermission = false;
  let browserPermission = "unknown";
  let locateSeq = 0;
  /** 위치를 찾는 중이면 true */
  let locating = false;
  /** 위치로 고른 가장 가까운 건물. 못 고르면(권한 없음·300m 밖) null이고 직접 고른다 */
  let autoBuilding = null;
  /** autoBuilding을 현재 위치가 아니라 사진 위치(EXIF, 사진 화면에서 건물로 바꿔 둠)로 골랐는지 */
  let fromPhoto = false;
  let paintedBuilding = "";
  let submitting = false;

  // 분석 결과 (uploading.html이 저장). 없으면 사진부터
  const draft = FoundApi.store.get("foundDraft");
  if (!draft) {
    let back = "photo.html";
    try {
      if (sessionStorage.getItem("foundConsent") !== "granted") back = "consent.html";
    } catch (_) {}
    window.location.replace(back);
  }
  window.addEventListener("pageshow", () => {
    if (FoundApi.store.get("foundDraft")) return;
    let back = "photo.html";
    try {
      if (sessionStorage.getItem("foundConsent") !== "granted") back = "consent.html";
    } catch (_) {}
    window.location.replace(back);
  });
  // 이미 등록을 마친 초안이면(완료 화면에서 뒤로 가기) 완료 화면으로 (QA 10/29)
  try {
    if (draft && sessionStorage.getItem("foundConfirmedId") === draft.id) {
      window.location.replace(sessionStorage.getItem("foundDonePage") || "done-inplace.html");
    }
  } catch (_) {}
  if (draft) {
    LeaveGuard.install({
      title: "습득물 등록을 그만할까요?",
      message: "지금까지 올린 내용은 지워져요. 그래도 나갈까요?",
      leaveLabel: "그만하기",
      leaveTo: "photo.html",
      onLeave: () => {
        for (const k of ["foundDraft", "foundPhoto", "photoBuilding"]) sessionStorage.removeItem(k);
      },
    });
  }
  // 물건 종류: AI가 알아본 것을 고르고, 잘못 봤으면 습득자가 고친다. 값은 "큰종류" 또는 "큰종류:세부종류"
  const itemSelect = document.getElementById("itemSelect");
  const aiItem = draft?.category ? (draft.subCategory ? `${draft.category}:${draft.subCategory}` : draft.category) : "";
  if (!draft?.category) itemSelect.add(new Option("확인 중인 물건 · 관리자가 확인해요", "", true, true));
  // 분류별로 묶고, 세부 종류가 있는 종류의 나머지("기타 ○○")는 분류 맨 뒤에 둔다 (QA 10/29)
  const ITEM_GROUPS = [
    ["카드·신분증", ["ID_CARD", "DRIVER_LICENSE", "PAYMENT_CARD", "TRANSIT_CARD", "OTHER_CARD"]],
    ["지갑·현금", ["WALLET", "CASH"]],
    ["전자기기", ["PHONE", "TABLET", "LAPTOP", "SMARTWATCH", "EARPHONE", "CHARGER"]],
    ["가방·옷", ["BAG", "CLOTHING", "HAT"]],
    ["생활용품", ["GLASSES", "ACCESSORY", "UMBRELLA", "TUMBLER", "KEY"]],
    ["책·필기구", ["BOOK", "STATIONERY"]],
    ["그 밖의 물건", ["ETC"]],
  ];
  /** 세부 종류에 없는 나머지 이름. 기타 카드·기타처럼 이미 나머지인 종류도 맨 뒤로 */
  const REST_LABELS = {
    OTHER_CARD: "기타 카드",
    WALLET: "기타 지갑",
    EARPHONE: "기타 이어폰",
    CHARGER: "기타 전자기기",
    BAG: "기타 가방",
    CLOTHING: "기타 옷",
    ACCESSORY: "기타 액세서리",
    KEY: "기타 열쇠",
    BOOK: "기타 책",
    STATIONERY: "기타 필기구",
    ETC: "기타 물건",
  };
  for (const [name, cats] of ITEM_GROUPS) {
    const group = document.createElement("optgroup");
    group.label = name;
    const rest = [];
    for (const cat of cats) {
      const subs = FoundApi.SUB_CATEGORIES[cat] || [];
      for (const sub of subs) group.append(new Option(FoundApi.SUB_CATEGORY_LABELS[sub], `${cat}:${sub}`));
      if (REST_LABELS[cat]) rest.push(new Option(REST_LABELS[cat], cat));
      else group.append(new Option(FoundApi.CATEGORY_LABELS[cat], cat));
    }
    group.append(...rest);
    itemSelect.append(group);
  }
  itemSelect.value = aiItem;
  const pickedItem = () => {
    const [category, subCategory = null] = itemSelect.value.split(":");
    return { category: category || null, subCategory };
  };

  function formatKoreanTime(d) {
    const days = ["일", "월", "화", "수", "목", "금", "토"];
    const m = d.getMonth() + 1;
    const day = d.getDate();
    const dow = days[d.getDay()];
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    return `${m}월 ${day}일(${dow}) ${hh}:${mm}`;
  }

  function paintRegisterMap() {
    const box = document.getElementById("registerMap");
    const name = (foundBuildingSelect.selectedOptions[0]?.textContent || "").trim();
    const known = name && window.NaverCampusMap && window.NaverCampusMap.CAMPUS_BUILDINGS[name];
    if (!known) {
      paintedBuilding = "";
      box.hidden = true;
      return;
    }
    if (name === paintedBuilding) return;
    paintedBuilding = name;
    window.NaverCampusMap.mount(box, { buildingName: name, caption: `서경대 ${name}` });
  }

  // 주운 위치·자세한 위치는 그 자리에 둠과 보관처에 맡김이 같이 쓴다(맡겨도 교무처 직원에게 전달된다).
  // 위치로 가까운 건물을 찾았으면 미리 골라 두고, 보관처 칸은 맡길 때만 보인다
  function syncPanels() {
    manualLocPanel.classList.add("is-open");
    handoverPanel.classList.toggle("is-open", mode === "handover");
    const auto = !!autoBuilding;
    // .loc-chip은 display:inline-flex라 hidden 속성으로 안 숨는다 → style로 숨긴다 (QA: 허용해도 "권한 없음"이 남던 문제)
    manualChip.style.display = auto ? "none" : "";
    if (auto && !foundBuildingSelect.value) foundBuildingSelect.value = String(autoBuilding.id);
    document.getElementById("buildingReq").hidden = mode !== "inplace";

    if (locating) {
      locPermToggle.textContent = "위치 확인 중";
      locPermToggle.classList.remove("is-manual");
    } else if (autoBuilding) {
      locPermToggle.textContent = fromPhoto ? `사진 위치로 고른 건물: ${autoBuilding.name}` : `가까운 건물: ${autoBuilding.name}`;
      locPermToggle.classList.remove("is-manual");
    } else if (hasLocationPermission) {
      locPermToggle.textContent = "근처 건물을 못 찾았어요 · 다시 찾기";
      locPermToggle.classList.add("is-manual");
    } else {
      locPermToggle.textContent = "위치로 찾기";
      locPermToggle.classList.add("is-manual");
    }
    paintRegisterMap();
  }

  try {
    hasLocationPermission = sessionStorage.getItem("locationConsent") === "granted";
  } catch (_) {}

  function readBrowserPermission() {
    if (!navigator.permissions || !navigator.permissions.query) return Promise.resolve("unknown");
    return navigator.permissions.query({ name: "geolocation" }).then((res) => {
      browserPermission = res.state;
      res.onchange = () => {
        browserPermission = res.state;
        if (res.state === "granted") locate();
      };
      return res.state;
    }).catch(() => "unknown");
  }

  syncPanels();

  // 위쪽 칩: 건물을 못 찾았으면 눌러서 위치로 다시 찾는다. 누르는 것이 위치 사용 동의다(좌표는 건물로 바꾼 뒤 버린다)
  let locateQueued = false;
  async function locate() {
    if (!buildings.length) {
      locateQueued = true;
      return;
    }
    locateQueued = false;
    const seq = ++locateSeq;
    locating = true;
    syncPanels();
    const located = await FoundApi.nearestBuilding(buildings);
    if (seq !== locateSeq) return;
    locating = false;
    const locStatus = document.getElementById("locStatus");
    const tellLoc = (text) => {
      locStatus.hidden = !text;
      locStatus.textContent = text;
    };
    if (located.status === "granted") {
      hasLocationPermission = true;
      browserPermission = "granted";
      tellLoc(located.building ? "" : "근처에서 건물을 찾지 못했어요. 목록에서 골라 주세요.");
    } else if (located.status === "denied") {
      hasLocationPermission = false;
      browserPermission = "denied";
      tellLoc("위치 권한을 허용하지 않아 건물을 찾지 못했어요. 목록에서 골라 주세요.");
    } else {
      hasLocationPermission = browserPermission === "granted";
      tellLoc("위치를 받지 못했어요. 목록에서 건물을 골라 주세요.");
    }
    try {
      if (located.status === "granted") sessionStorage.setItem("locationConsent", "granted");
      else if (located.status === "denied") sessionStorage.setItem("locationConsent", "denied");
    } catch (_) {}
    const found = located.building;
    if (found) {
      // 습득자가 이미 다른 건물을 골랐으면 그대로 둔다
      const prev = autoBuilding;
      if (!foundBuildingSelect.value || (prev && foundBuildingSelect.value === String(prev.id))) {
        foundBuildingSelect.value = String(found.id);
      }
      autoBuilding = found;
      fromPhoto = false;
    }
    syncPanels();
  }
  locPermToggle.addEventListener("click", () => {
    if (autoBuilding && !fromPhoto) return;
    locate();
  });

  foundBuildingSelect.addEventListener("change", () => {
    foundBuildingSelect.style.boxShadow = "";
    paintRegisterMap();
  });

  choiceInplace.addEventListener("click", () => {
    mode = "inplace";
    choiceInplace.classList.add("on");
    choiceHandover.classList.remove("on");
    syncPanels();
  });

  choiceHandover.addEventListener("click", () => {
    mode = "handover";
    choiceHandover.classList.add("on");
    choiceInplace.classList.remove("on");
    syncPanels();
  });

  // 귀중품이 무엇인지 미리 알려 준다 (QA 10/29)
  document.getElementById("valuableInfo").textContent =
    `귀중품(${FoundApi.VALUABLE_CATEGORIES.map((c) => (c === "EARPHONE" ? "이어폰" : FoundApi.CATEGORY_LABELS[c])).join(", ")})은 보관처에 맡겨 주세요.`;

  // 층: 지하 2층 ~ 15층. 모르면 비운다
  for (let f = -2; f <= 15; f++) {
    if (f === 0) continue;
    floorSelect.add(new Option(f < 0 ? `지하 ${-f}층` : `${f}층`, String(f)));
  }

  // 귀중품은 보관처(교무처)에만 맡길 수 있다. 서버도 그 자리에 둠을 400으로 거절한다 (QA B11)
  function lockToHandover() {
    choiceInplace.style.display = "none"; // .choice가 display:flex라 hidden 속성으로는 안 숨는다
    choiceInplace.disabled = true;
    document.getElementById("valuableNote").hidden = false;
    choiceHandover.click();
  }
  function unlockInplace() {
    choiceInplace.style.display = "";
    choiceInplace.disabled = false;
    document.getElementById("valuableNote").hidden = true;
  }
  const isValuable = (category) => FoundApi.VALUABLE_CATEGORIES.includes(category);
  if (draft && draft.isValuable) lockToHandover();
  itemSelect.addEventListener("change", () => {
    const { category } = pickedItem();
    if (!category) return;
    if (isValuable(category)) lockToHandover();
    else unlockInplace();
  });

  // 건물·보관처 목록을 서버에서 받는다
  let buildings = [];
  function fillSelect(select, items, placeholder) {
    select.innerHTML = "";
    if (placeholder) select.add(new Option(placeholder, "", true, true));
    for (const it of items) select.add(new Option(it.label, String(it.value)));
  }
  FoundApi.buildings()
    .then(async (list) => {
      buildings = list;
      fillSelect(foundBuildingSelect, list.map((b) => ({ label: b.name, value: b.id })), "건물 선택");
      const state = await readBrowserPermission();
      if (state === "denied") hasLocationPermission = false;
      if (locateQueued || (hasLocationPermission && state !== "denied")) await locate();
      if (!autoBuilding) {
        const p = FoundApi.store.get("photoBuilding");
        autoBuilding = (p && list.find((b) => b.id === p.id)) || null;
        fromPhoto = !!autoBuilding;
      }
      syncPanels();
      return FoundApi.storagePlaces(autoBuilding?.id);
    })
    .then((places) => {
      fillSelect(handoverSelect, places.map((p) => ({ label: `${p.building.name} · ${p.name}`, value: p.id })));
      handoverSelect._places = places;
      // 보관처가 한 곳이면 고를 것 없이 글자로 보여 준다 (QA 10/29)
      if (places.length === 1) {
        const p = places[0];
        placeText.innerHTML = "";
        placeText.append(`${p.building.name} · ${p.name}`);
        const small = document.createElement("small");
        small.textContent = p.guideText;
        placeText.append(small);
        placeText.hidden = false;
        handoverSelect.hidden = true;
      } else {
        placeText.hidden = true;
        handoverSelect.hidden = false;
      }
    })
    .catch((err) => alert(err.message));

  submitBtn.addEventListener("click", async () => {
    if (submitting || !draft) return;
    // 그 자리에 두면 건물이 필요하고, 맡기면 모를 때 비워도 된다
    if (mode === "inplace" && !foundBuildingSelect.value) {
      foundBuildingSelect.style.boxShadow = "inset 0 0 0 2px var(--danger)";
      foundBuildingSelect.focus();
      return;
    }
    const buildingId = foundBuildingSelect.value ? Number(foundBuildingSelect.value) : undefined;
    const body = {
      confirmToken: draft.confirmToken,
      storageType: mode === "handover" ? "HANDED_OVER" : "IN_PLACE",
      ...(buildingId ? { buildingId } : {}),
      ...(mode === "handover" ? { storagePlaceId: Number(handoverSelect.value) } : {}),
      ...(locationDetail.value.trim() ? { locationDetail: locationDetail.value.trim() } : {}),
      ...(floorSelect.value ? { floor: Number(floorSelect.value) } : {}),
    };
    // AI가 본 것과 다르게 골랐을 때만 보낸다
    if (draft.category && itemSelect.value !== aiItem) Object.assign(body, pickedItem());

    submitting = true;
    submitBtn.textContent = "등록하는 중…";
    let result;
    try {
      result = await FoundApi.confirm(draft.id, body);
    } catch (err) {
      submitting = false;
      submitBtn.textContent = "등록 완료";
      if (err.code === "ALREADY_CONFIRMED") {
        result = FoundApi.store.get("foundResult");
      } else if (err.code === "VALUABLE_HAND_OVER_REQUIRED") {
        // 초안은 서버에 남아 있으니 보관처를 골라 다시 누르면 된다
        lockToHandover();
        alert(err.message);
        return;
      } else if (err.status === 404) {
        alert(err.message);
        window.location.href = "photo.html";
        return;
      } else {
        alert(err.details.length ? err.details.map((d) => d.message).join("\n") : err.message);
        return;
      }
    }

    FoundApi.store.set("foundResult", result);
    const donePage = mode === "handover" ? "done-handover.html" : "done-inplace.html";
    try {
      sessionStorage.setItem("foundConfirmedId", draft.id);
      sessionStorage.setItem("foundDonePage", donePage);
      sessionStorage.setItem("registeredAt", formatKoreanTime(new Date()));
      sessionStorage.setItem("foundBuilding", result?.building?.name || "");
      if (body.locationDetail) sessionStorage.setItem("locationDetail", body.locationDetail);
      else sessionStorage.removeItem("locationDetail");
      if (body.floor !== undefined) sessionStorage.setItem("foundFloor", String(body.floor));
      else sessionStorage.removeItem("foundFloor");
      if (result?.storagePlace) {
        sessionStorage.setItem("handoverBuilding", `${result.storagePlace.name} · ${result.storagePlace.guideText}`);
      }
    } catch (_) {}
    // 등록 화면은 history에서 빼서, 완료 화면에서 뒤로 가도 다시 등록하지 않게 한다
    window.location.replace(donePage);
  });
</script>
</body>
</html>
