<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보관처에 맡김 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar"><a class="back" href="register.html">←</a></header>
  <h1>보관처에 맡겨 주세요</h1>
  <div class="thanks-box">
    분실물을 지나치지 않고 올려 주셔서 감사해요.<br>덕분에 주인이 소중한 물건을 다시 찾을 수 있어요.
  </div>

  <div class="done-photo" role="img" aria-label="업로드한 분실물 사진">
    <img id="doneImg" alt="업로드한 분실물 사진" hidden>
    <svg id="doneFallback" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="320" height="200" fill="#e6dfd2"/>
      <ellipse cx="160" cy="158" rx="64" ry="12" fill="rgba(28,25,21,0.10)"/>
      <rect x="104" y="52" width="112" height="104" rx="36" fill="#ffffff" stroke="#d5cbbd" stroke-width="2"/>
      <line x1="106" y1="96" x2="214" y2="96" stroke="#e4ddd2" stroke-width="2"/>
      <rect x="146" y="91" width="28" height="10" rx="5" fill="#d5cbbd"/>
      <circle cx="160" cy="124" r="4" fill="#1e5b3d"/>
    </svg>
  </div>

  <div class="map-box" id="doneMapBox" aria-label="주운 곳 지도"></div>

  <table class="kv">
    <tr><th>보관</th><td>보관처에 맡김</td></tr>
    <tr><th>맡긴 곳</th><td id="handoverPlace">교무처 · 혜인관 1층 교무처 · 평일 9~18시</td></tr>
    <tr><th>시각</th><td id="doneTime"></td></tr>
  </table>

  <div class="dock">
    <a class="btn" href="../index.html">처음 화면</a>
  </div>
</main>
<script src="../naver-map.js"></script>
<script>
  function formatKoreanTime(d) {
    const days = ["일", "월", "화", "수", "목", "금", "토"];
    const m = d.getMonth() + 1;
    const day = d.getDate();
    const dow = days[d.getDay()];
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    return `${m}월 ${day}일(${dow}) ${hh}:${mm}`;
  }

  const doneTimeEl = document.getElementById("doneTime");
  doneTimeEl.textContent = formatKoreanTime(new Date());

  try {
    const savedPhoto = sessionStorage.getItem("foundPhoto");
    if (savedPhoto) {
      const img = document.getElementById("doneImg");
      const fb = document.getElementById("doneFallback");
      img.src = savedPhoto;
      img.hidden = false;
      fb.style.display = "none";
    }
    const savedTime = sessionStorage.getItem("registeredAt");
    if (savedTime) {
      doneTimeEl.textContent = savedTime;
    }
    const savedBldg = sessionStorage.getItem("handoverBuilding");
    if (savedBldg) {
      document.getElementById("handoverPlace").textContent = savedBldg;
    }
  } catch (_) {}
  // 서버 등록 결과 (register.html이 저장): 주운 건물, 검토 대기·귀중품 안내
  try {
    const result = JSON.parse(sessionStorage.getItem("foundResult") || "null");
    if (result) {
      const table = document.querySelector("table.kv");
      const row = table.insertRow(0);
      row.innerHTML = "<th>주운 곳</th><td></td>";
      // 층은 공개 화면·후보 카드에는 숨기지만, 올린 본인 완료 화면에는 보여 준다 (QA 10/30)
      const savedFloor = sessionStorage.getItem("foundFloor");
      const floor = savedFloor ? (Number(savedFloor) < 0 ? `지하 ${-Number(savedFloor)}층` : `${Number(savedFloor)}층`) : "";
      row.cells[1].textContent = [result.building ? result.building.name : "모름", floor].filter(Boolean).join(" ");
      const notes = [result.message, result.handOverAdvice && result.handOverAdvice.message].filter(Boolean);
      for (const text of notes) {
        const p = document.createElement("p");
        p.className = "note";
        p.textContent = text;
        table.after(p);
      }
    }
  } catch (_) {}

  let pinName = "혜인관";
  try {
    const result = JSON.parse(sessionStorage.getItem("foundResult") || "null");
    if (result && result.building && result.building.name) pinName = result.building.name;
    const savedBuilding = sessionStorage.getItem("foundBuilding");
    if (savedBuilding) pinName = savedBuilding.split(" · ")[0].trim();
  } catch (_) {}
  if (window.NaverCampusMap) {
    window.NaverCampusMap.mount(document.getElementById("doneMapBox"), {
      buildingName: pinName,
      caption: `서경대 ${pinName} · 주운 곳`,
    });
  }
</script>
</body>
</html>
