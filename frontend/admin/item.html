<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>습득물 상세 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar"><a class="back" href="items.html">←</a><h2>습득물</h2></header>
  <p class="lead" id="loading">불러오는 중…</p>
  <div id="view" style="display:none"></div>
  <p class="note danger" id="error" role="alert" hidden></p>
</main>
<script src="admin.js"></script>
<script>
  AdminApi.requireLogin();
  const { el } = AdminApi;
  const id = new URLSearchParams(location.search).get("id");
  const view = document.getElementById("view");
  const error = document.getElementById("error");

  function optionList(map, current) {
    const nodes = [el("option", { value: "", text: "선택" })];
    for (const [key, label] of Object.entries(map)) {
      const node = el("option", { value: key, text: label });
      if (key === current) node.selected = true;
      nodes.push(node);
    }
    return nodes;
  }

  function photoTabs(item) {
    const shots = [
      ["원본", item.originalImageUrl, "관리자만 봐요"],
      ["공개본", item.publicImageUrl, "확인을 통과한 학생이 봐요"],
      ["블러본", item.thumbnailUrl, "후보 목록에 나와요"],
    ];
    const img = el("img", { alt: "습득물 사진", style: "width:100%;height:100%;object-fit:cover" });
    const empty = el("div", { style: "height:100%;display:grid;place-items:center;color:var(--mute);font-size:14px", text: "사진이 없어요. 수령이나 기한 만료 뒤엔 지워요." });
    const frame = el("div", { class: "done-photo" }, img, empty);
    const caption = el("p", { class: "note", style: "margin-top:0" });
    function showShot(url, note) {
      caption.textContent = note;
      if (url) {
        img.src = url;
        img.hidden = false;
        AdminApi.show(empty, false);
      } else {
        img.hidden = true;
        AdminApi.show(empty, true);
      }
    }
    const chips = el("div", { class: "chips", style: "margin-top:0" });
    shots.forEach(([label, url, note], index) => {
      const button = el("button", {
        type: "button",
        class: "chip",
        style: "border:0;cursor:pointer;background:var(--white);color:var(--ink)",
        text: label,
        onclick: () => {
          [...chips.children].forEach((node) => { node.style.boxShadow = ""; });
          button.style.boxShadow = "inset 0 0 0 1.5px var(--green)";
          showShot(url, note);
        },
      });
      if (index === 0) button.style.boxShadow = "inset 0 0 0 1.5px var(--green)";
      chips.append(button);
    });
    showShot(shots[0][1], shots[0][2]);
    return el("div", {}, chips, frame, caption);
  }

  function recordList(title, rows) {
    const box = el("div", {}, el("p", { class: "section", text: title }));
    if (!rows.length) {
      box.append(el("p", { class: "note", style: "margin-top:0", text: "기록이 없어요." }));
      return box;
    }
    for (const row of rows) box.append(el("div", { class: "card" }, el("h3", { text: row.title }), el("p", { class: "meta", text: row.meta })));
    return box;
  }

  function render(item) {
    document.getElementById("loading").style.display = "none";
    AdminApi.show(view, true);
    const holding = ["REGISTERED", "REVEALED"].includes(item.status);
    const featureText = (item.features || []).map((feature) => `${AdminApi.FEATURE_KEY_LABELS[feature.key] || feature.key}: ${feature.value}`).join(", ");
    const blocks = [
      el("h1", { text: AdminApi.itemTitle(item), style: "margin-top:8px" }),
      el("div", { class: "chips" }, AdminApi.statusChip(item.status), item.claimLockedAt ? el("span", { class: "chip danger", text: "대면 확인" }) : null),
      photoTabs(item),
      el("p", { class: "section", text: "AI가 읽은 정보" }),
      el("table", { class: "kv" },
        el("tr", {}, el("th", { text: "종류" }), el("td", { text: AdminApi.itemLabel(item.category, item.subCategory) || "확인 전" })),
        el("tr", {}, el("th", { text: "색" }), el("td", { text: AdminApi.COLOR_LABELS[item.color] || "모름" })),
        el("tr", {}, el("th", { text: "브랜드" }), el("td", { text: item.brand || "없음" })),
        el("tr", {}, el("th", { text: "특징" }), el("td", { text: featureText || "없음" })),
        el("tr", {}, el("th", { text: "설명" }), el("td", { text: item.description || "없음" })),
        item.hiddenTrait ? el("tr", {}, el("th", { text: "숨은 특징" }), el("td", { text: item.hiddenTrait })) : null),
      el("p", { class: "note", text: "숨은 특징은 학생 화면에 나오지 않아요. 사진 링크는 10분 뒤 닫혀요." }),
      el("p", { class: "section", text: "보관" }),
      el("table", { class: "kv" },
        el("tr", {}, el("th", { text: "주운 곳" }), el("td", { text: AdminApi.placeText(item) })),
        el("tr", {}, el("th", { text: "보관" }), el("td", { text: AdminApi.STORAGE_LABELS[item.storageType] || "확인 전" })),
        el("tr", {}, el("th", { text: "보관처" }), el("td", { text: item.storagePlace?.name || "없음" })),
        el("tr", {}, el("th", { text: "습득" }), el("td", { text: AdminApi.formatTime(item.foundAt) }))),
    ];

    if (item.status === "REVIEW") blocks.push(reviewForm(item));
    if (holding) blocks.push(editForm(item));
    if (item.claimLockedAt && holding) blocks.push(inPersonForm(item));

    blocks.push(recordList("확인 시도", (item.attempts || []).map((row) => ({
      title: `${row.emailMasked} · ${AdminApi.MATCH_RESULT_LABELS[row.result] || row.result}`,
      meta: AdminApi.formatTime(row.createdAt),
    }))));
    blocks.push(recordList("열람", (item.reveals || []).map((row) => ({
      title: row.emailMasked,
      meta: AdminApi.formatTime(row.revealedAt),
    }))));
    blocks.push(recordList("수령", (item.pickups || []).map((row) => ({
      title: `${AdminApi.PICKUP_METHOD_LABELS[row.method] || row.method} · ${AdminApi.PICKUP_STATUS_LABELS[row.status] || row.status}`,
      meta: [row.emailMasked || "계정 없음", row.verificationNote, AdminApi.formatTime(row.completedAt || row.createdAt)].filter(Boolean).join(" · "),
    }))));

    view.replaceChildren(...blocks);
  }

  function reviewForm(item) {
    const category = el("select", {}, ...optionList(AdminApi.CATEGORY_LABELS, item.category || ""));
    const description = el("textarea", { class: "compact", maxlength: "500", placeholder: "실물과 맞춰 짧게 적어요" });
    const formError = el("p", { class: "note danger", hidden: true });
    const button = el("button", { type: "button", class: "btn", style: "width:100%;cursor:pointer", text: "등록" });
    button.addEventListener("click", async () => {
      if (!category.value || !description.value.trim()) {
        AdminApi.showError(formError, "종류와 설명을 적어 주세요.");
        return;
      }
      button.disabled = true;
      try {
        const next = await AdminApi.updateItem(item.id, {
          category: category.value,
          description: description.value.trim(),
          title: AdminApi.CATEGORY_LABELS[category.value],
          status: "REGISTERED",
        });
        render(next);
      } catch (err) {
        button.disabled = false;
        AdminApi.showError(formError, err);
      }
    });
    return el("div", {},
      el("p", { class: "section", text: "검토 대기 · 직접 등록" }),
      el("p", { class: "lead", text: "종류와 설명을 정하면 등록되고, 비슷한 분실 신고에 후보 알림이 가요." }),
      el("label", { class: "field" }, el("span", { text: "종류" }), category),
      el("label", { class: "field" }, el("span", { text: "설명" }), description),
      formError,
      button);
  }

  function editForm(item) {
    const title = el("input", { value: item.title || "", maxlength: "60" });
    const color = el("select", {}, ...optionList(AdminApi.COLOR_LABELS, item.color || ""));
    const brand = el("input", { value: item.brand || "", maxlength: "40", placeholder: "없으면 비워요" });
    const description = el("textarea", { class: "compact", maxlength: "500" });
    description.value = item.description || "";
    const formError = el("p", { class: "note danger", hidden: true });
    const button = el("button", { type: "button", class: "btn white", style: "width:100%;cursor:pointer", text: "바꾼 내용 저장" });
    button.addEventListener("click", async () => {
      const body = {};
      if (title.value.trim() && title.value.trim() !== (item.title || "")) body.title = title.value.trim();
      if ((color.value || null) !== (item.color || null)) body.color = color.value || null;
      if ((brand.value.trim() || null) !== (item.brand || null)) body.brand = brand.value.trim() || null;
      if (description.value.trim() && description.value.trim() !== (item.description || "")) body.description = description.value.trim();
      if (!Object.keys(body).length) {
        AdminApi.showError(formError, "바꾼 내용이 없어요.");
        return;
      }
      button.disabled = true;
      try {
        const next = await AdminApi.updateItem(item.id, body);
        render(next);
      } catch (err) {
        button.disabled = false;
        AdminApi.showError(formError, err);
      }
    });
    return el("div", {},
      el("p", { class: "section", text: "보관 중 · 속성 고치기" }),
      el("label", { class: "field" }, el("span", { text: "제목" }), title),
      el("label", { class: "field" }, el("span", { text: "색" }), color),
      el("label", { class: "field" }, el("span", { text: "브랜드" }), brand),
      el("label", { class: "field" }, el("span", { text: "설명" }), description),
      formError,
      button);
  }

  function inPersonForm(item) {
    const note = el("textarea", { class: "compact", maxlength: "200", placeholder: "학생증 이름과 숨은 특징이 맞았는지. 번호 전체는 적지 마세요." });
    const formError = el("p", { class: "note danger", hidden: true });
    const button = el("button", { type: "button", class: "btn", style: "width:100%;cursor:pointer", text: "대면 확인 후 수령" });
    button.addEventListener("click", async () => {
      const text = note.value.trim();
      if (text.length < 1 || text.length > 200) {
        AdminApi.showError(formError, "확인 메모는 1자에서 200자까지예요.");
        return;
      }
      button.disabled = true;
      try {
        await AdminApi.inPersonPickup(item.id, text);
        render(await AdminApi.getItem(item.id));
      } catch (err) {
        button.disabled = false;
        AdminApi.showError(formError, err);
      }
    });
    return el("div", {},
      el("p", { class: "section", text: "대면 확인" }),
      el("p", { class: "lead", text: "온라인 확인이 막힌 물건이에요. 학생증과 숨은 특징을 직접 보고 돌려줘요." }),
      el("label", { class: "field" }, el("span", { text: "확인 메모" }), note),
      formError,
      button);
  }

  if (!id) {
    document.getElementById("loading").textContent = "";
    AdminApi.showError(error, "물건을 고르지 않았어요.");
  } else {
    AdminApi.getItem(id).then(render).catch((err) => {
      document.getElementById("loading").textContent = "";
      AdminApi.showError(error, err);
    });
  }
</script>
</body>
</html>
