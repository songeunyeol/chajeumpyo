<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>습득물 · 찾음표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar"><a class="back" href="home.html">←</a><h2>습득물</h2></header>
  <h1 id="title">전체 습득물</h1>
  <p class="lead" id="lead">불러오는 중…</p>

  <nav class="chips" id="filters" aria-label="상태" style="margin:0 0 20px"></nav>

  <div id="list"></div>
  <p class="note" id="empty" style="display:none">이 상태의 물건이 없어요.</p>
  <p class="note danger" id="error" role="alert" hidden></p>

  <div class="dock" id="pager" style="display:none;flex-direction:row;align-items:center">
    <button type="button" class="btn white" id="prev" style="flex:1;cursor:pointer">이전</button>
    <span id="pageNo" style="min-width:64px;text-align:center;color:var(--mute);font-size:14px"></span>
    <button type="button" class="btn white" id="next" style="flex:1;cursor:pointer">다음</button>
  </div>
</main>
<script src="admin.js"></script>
<script>
  AdminApi.requireLogin();
  const { el } = AdminApi;
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  let status = AdminApi.STATUS[params.get("status")] ? params.get("status") : "";
  let lockedOnly = params.get("locked") === "1";
  let page = Math.max(1, Number(params.get("page")) || 1);
  const demo = new URLSearchParams(location.search).get("demo") === "1" || Boolean(AdminApi.auth.get()?.demo);

  function withDemo(href) {
    if (!demo) return href;
    return href + (href.includes("?") ? "&demo=1" : "?demo=1");
  }

  /** 고른 칩은 기본 칩(초록), 나머지는 흰 칩 */
  function filterChip(value, label, count) {
    const on = !lockedOnly && value === status;
    return el(
      "button",
      {
        type: "button",
        class: "chip",
        "aria-pressed": on ? "true" : "false",
        style: `border:0;cursor:pointer;${on ? "box-shadow:inset 0 0 0 1.5px var(--green)" : "background:var(--white);color:var(--ink)"}`,
        onclick: () => {
          status = value;
          lockedOnly = false;
          page = 1;
          load();
        },
      },
      `${label} ${count}`,
    );
  }

  function card(item) {
    const chips = [AdminApi.statusChip(item.status)];
    if (item.claimLockedAt) chips.push(el("span", { class: "chip danger", text: "대면 확인만" }));
    if (item.storageType === "HANDED_OVER") chips.push(el("span", { class: "chip", style: "background:var(--white);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)", text: item.storagePlace ? item.storagePlace.name : "보관처에 맡김" }));
    else if (item.storageType === "IN_PLACE") chips.push(el("span", { class: "chip", style: "background:var(--white);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)", text: "그 자리에 둠" }));
    if (item.isSeed) chips.push(el("span", { class: "chip warn", text: "시연용" }));
    const label = AdminApi.itemLabel(item.category, item.subCategory);
    return el(
      "a",
      { class: "card", href: withDemo(`item.html?id=${encodeURIComponent(item.id)}`), style: "display:block" },
      el("h3", { text: AdminApi.itemTitle(item) }),
      el("p", { class: "meta", text: [label || "종류 확인 전", AdminApi.placeText(item), AdminApi.formatTime(item.foundAt)].join(" · ") }),
      el("div", { class: "chips" }, chips),
    );
  }

  async function load() {
    const q = new URLSearchParams();
    if (lockedOnly) q.set("locked", "1");
    else if (status) q.set("status", status);
    if (page > 1) q.set("page", String(page));
    if (demo) q.set("demo", "1");
    history.replaceState(null, "", `items.html${q.toString() ? `?${q}` : ""}`);
    $("title").textContent = lockedOnly ? "대면 확인" : status ? AdminApi.STATUS[status].label : "전체 습득물";
    AdminApi.showError($("error"));
    let r;
    try {
      r = await AdminApi.listItems({ status, page });
    } catch (err) {
      $("lead").textContent = "";
      return AdminApi.showError($("error"), err);
    }
    if (lockedOnly) {
      const lockedItems = r.items.filter((item) => item.claimLockedAt && item.status !== "CLAIMED" && item.status !== "EXPIRED");
      r = { ...r, items: lockedItems, total: lockedItems.length };
    }
    const pages = Math.max(1, Math.ceil(r.total / r.pageSize));
    if (page > pages) {
      page = pages;
      return load();
    }
    const all = Object.values(r.counts).reduce((a, b) => a + b, 0);
    $("lead").textContent = `${r.total}개 · 습득 시각 최신순`;

    const filters = $("filters");
    filters.replaceChildren(filterChip("", "전체", all));
    for (const s of AdminApi.STATUS_ORDER) {
      // 한 번도 없는 '등록 중'은 숨긴다
      if (s === "ANALYZING" && !r.counts[s] && status !== s) continue;
      filters.append(filterChip(s, AdminApi.STATUS[s].label, r.counts[s] || 0));
    }

    $("list").replaceChildren(...r.items.map(card));
    AdminApi.show($("empty"), r.items.length === 0);
    AdminApi.show($("pager"), pages > 1);
    $("pageNo").textContent = `${page} / ${pages}`;
    $("prev").disabled = page <= 1;
    $("next").disabled = page >= pages;
    $("prev").style.opacity = page <= 1 ? "0.4" : "";
    $("next").style.opacity = page >= pages ? "0.4" : "";
  }

  $("prev").addEventListener("click", () => {
    if (page > 1) {
      page -= 1;
      load().then(() => window.scrollTo(0, 0));
    }
  });
  $("next").addEventListener("click", () => {
    page += 1;
    load().then(() => window.scrollTo(0, 0));
  });
  load();
</script>
</body>
</html>
