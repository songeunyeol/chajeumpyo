<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알림 · 찾음표 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../palette.css">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e5b3d">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
</head>
<body>
<main class="screen">
  <header class="bar"><a class="back" href="home.html">←</a><h2>알림</h2></header>
  <h1>챙겨야 할 일</h1>
  <p class="lead" id="lead">불러오는 중…</p>
  <button type="button" class="btn white" id="readAll" style="width:100%;cursor:pointer;display:none">모두 읽음</button>
  <div id="list" style="margin-top:12px"></div>
  <p class="note danger" id="error" role="alert" hidden></p>
</main>
<script src="admin.js"></script>
<script>
  AdminApi.requireLogin();
  const { el } = AdminApi;
  const list = document.getElementById("list");
  const lead = document.getElementById("lead");
  const readAll = document.getElementById("readAll");

  function render(data) {
    lead.textContent = data.unreadCount ? `읽지 않은 알림 ${data.unreadCount}개` : "읽지 않은 알림이 없어요.";
    AdminApi.show(readAll, data.unreadCount > 0);
    if (!data.notifications.length) {
      list.replaceChildren(el("div", { class: "card", text: "아직 알림이 없어요." }));
      return;
    }
    list.replaceChildren(...data.notifications.map((item) => {
      const card = el("a", {
        class: "card",
        href: item.foundItemId ? `item.html?id=${encodeURIComponent(item.foundItemId)}` : "home.html",
        style: "display:block",
      },
      el("div", { class: "chips", style: "margin-top:0" },
        el("span", { class: item.readAt ? "chip" : "chip warn", text: AdminApi.NOTIFICATION_LABELS[item.type] || "알림" })),
      el("h3", { text: item.message }),
      el("p", { class: "meta", text: AdminApi.formatTime(item.createdAt) }));
      card.addEventListener("click", () => {
        if (!item.readAt) AdminApi.markRead(item.id).catch(() => {});
      });
      return card;
    }));
  }

  function load() {
    return AdminApi.notifications().then(render).catch((err) => AdminApi.showError(document.getElementById("error"), err));
  }

  readAll.addEventListener("click", async () => {
    readAll.disabled = true;
    try {
      await AdminApi.markAllRead();
      await load();
    } catch (err) {
      AdminApi.showError(document.getElementById("error"), err);
    } finally {
      readAll.disabled = false;
    }
  });

  load();
</script>
</body>
</html>
